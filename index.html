<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ⚠️ maximum-scale / user-scalable=no を付けないこと。
     ピンチズームを禁止すると WCAG 2.1 の 1.4.4(文字サイズの変更)に違反し、
     弱視の人が拡大できなくなります。iOS のズーム抑止目的で付けがちですが、
     入力欄は font-size:16px 以上にしてあるので自動ズームは起きません。
     viewport-fit=cover は iPhone のノッチ/ホームバー領域まで描画するため(safe-area と併用)。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マーログ</title>
<meta name="theme-color" content="#0017C1">
<!-- iPhoneでホーム画面に追加した際、ブラウザUIなしのフルスクリーンアプリ風に起動する -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マーログ">
<!-- サーバーにホストした場合はインストール可能なPWAとしても動作する(file://直接実行時は無効) -->

<style>
  /* デジタル庁デザインシステム準拠(高コントラスト・視認性重視のライトテーマ) */
  :root{
    --bg:#F1F1F4;          /* 背景 */
    --card:#FFFFFF;        /* カード */
    --card2:#F8F8FB;       /* 入力欄背景 */
    --line:#D8D8DB;        /* 罫線(3:1以上のUIコントラスト用に濃い線は--line2) */
    --line2:#949497;
    --txt:#1A1A1C;         /* 本文 (コントラスト比 16:1) */
    --sub:#595959;         /* 補足 (コントラスト比 7:1) */
    --acc:#0017C1;         /* プライマリ(デジタル庁ブルー) */
    --acc-dark:#00118F;
    --acc-bg:#E8F1FE;
    --red:#CE0000;         /* エラー/マイナス */
    --green:#197A4B;       /* 成功/プラス */
    --focus:#FFD43D;       /* フォーカスリング(黄) */
    --gold:#8A6A00;        /* 1位(コントラスト比4.5以上) */
    --gold-bg:#FFF3CD;
    --header-a:#FFFFFF;    /* ヘッダー背景グラデーション */
    --header-b:#F3F6FF;
    --line-green:#06C755;      /* LINE ブランドカラー(共有ボタン) */
    --line-green-dark:#05A948; /* 押したときの色 */
  }
  /* ダークモード(OS設定に自動追従。コントラスト比を保った配色) */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15161A;
      --card:#1E2026;
      --card2:#26282F;
      --line:#33353D;
      --line2:#54565F;
      --txt:#F1F1F4;
      --sub:#B4B4B8;
      --acc:#6E8CFF;
      --acc-dark:#889EFF;
      --acc-bg:#1F2A4D;
      --red:#FF6B6B;
      --green:#4FCB8C;
      --focus:#FFD43D;
      --gold:#E8C24A;
      --gold-bg:#3A331A;
      --header-a:#1E2026;
      --header-b:#191B2E;
    }
    /* ダークモードのアクセント色は明るいので、その上に載せる文字は暗色にしないと
       コントラスト比が足りない(白文字だと 2〜3:1 程度にしかならない) */
    .presets button.sel, .btn.main, .signbtn.on{ color:#0C0C0E; }
    /* 共有ボタンは明暗どちらでも LINE 緑 + 黒文字(打ち消し不要だが意図を明示) */
    .btn.main.linebtn{ color:#0C0C0E; }
    /* 黒いロゴは暗い背景で見えないので白へ反転(透過部分はそのまま残る) */
    header h1 .logo{ filter:invert(1); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 下部ナビの高さ + iPhone のホームバー(safe-area)分だけ本文の下に余白を取る */
  body{margin:0; font-family:"Noto Sans JP","Hiragino Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--txt); font-size:16px; line-height:1.5;
    padding-bottom:calc(76px + env(safe-area-inset-bottom, 0px));
    /* 横向きにしたときノッチ側が欠けないようにする(viewport-fit=cover の副作用) */
    padding-left:env(safe-area-inset-left, 0px); padding-right:env(safe-area-inset-right, 0px);
    -webkit-text-size-adjust:100%;}
  /* フォーカスインジケータ(キーボード操作時に明確に表示) */
  :focus-visible{outline:2px solid var(--txt); box-shadow:0 0 0 5px var(--focus); border-radius:4px;}
  /* ⚠️ 上の余白に safe-area-inset-top を足すこと。
     ホーム画面から起動(standalone)すると status-bar-style:black-translucent により
     コンテンツがステータスバーの下まで広がるため、足さないとロゴが時計に重なります(§6-32)。 */
  header{padding:calc(16px + env(safe-area-inset-top, 0px)) 16px 12px; text-align:center;
    background:linear-gradient(180deg, var(--header-a) 0%, var(--header-b) 100%);
    border-bottom:2px solid var(--acc);}
  header h1{margin:0; font-size:20px; letter-spacing:1px; color:var(--txt); font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px;}
  /* ロゴ画像。黒1色の透過PNGを data URL で埋め込んでいる(外部依存を作らないため)。
     ⚠️ ダークモードでは背景が暗いので filter:invert(1) で白に反転させる。
        別のロゴに差し替えるときも「黒1色・背景透過」を守ること(色付きだと反転で破綻する)。 */
  header h1 .logo{display:block; height:32px; width:auto; max-width:min(70vw, 280px);}
  nav{position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card);
    border-top:1px solid var(--line2); z-index:10; box-shadow:0 -2px 8px rgba(26,26,28,.06);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    padding-left:env(safe-area-inset-left, 0px); padding-right:env(safe-area-inset-right, 0px);}
  nav button{flex:1; background:none; border:none; border-top:3px solid transparent; color:var(--sub);
    padding:8px 0 10px; font-size:13px; cursor:pointer; min-height:56px;}
  nav button.on{color:var(--acc); font-weight:700; border-top-color:var(--acc); background:var(--acc-bg);}
  nav button .navicon{display:block; margin:0 auto 2px; width:22px; height:22px;}
  nav button .navicon svg{width:22px; height:22px; display:block; margin:0 auto;}
  main{max-width:560px; margin:0 auto; padding:12px;}
  section{display:none;}
  section.on{display:block;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px;
    box-shadow:0 1px 3px rgba(26,26,28,.08);}
  .card h2{margin:0 0 10px; font-size:16px; color:var(--txt); font-weight:700;
    border-left:4px solid var(--acc); padding-left:8px;}
  label{font-size:13px; color:var(--txt); font-weight:600; display:block; margin:10px 0 4px;}
  input[type=number], input[type=text], select{
    width:100%; background:var(--card); border:1px solid var(--line2); border-radius:8px;
    color:var(--txt); padding:10px; font-size:16px; min-height:44px;
  }
  .row{display:flex; gap:8px;}
  .row>*{flex:1;}
  .presets{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
  .presets button, .btn{
    background:var(--card); border:1px solid var(--acc); color:var(--acc);
    border-radius:8px; padding:10px 14px; font-size:15px; font-weight:600; cursor:pointer; min-height:44px;
  }
  .presets button.sel{background:var(--acc); border-color:var(--acc); color:#FFFFFF;}
  /* ⚠️ .btn.main は「全幅の主ボタン」用。width:100% を持つため、
     .btn.small と併用すると小さいボタンまで全幅になってしまう(履歴の「集計」が
     カード幅いっぱいに伸びる不具合があった)。.btn.small 側で明示的に打ち消している。 */
  .btn.main{background:var(--acc); border-color:var(--acc); color:#FFFFFF; font-weight:700; width:100%; padding:13px; font-size:16px;}
  .btn.main:active{background:var(--acc-dark);}
  /* 共有ボタンは LINE のブランドカラー。カードの枠は通常どおり(緑にしない)。
     ⚠️ #06C755 に白文字はコントラスト 2.26:1 で WCAG AA(4.5:1)に届かないため、
        文字は黒(#0C0C0E、11.4:1)にしている。白文字に戻さないこと。 */
  .btn.main.linebtn{background:var(--line-green); border-color:var(--line-green); color:#0C0C0E;}
  .btn.main.linebtn:active{background:var(--line-green-dark);}
  .btn.danger{color:var(--red); border-color:var(--red); background:var(--card);}
  /* 小ボタンもタップ領域は 44px 以上を確保する(WCAG 2.5.5 / モバイル前提) */
  .btn.small{padding:9px 14px; font-size:14px; min-height:44px; width:auto;}
  .btn.small.main{width:auto; padding:9px 16px; font-size:14px;}
  .btn:disabled, .btn:disabled:active{opacity:.45; cursor:not-allowed; transform:none;}
  /* アイコンだけのボタン(削除・確定・キャンセル)。44px 四方を確保する。
     ⚠️ 以前は <b onclick> で実装していたためキーボード操作もスクリーンリーダーも不可だった。
        必ず <button class="iconbtn"> と aria-label を使うこと。 */
  .iconbtn{display:inline-flex; align-items:center; justify-content:center;
    width:44px; min-width:44px; height:44px; padding:0; background:none; border:1px solid transparent;
    border-radius:8px; color:var(--acc); cursor:pointer; flex:0 0 auto;}
  .iconbtn svg{margin-right:0;}
  .iconbtn.danger{color:var(--red);}
  .iconbtn:active{background:var(--card2);}
  .hint{font-size:13px; color:var(--sub); margin-top:6px;}
  .warn{color:var(--red); font-size:14px; margin-top:8px; font-weight:700;}
  .ok{color:var(--green); font-size:14px; margin-top:8px; font-weight:700;}
  .memlist{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip-tag{background:var(--card2); border:1px solid var(--line2); border-radius:16px; padding:6px 12px; font-size:14px; display:flex; align-items:center; gap:6px;}
  .chip-tag b{cursor:pointer; color:var(--red);}
  .seatgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .seatlist{display:flex; flex-direction:column; gap:8px;}
  .seat{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:10px;}
  .seat .srow{display:flex; gap:8px; align-items:center;}
  .seat .srow select{flex:1.3; min-width:0;}
  .seat .srow input[type=number]{flex:1; min-width:0;}
  .seat .num{color:var(--sub); font-size:14px; font-weight:700; flex:0 0 16px;}
  .seat .auto{color:var(--acc); border-color:var(--acc); background:var(--acc-bg);}
  /* 入力欄の外側に表示する下2桁(百点単位入力の補助表示) */
  .seat .unit{flex:0 0 auto; color:var(--sub); font-size:15px; font-weight:700; letter-spacing:1px;}
  /* 符号反転ボタン(±): モバイルの数字キーパッドにマイナスキーが無い端末でも負の点数を入力できるようにする */
  .signbtn{flex:0 0 40px; padding:0; font-size:16px; font-weight:700; min-height:44px; min-width:40px;}
  /* 符号モードが「−」のとき。次に入力する数字がマイナスになることを一目で分かるようにする */
  .signbtn.on{background:var(--red); border-color:var(--red); color:#fff;}
  .listrow{display:flex; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px solid var(--line); font-size:15px;}
  .listrow .linkname{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* margin-left:auto で、1列目がプレーンな<span>の行(チップ入力など)でも右端に寄せる */
  .listrow .meta{color:var(--sub); font-size:13px; display:flex; align-items:center; gap:8px; flex:0 1 auto; min-width:0; max-width:62%; margin-left:auto; justify-content:flex-end;}
  .listrow .meta .metatext{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:0 1 auto;}
  .listrow .meta .btn, .listrow .meta b, .listrow .meta input{flex:0 0 auto;}
  /* 1列目がプレーンな<span>の行(チップ入力など)の名前も、長い場合は...で省略する */
  .listrow>span:first-child{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .linkname{background:none; border:none; padding:8px 0; margin:0; color:var(--acc); font-size:15px; font-weight:600;
    text-decoration:underline; cursor:pointer; min-height:44px; text-align:left;}
  .flags{display:flex; gap:12px; margin-top:6px; font-size:14px; color:var(--txt); flex-wrap:wrap;}
  .flags label{display:flex; align-items:center; gap:8px; margin:0; font-size:14px; font-weight:400; min-height:44px;}
  input[type=checkbox]{width:22px; height:22px; accent-color:var(--acc); flex:0 0 auto;}
  /* 表は横に詰まりやすいので、数値列は等幅数字にして桁をそろえる */
  table{width:100%; border-collapse:collapse; font-size:14px;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
  th,td{padding:8px 3px; text-align:right; border-bottom:1px solid var(--line);}
  th{color:var(--sub); font-weight:600; font-size:12px; border-bottom:2px solid var(--line2);}
  th:first-child, td:first-child{text-align:left;}
  .plus{color:var(--green); font-weight:600;}
  .minus{color:var(--red); font-weight:600;}
  .gamecard{position:relative;}
  /* カードの見出し行。タイトルが長くてもボタンが押し出されないよう、
     タイトル側を縮め(min-width:0)、ボタン側は縮めない(flex:0 0 auto)。 */
  .gtitle{font-size:14px; color:var(--txt); margin-bottom:6px; display:flex;
    justify-content:space-between; align-items:center; gap:10px;}
  .gtitle>:first-child{min-width:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .gtitle>.btn, .gtitle>button{flex:0 0 auto;}
  .badge{font-size:11px; border:1px solid var(--line2); border-radius:4px; padding:2px 7px; color:var(--sub);
    font-weight:600; white-space:nowrap;}
  textarea{width:100%; height:140px; background:var(--card2); border:1px solid var(--line2); border-radius:8px; color:var(--txt); padding:10px; font-size:13px;}
  .bigmoney{font-size:18px; font-weight:700;}
  .center{text-align:center;}
  .mt{margin-top:10px;}
  /* ---------- 履歴: 「卓の合計」と「各半荘」の親子関係 ----------
     どちらも “名前と収支の表” なので、同じ見た目だと取り違える。
     合計 = 枠を太く・数字を大きく「このカードが結論」と分かるように、
     各半荘 = 一段インデントして左のレール線でぶら下がりを示す。
     ⚠️ この差を消すと、卓の通算と1局分の結果を読み間違えます。 */
  .session{margin-bottom:22px;}
  .card.summary{border:2px solid var(--acc); margin-bottom:0;}
  .card.summary td:last-child{font-size:15px; font-weight:700;}
  .card.summary th{font-size:11px;}
  /* 各半荘は合計カードと同じ幅に揃える(インデントや縦のレール線は付けない)。
     親子関係は、合計カードの青い太枠と、各局の背景色の差だけで示す。 */
  .session .games{padding-top:10px;}
  .session .games details.acc{background:var(--card2);}
  .session .games details.acc summary{font-size:14px; padding:10px 14px; justify-content:flex-start;}
  .session .games details.acc summary::after{margin-left:auto;}
  /* 第N局の番号チップ。何局目かを一目で拾えるようにする */
  .roundno{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px;
    border-radius:11px; background:var(--acc-bg); color:var(--acc); font-size:12px; font-weight:700;
    padding:0 7px; margin-right:7px; flex:0 0 auto;}
  /* 履歴アコーディオン */
  details.acc{border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--card);}
  details.acc summary{list-style:none; cursor:pointer; padding:12px 14px; font-size:15px; font-weight:600;
    display:flex; justify-content:space-between; align-items:center; min-height:48px;}
  details.acc summary::-webkit-details-marker{display:none;}
  details.acc summary::after{content:'▾'; color:var(--acc); font-size:14px; margin-left:8px; transition:transform .15s;}
  details.acc[open] summary::after{transform:rotate(180deg);}
  details.acc .accbody{padding:0 14px 12px;}
  details.acc summary .meta{color:var(--sub); font-size:13px; font-weight:400;}
  /* 設定サマリー */
  /* 卓の参加メンバーを変えるボタンの置き場(§6-31)。
     ⚠️ 参加メンバーの一覧をここに常時表示しないこと。ダイアログの中だけで見せる。 */
  .poolbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px;}
  .setgrid{display:flex; gap:8px; margin-top:8px;}
  .setgrid>div{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:10px 6px; text-align:center;}
  .setgrid .setlabel{display:block; font-size:12px; color:var(--sub); font-weight:600;}
  /* 設定値(点5 / 10-30 / 500円)はキーカラーの青にして、ラベルや補足と見分けやすくする */
  .setgrid .setval{display:block; font-size:16px; font-weight:700; color:var(--acc); margin-top:2px;}
  /* グラフ(横棒) */
  .barchart{margin-top:10px;}
  .barrow{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:13px;}
  .barrow:last-child{margin-bottom:0;}
  .barlabel{flex:0 0 68px; color:var(--sub); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
  .bartrack{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:6px; height:16px; overflow:hidden;}
  .barfill{height:100%; border-radius:6px; min-width:2px;}
  .barfill.pos{background:var(--green);}
  .barfill.neg{background:var(--red);}
  .barfill.acc{background:var(--acc);}
  .barval{flex:0 0 82px; text-align:right; font-weight:700; font-size:13px;}
  /* 1位セレブレーション */
  tr.rank1 td{background:var(--gold-bg); font-weight:700;}
  tr.rank1 td:first-child{border-radius:6px 0 0 6px;}
  tr.rank1 td:last-child{border-radius:0 6px 6px 0;}
  .crown{color:var(--gold); vertical-align:-2px; margin-right:2px;}
  @keyframes crownpop{0%{transform:scale(0) rotate(-20deg);}70%{transform:scale(1.25) rotate(5deg);}100%{transform:scale(1) rotate(0);}}
  .crown{display:inline-block; animation:crownpop .5s ease-out;}
  @media (prefers-reduced-motion: reduce){ .crown{animation:none;} }
  .btn:active, .presets button:active{transform:translateY(1px);}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;}
  /* トースト・モーダル(alert/confirm の置き換え) */
  .toast-container{position:fixed; bottom:70px; left:0; right:0; display:flex; flex-direction:column; align-items:center;
    gap:8px; z-index:60; pointer-events:none; padding:0 16px;}
  .toast{display:flex; align-items:center; gap:10px; background:var(--txt); color:#fff; padding:11px 16px; border-radius:10px;
    font-size:14px; font-weight:600; opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s;
    max-width:100%; box-shadow:0 4px 14px rgba(0,0,0,.25); pointer-events:auto;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.toast-error{background:var(--red);}
  .toast.toast-ok{background:var(--green);}
  .toast-action{background:none; border:1px solid rgba(255,255,255,.7); color:#fff; border-radius:6px; padding:8px 12px;
    font-size:13px; font-weight:700; cursor:pointer; flex:0 0 auto; min-height:44px;}
  .overlay{position:fixed; inset:0; background:rgba(26,26,28,.5); display:none; align-items:center; justify-content:center;
    z-index:70; padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card); border-radius:14px; padding:20px; max-width:340px; width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .modal p{margin:0 0 18px; font-size:15px; line-height:1.6; color:var(--txt); white-space:pre-wrap;}
  .modal .row{gap:10px;}
  /* 半荘のリザルト表などを入れる領域。中身が無いときは詰めない */
  .modalbody{margin:0 0 16px;}
  .modalbody:empty{display:none; margin:0;}
  .modalbody table{font-size:13px;}
  .modalbody th,.modalbody td{padding:7px 3px;}
  /* chooseDialog 用。選択肢は縦積みにして、名前が長くても押し間違えないようにする */
  .modalchoices{display:flex; flex-direction:column; gap:8px;}
  .modalchoices:empty{display:none;}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none;} }

  /* ---------- 狭い画面(iPhone SE 等 375px 以下)向けの詰め ----------
     要素を小さくするのではなく、余白と文字サイズだけを落として
     タップ領域(44px)は維持する。 */
  @media (max-width:400px){
    main{padding:10px 8px;}
    .card{padding:13px 12px; border-radius:10px;}
    table{font-size:13px;}
    th,td{padding:7px 2px;}
    th{font-size:11px;}
    .bigmoney{font-size:16px;}
    .setgrid{gap:6px;}
    .setgrid>div{padding:9px 4px;}
    .setgrid .setval{font-size:15px;}
    .seat{padding:8px;}
    .seat .srow{gap:6px;}
    .barlabel{flex-basis:56px;}
    .barval{flex-basis:74px;}
    .listrow .meta{max-width:58%; gap:4px;}
  }
  /* 横向き・小さい高さのときはヘッダーを薄くして入力欄を優先する */
  @media (max-height:480px){
    header{padding:8px 16px 6px;}
    header h1{font-size:16px;}
  }
</style>
</head>

<main>

<!-- ============ 対局(設定+入力+履歴) ============ -->
<section id="tab-game">
  <div class="card">
    <div class="gtitle"><span style="color:var(--txt); font-weight:700; font-size:16px;">ゲーム設定</span>
      <button class="btn small" id="settingsToggleBtn" onclick="toggleSettings()" aria-expanded="false">変更</button></div>
    <div id="setupSummary"></div>
    <div id="settingsPanel" style="display:none;">
      <h2 class="mt">レート</h2>
      <div class="presets" id="ratePresets">
        <button data-v="3">点3</button><button data-v="5">点5</button><button data-v="10">点10</button>
      </div>
      <label for="rate">カスタム(点◯)</label>
      <input type="number" id="rate" min="0" step="0.5" inputmode="numeric">
      <h2 class="mt">ウマ</h2>
      <div class="presets" id="umaPresets">
        <button data-v="5-10">5-10</button><button data-v="10-20">10-20</button><button data-v="10-30">10-30</button>
      </div>
      <div class="row mt">
        <div><label for="uma2">2着⇔3着(小)</label><input type="number" id="uma2" min="0" inputmode="numeric"></div>
        <div><label for="uma1">1着⇔4着(大)</label><input type="number" id="uma1" min="0" inputmode="numeric"></div>
      </div>
      <h2 class="mt">オカ</h2>
      <div class="presets" id="okaPresets">
        <button data-v="25000-30000">25000-30000</button><button data-v="25000-27000">25000-27000</button><button data-v="30000-30000">オカなし</button>
      </div>
      <div class="row mt">
        <div><label for="okaStart">配給原点</label><input type="number" id="okaStart" min="0" step="1000" inputmode="numeric"></div>
        <div><label for="okaRet">返し点</label><input type="number" id="okaRet" min="0" step="1000" inputmode="numeric"></div>
      </div>
      <div id="okaCalc" class="hint"></div>
      <h2 class="mt">チップ</h2>
      <label for="chipPrice">1枚の単価(円)</label>
      <input type="number" id="chipPrice" min="0" step="50" inputmode="numeric">
      <button class="btn main mt" onclick="confirmSettings()">✔ 設定を保存</button>
    </div>
  </div>
  <div class="card">
    <div class="gtitle">
      <span id="gameCardTitle" style="font-size:16px; font-weight:700;">メンバー選択</span>
    </div>
    <!-- その卓に居る人(プール)。5人以上なら半荘ごとに席のプルダウンで4人を選ぶ(§6-31)
         ⚠️ 参加メンバーを常時表示しないこと。画面が重くなるだけで、
            誰が打っているかは席のプルダウンを見れば分かります。 -->
    <div class="poolbar">
      <button class="btn small" id="addMemberBtn" onclick="openPoolPicker()">＋ メンバーを追加</button>

<script>
(function(){
'use strict';
const WINDS = ['東(起家)','南','西','北'];
const KEY = 'mahjongSeisanV1';
const BROKEN_KEY = KEY + '.broken';

/* ⚠️ ここから `let S = load();` までの間に置く const は、load() から到達する関数
   (normalize / migrateSessions / dstr など)が参照してよい唯一の定数です。
   load() はこの直後に即実行されるため、下の方で宣言した const を load 経路から
   参照すると TDZ(Cannot access before initialization)で例外になり、
   catch に吸われて「データが消えた」ように見えます。実際に一度やらかしています。

   日付の区切り。麻雀は深夜に及ぶため AM5:00 を境界にする(0:00〜4:59 は前日扱い)。
   ⚠️ これは「表示ラベル用」の日付であって、集計の単位ではありません。
      集計の単位はセッション(卓)= g.sid です(§6-17)。 */
const DAY_BOUNDARY_HOUR = 5;

/* チップの原点(配給枚数)。入力するのは「所持枚数」で、原点との差が増減になる。
   ⚠️ load() 経路(normalize)から参照するので、ここで宣言すること(TDZ 事故の防止・§6-19)。
   CHIP_FMT は chips の形式印。counts の意味が過去に二転三転しているため、
   印が無いデータは「増減」(1世代前)とみなして原点を足し戻す(§6-26)。 */
const CHIP_ORIGIN = 20;
const CHIP_FMT = 2;   // 2 = counts は「所持枚数」

/* 配給原点と返し点の既定値(ありあり・25000点持ち30000点返し)。
   オカ = (返し点 − 配給原点) × 4人 ÷ 1000 = +20pt が1着に乗る(§6-30)。
   ⚠️ これも normalize から参照するので、load() より前に宣言すること(§6-19)。 */
const DEF_START = 25000;
const DEF_RET   = 30000;

let loadFailed = false;   // データの読み込みに失敗したか(起動後に警告を出す)
let S = load();

function defaults(){
  return {
    // ⚠️ チップは「増減」で記録する。原点(配給枚数)は持たない(§6-26)
    settings:{rate:5, uma1:30, uma2:10, chipPrice:500, start:DEF_START, ret:DEF_RET},
    players:[],            // {id, name}
    sessions:[],           // {id, t, closedAt} 集計単位の「卓」。closedAt が null なら進行中
    games:[],              // {sid, t, seats:[pid], scores:[4], pts:[4], ranks:[4], tobi:[{loser}], rate, uma1, uma2}
    expenses:{},            // {sid: {venue:0, personal:{pid:{food,drink}}, splitAll:false}} その卓の実participantsのみに割り振る
    groups:[],             // {id, name, members:[pid×4]}
    chips:{},              // {sid: {price, counts:{pid: 増減枚数}}} 全ゲーム終了時に入力
    nextId:1
  };
}
// 旧データ形式からの移行・欠損フィールドの補完(load・import共通)
function normalize(d){
  if(!d || !d.settings) return defaults();
  if(!Array.isArray(d.players)) d.players=[];
  if(!Array.isArray(d.games)) d.games=[];
  if(!Array.isArray(d.groups)) d.groups=[];
  if(!Array.isArray(d.sessions)) d.sessions=[];
  if(!d.chips || typeof d.chips!=='object') d.chips={};
  if(!d.expenses || typeof d.expenses!=='object') d.expenses={};
  // 旧形式 {venue, personal} (日付キーなし) → 今日の日付に移行
  if(d.expenses.venue!==undefined || d.expenses.personal!==undefined){
    const old=d.expenses, day=dstr(Date.now());
    d.expenses={};
    d.expenses[day]={venue:old.venue||0, personal:old.personal||{}};
  }
  delete d.settings.chipStart; // 原点は廃止(チップは増減で記録する)
  // 各対局の欠損フィールドを補完。
  // rate / uma1 / uma2 は「保存時の条件を対局ごとに固定する」仕様(§3)を後から導入したため、
  // それ以前のバックアップには存在しない。rate が未補完だと pt×rate×10 が NaN になり、
  // 精算・履歴・成績ページの金額表示がすべて壊れるので、必ずここで埋める。
  // オカ(配給原点・返し点)は後から設定にしたので、古いデータには無い。既定値で補完する(§6-30)
  if(typeof d.settings.start!=='number' || !isFinite(d.settings.start)) d.settings.start = DEF_START;
  if(typeof d.settings.ret  !=='number' || !isFinite(d.settings.ret))   d.settings.ret   = DEF_RET;
  d.games.forEach(g=>{
    if(typeof g.rate!=='number' || !isFinite(g.rate)) g.rate = d.settings.rate;
    if(typeof g.uma1!=='number' || !isFinite(g.uma1)) g.uma1 = d.settings.uma1;
    if(typeof g.uma2!=='number' || !isFinite(g.uma2)) g.uma2 = d.settings.uma2;
    // ⚠️ 過去の対局は必ず既定値(25000-30000)で計算されている。
    //    現在の設定ではなく DEF_* を入れること。でないと過去の pt と辻褄が合わなくなる。
    if(typeof g.start!=='number' || !isFinite(g.start)) g.start = DEF_START;
    if(typeof g.ret  !=='number' || !isFinite(g.ret))   g.ret   = DEF_RET;
    if(!Array.isArray(g.tobi)) g.tobi = [];
    if(!Array.isArray(g.seats)) g.seats = [];
    if(!Array.isArray(g.scores)) g.scores = [];
    if(!Array.isArray(g.pts)) g.pts = [];
    if(!Array.isArray(g.ranks)) g.ranks = [];
  });
  /* チップの形式移行。単価は卓ごとに固定する(games[].rate と同じ考え方)。
     ⚠️ counts の意味が過去に変わっているため、形式印 `v` で判別する。順に適用すること。
       (A) 最初期  {キー: {pid: 所持枚数}}                        … 原点は settings.chipStart
       (B) 中間    {キー: {price, start, counts:{pid: 所持枚数}}}  … 原点は start
       (C) 一時期  {キー: {price, counts:{pid: 増減}}}             … v 印なし
       (D) 現在    {キー: {price, counts:{pid: 所持枚数}, v:2}}    ← 所持枚数に戻した
     ⚠️ (C) と (D) は構造が同じで見分けが付かない。`v` が無ければ (C) とみなして
        原点を足し戻すこと。この判別を消すとチップが 20枚ずつズレます。 */
  const legacyStart = (typeof d.settings.chipStart==='number' && isFinite(d.settings.chipStart))
    ? d.settings.chipStart : CHIP_ORIGIN;
  Object.keys(d.chips).forEach(day=>{
    const v=d.chips[day];
    if(!v || typeof v!=='object'){ delete d.chips[day]; return; }
    if(!v.counts || typeof v.counts!=='object'){
      // (A) → (D): すでに所持枚数なのでそのまま
      const counts={};
      Object.entries(v).forEach(([k,n])=>{ if(typeof n==='number' && isFinite(n)) counts[k]=n; });
      d.chips[day]={price:d.settings.chipPrice, counts, v:CHIP_FMT};
      return;
    }
    if(typeof v.price!=='number' || !isFinite(v.price)) v.price=d.settings.chipPrice;
    if(typeof v.start==='number' && isFinite(v.start)){
      // (B) → (D): counts は所持枚数のまま。原点の差だけ補正する
      if(v.start!==CHIP_ORIGIN){
        Object.keys(v.counts).forEach(k=>{ v.counts[k] = v.counts[k] - v.start + CHIP_ORIGIN; });
      }
      delete v.start;
    } else if(v.v!==CHIP_FMT){
      // (C) → (D): 増減だったので原点を足して所持枚数に戻す
      Object.keys(v.counts).forEach(k=>{ v.counts[k] = v.counts[k] + CHIP_ORIGIN; });
    }
    v.v=CHIP_FMT;
  });
  // nextId は players/groups/sessions で共用の採番。インポートしたファイルの nextId が
  // 既存 id 以下だと id が重複するため、必ず実データの最大値より大きい値に補正する。
  const maxId = Math.max(0, ...d.players.map(p=>+p.id||0), ...d.groups.map(g=>+g.id||0),
    ...d.sessions.map(s=>+s.id||0));
  if(typeof d.nextId!=='number' || !isFinite(d.nextId) || d.nextId<=maxId){
    d.nextId = maxId+1;
  }
  migrateSessions(d);
  return d;
}

/* 旧形式(日付キーで自動グルーピング)→ 新形式(セッション=「卓」単位)への移行。
   以前は dstr(g.t) で勝手に日が変わると集計が分かれていたが、
   現在は「集計」ボタンを押すまで同じ卓に積み上がる。
   移行では「元の日付キー1つ = 卓1つ」として作り直す(過去の集計結果を変えないため)。 */
function migrateSessions(d){
  const needGame = d.games.some(g=>!g.sid);
  const oldChipKeys = Object.keys(d.chips).filter(k=>!/^\d+$/.test(k));
  const oldExpKeys  = Object.keys(d.expenses).filter(k=>!/^\d+$/.test(k));
  if(!needGame && !oldChipKeys.length && !oldExpKeys.length){
    // 既に新形式。欠損だけ補う
    d.sessions.forEach(s=>{ if(s.closedAt===undefined) s.closedAt=null; });
    return;
  }
  const byDay={}; // 'YYYY-MM-DD' -> session
  const sessionFor=(day, t)=>{
    if(!byDay[day]){
      const s={id:d.nextId++, t, closedAt:t};
      byDay[day]=s; d.sessions.push(s);
    }
    if(t < byDay[day].t) byDay[day].t = t;
    return byDay[day];
  };
  // 既存セッションのうち、日付キーと対応づくものを再利用する
  d.sessions.forEach(s=>{ const k=dstr(s.t); if(!byDay[k]) byDay[k]=s; });
  d.games.forEach(g=>{ if(!g.sid) g.sid = sessionFor(dstr(g.t), g.t).id; });
  oldChipKeys.forEach(k=>{
    const s=sessionFor(k, new Date(k+'T12:00:00').getTime() || Date.now());
    d.chips[s.id] = d.chips[k]; delete d.chips[k];
  });
  oldExpKeys.forEach(k=>{
    const s=sessionFor(k, new Date(k+'T12:00:00').getTime() || Date.now());
    d.expenses[s.id] = d.expenses[k]; delete d.expenses[k];
  });
  // 移行した卓はすべて確定済み扱い。ただし「今日の卓」だけは進行中に戻し、
  // 移行直後に打ち続けても集計が分断されないようにする。
  const today=dstr(Date.now());
  if(byDay[today]) byDay[today].closedAt=null;
  d.sessions.sort((a,b)=>a.t-b.t);
}
/* ⚠️ 例外を握り潰して defaults() を返すと、保存済みのデータが「消えた」ように見えたうえに、
   次の save() で本物のデータが上書きされて復旧不能になります(normalize の TDZ 事故で実際に発生)。
   そのため失敗時は、元の文字列を別キーに退避し、loadFailed を立てて起動後に警告を出し、
   save() を止めて上書きを防ぎます。 */
function load(){
  let raw=null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ return defaults(); }
  if(raw===null || raw==='') return defaults();
  try{
    return normalize(JSON.parse(raw));
  }catch(e){
    loadFailed = true;
    try{ localStorage.setItem(BROKEN_KEY, raw); }catch(e2){}
    if(typeof console!=='undefined' && console.error) console.error('[load] データの読み込みに失敗しました', e);
    return defaults();
  }
}
/* 日付キー(YYYY-MM-DD)を作る。卓のラベル表示と、旧データの移行に使う。
   AM5:00 を「その日」の境界とする(0:00〜4:59 は前日の扱い)。
   DAY_BOUNDARY_HOUR はファイル先頭で宣言している(load() から参照するため・理由はそこのコメント)。 */
function dstr(t){
  const d=new Date(t);
  d.setHours(d.getHours() - DAY_BOUNDARY_HOUR); // 月またぎ・年またぎも Date が自動で繰り下げる
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
/* 時刻表示。AM5:00 境界(dstr)に合わせ、0:00〜4:59 は 24:00〜28:59 と表記する。
   「8/19 の合計」の中に 1:30 の半荘が並ぶと前日分に見えてしまうため、25:30 と出す。 */
function tstr(t){
  const d=new Date(t);
  let h=d.getHours();
  if(h < DAY_BOUNDARY_HOUR) h += 24;
  return `${h}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function save(){
  // 読み込みに失敗している間は書き込まない(壊れたデータの上書き = 復旧不能を防ぐ)
  if(loadFailed) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ---------- モーダルのフォーカス管理 ----------
   aria-modal="true" を付けるだけでは不十分で、実際には
     ・Tab でダイアログの外(背後の画面)へ抜けられてしまう
     ・閉じたあとフォーカスが body に飛び、キーボード操作の位置を見失う
   ため、開くときに「直前のフォーカス要素」を覚え、Tab を内側で循環させ、
   閉じるときに元へ戻す。⚠️ openModal / closeModal を経由せずに
   overlay の classList を直接触らないこと。 */
let modalPrevFocus = null;
function modalFocusables(){
  const ov=document.getElementById('modalOverlay');
  return [...ov.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.disabled && el.offsetParent!==null);
}
function onModalKeydown(e){
  if(e.key!=='Tab') return;
  const f=modalFocusables();
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
function openModal(){
  modalPrevFocus = document.activeElement;
  const ov=document.getElementById('modalOverlay');
  ov.classList.add('show');
  document.addEventListener('keydown', onModalKeydown, true);
  // 背後をスクリーンリーダーの読み上げ対象から外す
  const m=document.querySelector('main'), n=document.querySelector('nav');
  if(m) m.setAttribute('aria-hidden','true');
  if(n) n.setAttribute('aria-hidden','true');
}
function closeModal(){
  const ov=document.getElementById('modalOverlay');
  ov.classList.remove('show');
  document.removeEventListener('keydown', onModalKeydown, true);
  const m=document.querySelector('main'), n=document.querySelector('nav');
  if(m) m.removeAttribute('aria-hidden');
  if(n) n.removeAttribute('aria-hidden');
  // 呼び出し元のボタンへフォーカスを戻す(消えている場合もあるので握り潰す)
  try{ if(modalPrevFocus && modalPrevFocus.focus) modalPrevFocus.focus(); }catch(e){}
  modalPrevFocus = null;
}

/* ---------- トースト/モーダル(alert・confirmの置き換え) ---------- */
function toast(msg, type, action){
  const c=document.getElementById('toastContainer');
  if(!c) return;
  const el=document.createElement('div');
  el.className='toast'+(type==='error'?' toast-error':type==='ok'?' toast-ok':'');
  el.setAttribute('role','status');
  const span=document.createElement('span'); span.textContent=msg; span.style.flex='1';
  el.appendChild(span);
  if(action){
    const btn=document.createElement('button');
    btn.type='button'; btn.className='toast-action'; btn.textContent=action.label;
    btn.onclick=()=>{ action.onClick(); el.remove(); };
    el.appendChild(btn);
  }
  c.appendChild(el);
  const raf = typeof requestAnimationFrame==='function' ? requestAnimationFrame : (fn)=>setTimeout(fn,0);
  raf(()=>el.classList.add('show'));
  const life = action ? 6000 : 2600;
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),200); }, life);
}
/* ダイアログは1つの DOM を使い回しているので、開く前に必ず前回の状態を戻す。
   ⚠️ これを怠ると「前のダイアログのボタンが残る」「本文が出たままになる」といった
      分かりにくい不具合になります。各ダイアログの先頭で必ず呼ぶこと。 */
function resetModal(){
  document.getElementById('modalMsg').textContent='';
  document.getElementById('modalBody').innerHTML='';
  document.getElementById('modalChoices').innerHTML='';
  document.getElementById('modalButtons').style.display='';
  document.getElementById('modalCancel').style.display='';
  const ok=document.getElementById('modalOk');
  ok.className='btn main'; ok.style.background=''; ok.style.borderColor='';
  // ⚠️ disabled も戻すこと。参加メンバー追加ダイアログ(§6-31)が未選択時に無効化するため、
  //    戻し忘れると次に開いたダイアログの OK が押せなくなります。
  ok.disabled=false;
}
function confirmDialog(msg, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    resetModal();
    document.getElementById('modalMsg').textContent = msg;
    const okBtn=document.getElementById('modalOk');
    const cancelBtn=document.getElementById('modalCancel');
    okBtn.textContent = opts.okText || 'OK';
    okBtn.className = 'btn main';
    okBtn.style.background = opts.danger ? 'var(--red)' : '';
    okBtn.style.borderColor = opts.danger ? 'var(--red)' : '';
    openModal();
    function cleanup(v){
      okBtn.onclick=null; cancelBtn.onclick=null;
      document.removeEventListener('keydown', onKey);
      closeModal();
      resolve(v);
    }
    function onKey(e){ if(e.key==='Escape') cleanup(false); }
    okBtn.onclick=()=>cleanup(true);
    cancelBtn.onclick=()=>cleanup(false);
    document.addEventListener('keydown', onKey);
    setTimeout(()=>okBtn.focus(), 0);
  });
}
/* 選択肢が3つ以上(または OK/キャンセル では表せない2択)のダイアログ。
   choices: [{label, value}] / 戻り値: 選ばれた value、キャンセルなら null。
   同点時にどちらを上位にするかを選ばせるのに使う(§6-21)。 */
function chooseDialog(msg, choices){
  return new Promise(resolve=>{
    resetModal();
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modalButtons').style.display='none';
    const box=document.getElementById('modalChoices');
    function cleanup(v){
      document.removeEventListener('keydown', onKey);
      closeModal();
      resolve(v);
    }
    function onKey(e){ if(e.key==='Escape') cleanup(null); }
    choices.forEach((c,i)=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='btn'+(i===0?' main':'');
      b.textContent=c.label;
      b.onclick=()=>cleanup(c.value);
      box.appendChild(b);
    });
    const cx=document.createElement('button');
    cx.type='button'; cx.className='btn'; cx.textContent='キャンセル';
    cx.onclick=()=>cleanup(null);
    box.appendChild(cx);
    openModal();
    document.addEventListener('keydown', onKey);
    setTimeout(()=>{ const f=box.querySelector('button'); if(f) f.focus(); }, 0);
  });
}
/* 結果を見せるだけのダイアログ(ボタンは「閉じる」1つ)。
   bodyHtml には表などの HTML を渡せる。半荘を確定した直後のリザルト表示に使う(§6-23)。 */
function alertDialog(msg, bodyHtml, okText){
  return new Promise(resolve=>{
    resetModal();
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modalBody').innerHTML = bodyHtml || '';
    const okBtn=document.getElementById('modalOk');
    const cancelBtn=document.getElementById('modalCancel');
    cancelBtn.style.display='none'; // 閉じる以外の選択肢はない
    okBtn.textContent = okText || '閉じる';
    openModal();
    function cleanup(){
      okBtn.onclick=null;
      document.removeEventListener('keydown', onKey);
      closeModal();
      resolve();
    }
    function onKey(e){ if(e.key==='Escape') cleanup(); }
    okBtn.onclick=cleanup;
    document.addEventListener('keydown', onKey);
    setTimeout(()=>okBtn.focus(), 0);
  });
}

function exportData(){

async function importData(file){
  if(!file) return;
  try{
    const text = await file.text();
    const d = JSON.parse(text);
    if(!d || !d.settings || !Array.isArray(d.players) || !Array.isArray(d.games)){
      toast('データ形式が正しくありません', 'error'); return;
    }
    if(!(await confirmDialog('現在のデータを上書きしてインポートします。よろしいですか?', {danger:true, okText:'インポート'}))) return;
    S = normalize(d);
    resetUiState(); // 編集中の半荘への参照などが古いデータを指したままになるのを防ぐ
    save();
    toast('データを復元しました', 'ok');
    showTab('members');
  }catch(e){
    toast('ファイルの読み込みに失敗しました', 'error');
  }
  document.getElementById('importFile').value='';
}

function fmt(n){ return (n>0?'+':'') + n.toLocaleString(); }
function cls(n){ return n>0?'plus':(n<0?'minus':''); }
function yen(n){ return (n>0?'+':(n<0?'−':'')) + Math.abs(n).toLocaleString() + '円'; }
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pname(id){ const p=S.players.find(p=>p.id===id); return p?p.name:'?'; }
// 五捨六入 (千点単位のポイント化)
function round56(score){
  const sign = score<0 ? -1 : 1;
  const a = Math.abs(score);
  let pt = Math.floor(a/1000);
  if(a%1000 >= 600) pt++;
  return sign*pt;
}
// 引数 st は {uma1, uma2} を持つオブジェクト(現在の設定 or 保存済みの対局)。
// 省略時は現在の設定を使う。過去の対局を再計算するときは必ずその対局を渡すこと。
function umaArr(st){ const s=st||S.settings; return [s.uma1, s.uma2, -s.uma2, -s.uma1]; }
/* ---------- 配給原点・返し点・オカ(§6-30) ----------
   st には「現在の設定」か「対局に保存された条件(g)」のどちらかが入る。
   ⚠️ 古いデータには start/ret が無いので、必ずこの関数を通して既定値へ落とすこと。 */
function startOf(st){ const s=st||S.settings; return (typeof s.start==='number'&&isFinite(s.start))?s.start:DEF_START; }
function retOf(st){   const s=st||S.settings; return (typeof s.ret  ==='number'&&isFinite(s.ret))  ?s.ret  :DEF_RET; }
// オカ(pt)。(返し点 − 配給原点)×4人 を1000点=1pt に換算したもの
function okaOf(st){ return (retOf(st)-startOf(st))*4/1000; }
// その半荘の点棒の総量。配給原点×4人
function totalScore(st){ return startOf(st)*4; }
// 既定の着順(idx[rank]=seat)。点数降順 → 同点なら席番号の小さい側(上家・起家寄り)が上位。
function defaultRankOrder(scores){ return [0,1,2,3].sort((a,b)=> scores[b]-scores[a] || a-b); }
// 同点のかたまりを返す。[[席,席], ...] の形(2人以上が同点のグループのみ)
function tieGroups(scores){
  const byScore={};
  scores.forEach((s,i)=>{ (byScore[s]=byScore[s]||[]).push(i); });
  return Object.keys(byScore)
    .map(Number).sort((a,b)=>b-a)          // 点数の高いグループから
    .map(s=>byScore[s]).filter(g=>g.length>1);
}
function ptToYen(pt){ return Math.round(pt * S.settings.rate * 10); }

/* ---------- 精算計算 ----------
   scores: 席順の最終持ち点4つ。

   【同点時の順位】既定は **席順が上家(起家に近い側)の人が上位**(= 席インデックスが小さい方)。
   seats は index 0 が起家(東家)で、以降 南家・西家・北家 の並び。
   ただし「どちらが上家か分かりにくい」ため、**同点があるときは確定時にダイアログで
   ユーザーに選ばせ**、その結果を `order` として calcPts に渡す(§6-21)。
   ⚠️ `defaultRankOrder` の第2キー `a-b` を消したり `b-a` にしたりしないこと。
      ダイアログをキャンセルせず既定のまま進めた場合の配分が逆転します。

   2〜4着: 五捨六入(持ち点 − 返し点) + ウマ / 1着: 他3人の合計×(-1) (オカ・端数総取り)

   【オカ】1着の pt を「他3人の合計の符号反転」で出しているため、オカは自動的に乗る。
   返し点を変えれば (返し点−配給原点)×4 ÷1000 pt が1着の取り分として反映される(§6-30)。
   ⚠️ 1着に okaOf() を足し込まないこと。二重計上になります。

   ⚠️ 五捨六入は「返し点との差」に対して適用すること。
      持ち点そのものを丸めてから −30 する書き方(round56(score) − 30)は、
      持ち点が 返し点未満 かつ 下3桁が 500 のときに標準ルールと 1pt ずれる。
        例) 24,500点 → 正: round56(-5500) = -5 / 誤: round56(24500) - 30 = -6
      pt の合計は 1着が端数を吸収するため必ず0になり、「合計0」のテストでは検出できない。
      下3桁500のケースはセルフテストで固定してあるので、この形を維持すること。 */
// umaSt: {uma1, uma2}。省略時は現在の設定。確定済みの半荘を編集するときは、
// その半荘に保存されている uma を渡すこと(設定変更後にレートだけ当時・ウマだけ現在になるのを防ぐ)。
/* order: 席の並びを上位から指定する配列(例 [2,0,1,3])。省略時は
   「点数降順 → 同点なら席番号の小さい側(上家)」の既定ルールで決める。
   同点があるときは saveGame が resolveTieOrder() でユーザーに選ばせ、その結果をここへ渡す。 */
function calcPts(scores, umaSt, order){
  const idx = Array.isArray(order) && order.length===4
    ? [...order]
    : defaultRankOrder(scores); // idx[rank]=seat
  const pts = [0,0,0,0], ranks=[0,0,0,0];
  const uma = umaArr(umaSt);
  let sumOthers = 0;
  for(let r=1;r<4;r++){
    const seat = idx[r];
    const p = round56(scores[seat] - retOf(umaSt)) + uma[r];
    pts[seat]=p; sumOthers+=p; ranks[seat]=r;
  }
  pts[idx[0]] = -sumOthers; ranks[idx[0]]=0;
  return {pts, ranks};
}

/* ---------- 設定変更の反映範囲 ----------
   【方針】**進行中の卓は常に現在の設定で計算し直す。集計済みの卓は当時の設定で固定する。**
   打っている最中にレートやウマを決め直すことがあるため、まだ締めていない卓には追従させる。
   「集計」を押した時点でその卓の条件が確定し、以降いくら設定を変えても動かない。

   ⚠️ 再計算で ranks(着順)を作り直さないこと。同点のときユーザーが選んだ順位が消えます。
      既存の ranks から順序を復元して calcPts に渡しています。 */
function orderFromRanks(g){
  return [0,1,2,3].sort((a,b)=>g.ranks[a]-g.ranks[b]);
}
// その対局に適用すべき条件の出どころ。進行中なら現在の設定、集計済みならその対局の保存値。
function settingsFor(g){
  const s=sessionById(g.sid);
  return (s && !s.closedAt) ? S.settings : g;
}
// 進行中の卓の対局を、現在の設定で計算し直す。戻り値は直した局数。
function reapplySettingsToOpenGames(){
  const s=openSession();
  if(!s) return 0;
  let n=0;
  sessionGames(s.id).forEach(g=>{
    const r=calcPts(g.scores, S.settings, orderFromRanks(g));
    g.pts=r.pts; g.ranks=r.ranks;
    g.rate=S.settings.rate; g.uma1=S.settings.uma1; g.uma2=S.settings.uma2;
    g.start=startOf(); g.ret=retOf();
    n++;
  });
  // チップの単価も、進行中の卓のものは現在の設定に合わせる
  const c=S.chips[s.id];
  if(c){ c.price=S.settings.chipPrice; }
  return n;
}
// 設定を変えたときの共通処理。保存・再計算・再描画をまとめて行う
function onSettingsChanged(){
  const n=reapplySettingsToOpenGames();
  save(); renderSettings(); renderGame(); renderHistory();
  if(n) toast(`進行中の卓(${n}局)に反映しました`);
}

function addPlayer(){
  const el=document.getElementById('newName');
  const name=el.value.trim().slice(0,10);
  if(!name) return;
  if(S.players.some(p=>p.name===name)){ toast('同名のメンバーがいます','error'); return; }
  S.players.push({id:S.nextId++, name});
  el.value=''; save(); renderMembers(); renderGroupList();
}
document.getElementById('newName').addEventListener('keydown',e=>{ if(e.key==='Enter') addPlayer(); });
function removePlayer(id){
  if(S.games.some(g=>g.seats.includes(id))){ toast('対局履歴があるメンバーは削除できません','error'); return; }
  const idx=S.players.findIndex(p=>p.id===id);
  if(idx<0) return;
  const removedPlayer=S.players[idx];
  const removedGroups=S.groups.filter(g=>g.members.includes(id));
  S.players = S.players.filter(p=>p.id!==id);
  S.groups = S.groups.filter(g=>!g.members.includes(id));
  save(); renderMembers(); renderGroupList();
  toast(`「${removedPlayer.name}」を削除しました`, null, {label:'元に戻す', onClick:()=>{
    S.players.splice(idx,0,removedPlayer);
    S.groups.push(...removedGroups);
    save(); renderMembers(); renderGroupList();
  }});
}
let editingPlayerId = null;
function startEditPlayer(id){
  editingPlayerId = id;
  renderMembers();
  const inp = document.getElementById('editNameInput');
  if(inp){ inp.focus(); inp.select(); }
}
function cancelEditPlayer(){
  editingPlayerId = null;
  renderMembers();
}
function saveEditPlayer(id){
  const inp = document.getElementById('editNameInput');
  const name = inp.value.trim().slice(0,10);
  if(!name){ toast('名前を入力してください','error'); return; }
  if(S.players.some(p=>p.name===name && p.id!==id)){ toast('同名のメンバーがいます','error'); return; }
  const p = S.players.find(p=>p.id===id);
  if(p) p.name = name;
  editingPlayerId = null;
  save(); renderMembers(); renderGroupList(); renderGame();
}
function renderMembers(){
  const el=document.getElementById('memList');
  if(!S.players.length){ el.innerHTML='<div class="hint">メンバーを4人以上登録してください</div>'; return; }
  const wasOpen = el.querySelector('details') ? el.querySelector('details').open : false;
  const rows = S.players.map(p=>{
    if(p.id===editingPlayerId){
      return `<div class="listrow">
        <input type="text" id="editNameInput" value="${esc(p.name)}" maxlength="10" style="flex:1; min-width:0;"
          onkeydown="if(event.key==='Enter') saveEditPlayer(${p.id}); if(event.key==='Escape') cancelEditPlayer();">
        <span class="meta">
          <button type="button" class="iconbtn" aria-label="名前を確定" onclick="saveEditPlayer(${p.id})">${ICO.check}</button>
          <button type="button" class="iconbtn" style="color:var(--sub);" aria-label="編集をキャンセル" onclick="cancelEditPlayer()">${ICO.close}</button>
        </span></div>`;
    }
    return `<div class="listrow">
      <button class="linkname" onclick="startEditPlayer(${p.id})">${esc(p.name)}</button>
      <span class="meta">
        <button class="btn small" onclick="showProfile(${p.id})">${ICO.chart}成績</button>
        <button type="button" class="iconbtn danger" aria-label="${esc(p.name)} を削除" onclick="removePlayer(${p.id})">${ICO.close}</button>
      </span></div>`;
  }).join('');
  el.innerHTML = `<details class="acc" ${wasOpen?'open':''}>
    <summary><span>登録メンバー</span></summary>
    <div class="accbody">${rows}</div>
  </details>`;
}

/* ---------- グラフ(横棒)ヘルパー ---------- */
function moneyBars(items){
  const max = Math.max(1, ...items.map(x=>Math.abs(x.value)));
  return `<div class="barchart">` + items.map(x=>{
    const pct = Math.max(2, Math.round(Math.abs(x.value)/max*100));
    return `<div class="barrow">
      <span class="barlabel">${esc(x.label)}</span>
      <div class="bartrack"><div class="barfill ${x.value<0?'neg':'pos'}" style="width:${pct}%"></div></div>
      <span class="barval ${cls(x.value)}">${yen(x.value)}</span>
    </div>`;
  }).join('') + `</div>`;
}
function distBars(items){
  const max = Math.max(1, ...items.map(x=>x.value));
  return `<div class="barchart">` + items.map(x=>{
    const pct = x.value ? Math.max(2, Math.round(x.value/max*100)) : 0;
    return `<div class="barrow">
      <span class="barlabel">${esc(x.label)}</span>
      <div class="bartrack"><div class="barfill acc" style="width:${pct}%"></div></div>
      <span class="barval">${x.value}回</span>
    </div>`;
  }).join('') + `</div>`;
}
function computeProfile(pid){
  const games = S.games.map((g,gi)=>({g,gi})).filter(({g})=>g.seats.includes(pid));
  let n=0, top=0, rankSum=0, pt=0, ptMoney=0, tobi=0;
  const rankCounts=[0,0,0,0];
  games.forEach(({g})=>{
    const i=g.seats.indexOf(pid);
    n++; rankSum+=g.ranks[i]+1; if(g.ranks[i]===0) top++;
    rankCounts[g.ranks[i]]++;
    pt+=g.pts[i]; ptMoney+=Math.round(g.pts[i]*g.rate*10);
    if((g.tobi||[]).some(t=>t.loser===i)) tobi++;
  });
  // チップは卓ごとに単価が違う可能性があるため、枚数と金額を卓ごとに積む
  let chips=0, chipYen=0;
  Object.values(S.chips).forEach(day=>{
    const n=day.counts[pid];
    if(n===undefined) return;
    chips += (n - CHIP_ORIGIN);              // counts は所持枚数。原点を引いて増減にする
    chipYen += (n - CHIP_ORIGIN)*day.price;
  });

  // 月別・年別の集計。期間のキーは dstr(AM5:00境界)から作るので、
  // 深夜に打った分も「打ち始めた日」の月・年に入る。
  const byPeriod=(keyLen)=>{
    const m={};
    games.forEach(({g})=>{
      const k=dstr(g.t).slice(0,keyLen);
      const a=m[k]=m[k]||{key:k, n:0, top:0, rankSum:0, pt:0, money:0};
      const i=g.seats.indexOf(pid);
      a.n++; a.rankSum+=g.ranks[i]+1; if(g.ranks[i]===0) a.top++;
      a.pt+=g.pts[i]; a.money+=Math.round(g.pts[i]*g.rate*10);
    });
    return Object.values(m).sort((x,y)=>y.key.localeCompare(x.key));
  };
  const months=byPeriod(7); // 'YYYY-MM'
  const years =byPeriod(4); // 'YYYY'

  return {n, top, rankSum, pt, ptMoney, chips, chipYen, tobi, games, rankCounts, months, years};
}
// 月別・年別の成績表(対局分のみ。チップ・場代は卓単位なので含めない)
function periodTable(rows, label, fmtKey){
  if(!rows.length) return '';
  return `<table class="mt"><tr><th scope="col">${label}</th><th scope="col">局数</th><th scope="col">平均着順</th><th scope="col">トップ率</th><th scope="col">収支</th></tr>`
    + rows.map(r=>`<tr><td>${fmtKey(r.key)}</td><td>${r.n}</td>
        <td>${(r.rankSum/r.n).toFixed(2)}</td>
        <td>${Math.round(r.top/r.n*100)}%</td>
        <td class="${cls(r.money)}">${yen(r.money)}</td></tr>`).join('')
    + `</table>`;
}
let profTab='cum';
function setProfTab(t){
  profTab=t;
  document.getElementById('profCum').style.display = t==='cum'?'block':'none';
  document.getElementById('profDay').style.display = t==='day'?'block':'none';
  document.getElementById('profTabCum').classList.toggle('sel', t==='cum');
  document.getElementById('profTabDay').classList.toggle('sel', t==='day');
  document.getElementById('profTabCum').setAttribute('aria-pressed', t==='cum');
  document.getElementById('profTabDay').setAttribute('aria-pressed', t==='day');
}
function renderProfile(pid){
  const p=computeProfile(pid);
  const el=document.getElementById('profileBody');
  if(!p.n){
    el.innerHTML='<div class="card hint">まだ対局データがありません。</div>';
    return;
  }
  const avgRank=(p.rankSum/p.n).toFixed(2);
  const topRate=Math.round(p.top/p.n*100);
  const total=p.ptMoney+p.chipYen;

  let cumHtml = `<div class="card">
    <h2>累積成績</h2>
    <div class="setgrid">
      <div><span class="setlabel">対局数</span><span class="setval">${p.n}局</span></div>
      <div><span class="setlabel">平均着順</span><span class="setval">${avgRank}</span></div>
      <div><span class="setlabel">トップ率</span><span class="setval">${topRate}%</span></div>
    </div>
    <table class="mt"><tr><th scope="col">対局</th><th scope="col">チップ</th><th scope="col">合計</th></tr>
      <tr><td class="${cls(p.ptMoney)}">${yen(p.ptMoney)}</td>
        <td class="${cls(p.chipYen)}">${p.chips?yen(p.chipYen):'-'}</td>
        <td class="${cls(total)} bigmoney" style="font-size:15px;">${yen(total)}</td></tr>
    </table>
    ${moneyBars([{label:'対局',value:p.ptMoney},{label:'チップ',value:p.chipYen},{label:'合計',value:total}])}
    ${p.tobi?`<div class="hint mt">トビ ${p.tobi}回</div>`:''}
  </div>
  <div class="card">
    <h2>着順分布</h2>
    ${distBars([0,1,2,3].map(i=>({label:(i+1)+'位', value:p.rankCounts[i]})))}
  </div>`;

  cumHtml += `<div class="card">
    <h2>月間成績</h2>
    ${periodTable(p.months, '月', k=>k.replace('-','/'))}
    ${moneyBars(p.months.slice(0,12).reverse().map(m=>({label:m.key.replace('-','/'), value:m.money})))}
  </div>
  <div class="card">
    <h2>年間成績</h2>
    ${periodTable(p.years, '年', k=>k+'年')}
    ${moneyBars(p.years.slice().reverse().map(y=>({label:y.key+'年', value:y.money})))}
  </div>`;

  // 日付ではなく卓(sid)ごとにまとめる。日付をまたいだ卓も1つにまとまる。
  const bySid={};
  p.games.forEach(({g,gi})=>{ (bySid[g.sid]=bySid[g.sid]||[]).push({g,gi}); });
  const sessions=S.sessions.filter(s=>bySid[s.id]).sort((a,b)=>b.t-a.t);
  const dayHtml = sessions.map(sess=>{
    const d=sessionLabel(sess);
    const list=bySid[sess.id];
    const rows=list.map(({g})=>{
      const i=g.seats.indexOf(pid);
      const money=Math.round(g.pts[i]*g.rate*10);
      const top=g.ranks[i]===0;
      const time=tstr(g.t);
      return `<tr class="${top?'rank1':''}"><td>${top?CROWN:''}${g.ranks[i]+1}位</td><td>${time}</td>
        <td>${g.scores[i].toLocaleString()}</td><td class="${cls(g.pts[i])}">${fmt(g.pts[i])}</td>
        <td class="${cls(money)}">${yen(money)}</td></tr>`;
    }).join('');
    return `<details class="acc"><summary><span>${d}</span><span class="meta">${list.length}局</span></summary>
      <div class="accbody"><table><tr><th scope="col">順位</th><th scope="col">時刻</th><th scope="col">点数</th><th scope="col">pt</th><th scope="col">収支</th></tr>${rows}</table></div>
    </details>`;
  }).join('');

  const toggleHtml = `<div class="card">
    <div class="presets" role="tablist">
      <button id="profTabCum" class="${profTab==='cum'?'sel':''}" aria-pressed="${profTab==='cum'}" onclick="setProfTab('cum')">累積成績</button>
      <button id="profTabDay" class="${profTab==='day'?'sel':''}" aria-pressed="${profTab==='day'}" onclick="setProfTab('day')">対局ごと</button>
    </div>
  </div>`;

  el.innerHTML = toggleHtml
    + `<div id="profCum" style="display:${profTab==='cum'?'block':'none'};">${cumHtml}</div>`
    + `<div id="profDay" style="display:${profTab==='day'?'block':'none'};"><div class="card"><h2>対局ごとの成績</h2>${dayHtml}</div></div>`;
}

function saveGroup(){
  const el=document.getElementById('groupName');
  const name=el.value.trim().slice(0,10);
  if(!name){ toast('グループ名を入力してください','error'); return; }
  if(gpSel.size!==4){ toast('メンバーをちょうど4人チェックしてください','error'); return; }
  if(S.groups.some(g=>g.name===name && g.id!==editingGroupId)){ toast('同名のグループがあります','error'); return; }
  if(editingGroupId){
    const g=S.groups.find(g=>g.id===editingGroupId);
    g.name=name; g.members=[...gpSel];
  }else{
    S.groups.push({id:S.nextId++, name, members:[...gpSel]});
  }
  save(); hideGroupForm(); renderGroupList();
}
async function delGroup(id){
  if(!(await confirmDialog('このグループを削除しますか?', {danger:true, okText:'削除'}))) return;
  const idx=S.groups.findIndex(g=>g.id===id);
  if(idx<0) return;
  const removed=S.groups[idx];
  S.groups=S.groups.filter(g=>g.id!==id);
  save(); hideGroupForm(); renderGroupList();
  toast(`「${removed.name}」を削除しました`, null, {label:'元に戻す', onClick:()=>{
    S.groups.splice(idx,0,removed);
    save(); renderGroupList();
  }});
}

function computeGroupProfile(gid){
  const g=S.groups.find(g=>g.id===gid);
  if(!g) return null;
  const memberSet=new Set(g.members);
  const games=S.games.map((gm,gi)=>({gm,gi}))
    .filter(({gm})=> gm.seats.length===4 && new Set(gm.seats).size===4 && gm.seats.every(id=>memberSet.has(id)));
  const stats={};
  g.members.forEach(pid=> stats[pid]={pid, name:pname(pid), n:0, top:0, rankSum:0, pt:0, ptMoney:0, tobi:0});
  games.forEach(({gm})=>{
    gm.seats.forEach((pid,i)=>{
      const s=stats[pid]; if(!s) return;
      s.n++; s.rankSum+=gm.ranks[i]+1; if(gm.ranks[i]===0) s.top++;
      s.pt+=gm.pts[i]; s.ptMoney+=Math.round(gm.pts[i]*gm.rate*10);
      if((gm.tobi||[]).some(t=>t.loser===i)) s.tobi++;
    });
  });
  const members=Object.values(stats).sort((a,b)=>b.ptMoney-a.ptMoney);
  const dates=[...new Set(games.map(({gm})=>dstr(gm.t)))].sort();
  return {group:g, n:games.length, members, games, dates};
}
function renderGroupProfile(gid){
  const p=computeGroupProfile(gid);
  const el=document.getElementById('groupProfileBody');
  if(!p || !p.n){
    el.innerHTML='<div class="card hint">まだこの4人で対局したデータがありません。</div>';
    return;

  let html = `<div class="card">
    <h2>累積成績</h2>
    <div class="setgrid">
      <div><span class="setlabel">対局数</span><span class="setval">${p.n}局</span></div>

  </div>

    ${moneyBars(p.members.map(m=>({label:m.name, value:m.ptMoney})))}
    <table class="mt"><tr><th scope="col">名前</th><th scope="col">局</th><th scope="col">平均着順</th><th scope="col">トップ率</th><th scope="col">収支</th></tr>`+
    p.members.map((m,idx)=>`<tr class="${idx===0?'rank1':''}"><td>${idx===0?CROWN:''}${esc(m.name)}</td><td>${m.n}</td>
      <td>${m.n?(m.rankSum/m.n).toFixed(2):'-'}</td>
      <td>${m.n?Math.round(m.top/m.n*100):0}%</td>
      <td class="${cls(m.ptMoney)} bigmoney" style="font-size:14px;">${yen(m.ptMoney)}</td></tr>`).join('')+
    `</table>
  </div>`;
  el.innerHTML = html;
}

/* ---------- 対局入力 ---------- */
/* cur.signs: 席ごとの符号モード(+1 / -1)。
   モバイルの数字キーパッドにはマイナスキーが無い端末が多いため、±ボタンで切り替える。
   ⚠️ 値を入力する「前」に押せること。空欄でも符号モードだけ先に反転し、
      そのあと入力した数字が自動でマイナスになる(以前は値がないと±が効かなかった)。 */
let cur = {seats:[null,null,null,null], scores:[null,null,null,null], signs:[1,1,1,1]};
function resetCur(seats){
  return {seats: seats||[null,null,null,null], scores:[null,null,null,null], signs:[1,1,1,1]};
}
let justReset = false;
// 編集中の確定済み半荘への参照(null=新規入力)。配列インデックスではなくオブジェクト参照で保持することで、
// 編集中に他の半荘が削除・追加されて配列の並びがずれても、保存時に誤った半荘を上書きしないようにする。
let editingGame = null;

function renderGame(){
  const box=document.getElementById('seats');
  const gq=document.getElementById('groupQuick');
  const titleEl=document.getElementById('gameCardTitle');
  const cancelEditBtn=document.getElementById('cancelEditGameBtn');
  const unitHint=document.getElementById('scoreUnitHint');
  const poolBar=document.querySelector('.poolbar');
  if(S.players.length<4){
    titleEl.textContent='メンバー選択';
    if(poolBar) poolBar.style.display='none';
    if(cancelEditBtn) cancelEditBtn.style.display='none';
    if(unitHint) unitHint.style.display='none';
    gq.innerHTML = `<div class="warn">メンバータブで4人以上登録してください。</div>`;
    box.innerHTML=''; document.getElementById('sumMsg').innerHTML='';
    const saveBtn=document.getElementById('saveGameBtn'); if(saveBtn) saveBtn.disabled=true;
    return;
  }
  if(poolBar) poolBar.style.display='';
  /* 候補はその卓の参加メンバー(プール)に限る。5人以上いる場合、
     半荘ごとにここから4人を選ぶ(§6-31)。
     ⚠️ 編集中の半荘にプール外の人が入っていることがある(過去の卓・メンバー変更後)。
        その人は候補から消さないこと。消すと編集画面で席が空になります。 */
  let pool=poolIds();
  // 登録メンバーがちょうど4人なら、プールは自動的にその4人(初回の手間を増やさない)
  if(!pool.length && S.players.length===4){ setPool(S.players.map(p=>p.id)); pool=poolIds(); }
  const inEdit=cur.seats.filter(Boolean).filter(id=>!pool.includes(id));
  const candIds=[...pool, ...inEdit];
  const cands=candIds.map(id=>S.players.find(p=>p.id===id)).filter(Boolean);
  // 存在しないメンバーは選択から除去
  cur.seats = cur.seats.map(id=> (id && cands.some(p=>p.id===id)) ? id : null);

  // プールがちょうど4人の場合は初期表示の便宜上自動で埋める(選択のやり直しは常に可能)
  const allEmpty = cur.seats.every(s=>s===null);
  if(allEmpty && pool.length===4 && !justReset){
    cur.seats = pool.slice();
  }
  justReset = false;

  const isSet = cur.seats.filter(Boolean).length===4;
  titleEl.textContent = isSet ? (editingGame!==null?'対局結果を編集':'対局結果を入力') : 'メンバー選択';
  if(cancelEditBtn) cancelEditBtn.style.display = editingGame!==null ? '' : 'none';
  const saveBtnLabel=document.getElementById('saveGameBtn');
  if(saveBtnLabel) saveBtnLabel.textContent = editingGame!==null ? '変更を保存' : '確定';
  if(unitHint) unitHint.style.display = isSet ? 'block' : 'none';

  gq.innerHTML = (!isSet && S.groups.length)
    ? `<label>グループから選択</label><div class="presets">`+
      S.groups.map(g=>`<button onclick="selectGroup(${g.id})">${esc(g.name)}</button>`).join('')+`</div>`
    : '';

  const ai = isSet ? autoSeat() : -1;
  box.innerHTML = cur.seats.map((pid,i)=>{
    const isAuto=(ai===i);
    // 持ち点は百点単位(例:250=25,000点)で入力・表示する。内部(cur.scores)は常に実点数(百の倍数)で保持する。
    const val = (cur.scores[i]===null || cur.scores[i]===undefined) ? '' : cur.scores[i]/100;
    const opts=['<option value="">-- 選択 --</option>'].concat(
      cands.filter(p=> p.id===pid || !cur.seats.includes(p.id))
        .map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`)
    ).join('');
    const seatCtl = `<select aria-label="${i+1}番目のプレイヤー" onchange="setSeat(${i}, this.value)">${opts}</select>`;
    return `<div class="seat"><div class="srow">
      <span class="num">${i+1}</span>
      ${seatCtl}
      <button type="button" class="btn small signbtn ${cur.signs[i]===-1?'on':''}" ${pid?'':'disabled'}
        aria-label="符号を切り替え(マイナスの点数を入力)" aria-pressed="${cur.signs[i]===-1}"
        onclick="toggleScoreSign(${i})">${cur.signs[i]===-1?'−':'±'}</button>
      <input type="number" step="1" inputmode="numeric" class="${isAuto?'auto':''}" style="text-align:right;"
        aria-label="${pid?esc(pname(pid)):(i+1)+'番目'} の持ち点(百点単位)" aria-describedby="scoreUnitHint"
        placeholder="${isAuto?'自動: '+(autoScore()/100).toLocaleString():'持ち点'}"
        value="${val}" ${pid?'':'disabled'} oninput="setScore(${i}, this.value)" onblur="finalizeScore(${i}, this.value)">
      <span class="unit" aria-hidden="true">00</span>
    </div></div>`;
  }).join('');
  renderSumMsg();
}
function setSeat(i,v){
  cur.seats[i] = v ? +v : null;
  if(!v){ cur.scores[i]=null; cur.signs[i]=1; }
  renderGame();
}
/* ⚠️ かつて「メンバー変更」ボタンで席を全部空にしていたが廃止した(§6-31)。
   席は常にプルダウンで変えられるので、**直前のメンバーを残したまま**
   変えたい席だけ選び直す。席を空にリセットする経路を新たに作らないこと。 */
function selectGroup(gid){
  const g=S.groups.find(g=>g.id===gid);
  if(!g) return;
  const valid=g.members.filter(id=>S.players.some(p=>p.id===id));
  if(valid.length<4) toast('このグループのメンバーが不足しています(削除されたメンバーがいる可能性があります)','error');
  addToPool(valid);                       // グループ選択は参加メンバーにも反映する
  cur = resetCur([0,1,2,3].map(i=> valid[i] ?? null));
  justReset = true;
  renderGame();
}
/* この卓のメンバーを決めるダイアログ(§6-31)。
   参加メンバーは画面に常時出さず、ここでだけ確認・変更する。
   ⚠️ すべてのダイアログは共通の DOM を使うので、必ず resetModal() から始めること。
   ⚠️ その卓で既に打っている人は外せない(ボタンを disabled にする)。
      外すと履歴と参加者一覧が食い違い、場代の割り振りも合わなくなります。 */
function openPoolPicker(){
  const pool=poolIds();
  resetModal();
  document.getElementById('modalMsg').textContent='この卓のメンバー';
  if(!S.players.length){
    document.getElementById('modalBody').innerHTML='<div class="hint">メンバータブで登録してください。</div>';
    document.getElementById('modalCancel').style.display='none';
    const ok=document.getElementById('modalOk');
    ok.textContent='閉じる';
    ok.onclick=()=>closeModal();
    openModal();
    return;
  }
  const s=openSession();
  const locked=s ? seatsUsedIn(s.id) : [];
  const picked=new Set(pool);
  document.getElementById('modalBody').innerHTML =
    `<div class="presets" id="poolPick">`+
    S.players.map(p=>{
      const on=picked.has(p.id), lock=locked.includes(p.id);
      return `<button type="button" data-id="${p.id}" class="${on?'sel':''}" aria-pressed="${on}"
        ${lock?'disabled title="この卓で既に対局しているため外せません"':''}>${esc(p.name)}</button>`;
    }).join('')+
    `</div><div class="hint mt">5人以上でも同じ卓のまま。半荘ごとに席のプルダウンで4人を選びます。</div>`;
  const okBtn=document.getElementById('modalOk');
  const cancelBtn=document.getElementById('modalCancel');
  okBtn.textContent='決定';
  document.getElementById('poolPick').addEventListener('click', e=>{
    const b=e.target.closest('button[data-id]'); if(!b || b.disabled) return;
    const id=+b.dataset.id;
    if(picked.has(id)) picked.delete(id); else picked.add(id);
    b.classList.toggle('sel', picked.has(id));
    b.setAttribute('aria-pressed', picked.has(id));
  });
  okBtn.onclick=()=>{
    setPool([...picked]);
    // 外れた人が席に残らないようにする(点数も消す)
    const now=poolIds();
    cur.seats = cur.seats.map((id,i)=>{
      if(id && !now.includes(id)){ cur.scores[i]=null; cur.signs[i]=1; return null; }
      return id;
    });
    closeModal(); renderGame();
  };
  cancelBtn.onclick=()=>closeModal();
  openModal();
}
// 持ち点は百点単位で入力する(例:250 → 25,000点)。内部(cur.scores)は常に実点数で保持する。
// リアルタイム入力(oninput): キーボード入力を妨げないよう、DOM再生成(renderGame)は行わず、
// 入力値(百点単位)を実点数に変換して保持し、合計点数の表示とボタンのdisabled状態だけを更新する。
// 入力値と符号モードを合成する。
// 欄に直接マイナスを打った場合(PCなど)は、符号モードの方を入力に合わせて同期する。
function applySign(i, v){
  if(v==='' || v==='-' || v==='−') return null;
  const n=+v;
  if(!isFinite(n)) return null;
  if(n<0) cur.signs[i]=-1;          // 直接マイナスを打った → 符号モードを合わせる
  else if(n>0 && /^[+]?\d/.test(String(v).trim()) && String(v).trim()[0]!=='-'){
    // 正の数が打たれただけでは符号モードは変えない(±で指定した意図を尊重する)
  }
  return Math.abs(n)*cur.signs[i];
}
function setScore(i,v){
  const n=applySign(i,v);
  cur.scores[i] = n===null ? null : n*100;
  refreshSignBtn(i);
  renderSumMsg();
}
// フォーカスアウト時(onblur): このタイミングで初めて百点単位の整数に丸め、表示を更新する。
//
// ⚠️ ここで renderGame() を呼んではいけない。
//    renderGame() は #seats の innerHTML を丸ごと差し替えるため、
//    「点数入力欄にフォーカスがある状態で ± ボタンや席の <select> をタップする」と
//      ① タップ(pointerdown) → ② 入力欄が blur → ③ #seats が差し替わり、
//         タップされたボタン/セレクトが DOM から消える
//      ④ pointerup が別要素に着地するため click が発火しない
//    となり、1回目のタップが黙って無視される(2回目でようやく効く)。
//    そのため blur 後の更新は、ノードを作り直さない refreshScoreUI() で行う。
function finalizeScore(i,v){
  const n=applySign(i,v);
  cur.scores[i] = n===null ? null : Math.round(n)*100;
  refreshScoreUI();
}
// 点数まわりの表示だけを、DOMノードを作り直さずに更新する。
// (席の顔ぶれは変わらないので、select の options を作り直す必要はない)
// force=true のときは、フォーカス中の欄も含めて値を書き戻す(±ボタンによる符号反転など、
// 入力欄の外からの操作で値が変わったとき用)。
function refreshScoreUI(force){
  const box=document.getElementById('seats');
  if(!box) return;
  const isSet = cur.seats.filter(Boolean).length===4;
  const ai = isSet ? autoSeat() : -1;
  const auto = ai>=0 ? autoScore() : 0;
  box.querySelectorAll('.seat').forEach((el,i)=>{
    const inp=el.querySelector('input[type="number"]');
    if(!inp) return;
    const isAuto=(ai===i);
    inp.classList.toggle('auto', isAuto);
    inp.placeholder = isAuto ? '自動: '+(auto/100).toLocaleString() : '持ち点';
    const v = (cur.scores[i]===null || cur.scores[i]===undefined) ? '' : String(cur.scores[i]/100);
    // 入力中の欄は原則書き換えない(キャレット位置が先頭に飛ぶため)
    if((force || document.activeElement!==inp) && inp.value!==v) inp.value=v;
    refreshSignBtn(i);
  });
  renderSumMsg();
}
/* ±ボタン: モバイルの数字キーパッド(inputmode=numeric)にはマイナスキーが無い端末が多く、
   飛び(マイナス点)を入力できないため、タップで符号を切り替える。
   ⚠️ 値が入っていなくても押せること。空欄のまま押すと「次に入力する数字をマイナスにする」
      モードになり、ボタンが押下状態(−)で表示される。
      以前は `scores[i]` が null/0 のとき早期 return していたため、先に押しても何も起きなかった。 */
function toggleScoreSign(i){
  if(!cur.seats[i]) return;
  cur.signs[i] = cur.signs[i]===-1 ? 1 : -1;
  if(cur.scores[i]!==null && cur.scores[i]!==undefined && cur.scores[i]!==0){
    cur.scores[i] = Math.abs(cur.scores[i]) * cur.signs[i];
  }
  refreshScoreUI(true); // renderGame() だと連続タップ時に自分自身が DOM から消える
}
// ±ボタンの見た目(押下状態・ラベル)を現在の符号モードに合わせる
function refreshSignBtn(i){
  const box=document.getElementById('seats');
  if(!box) return;
  const seat=box.querySelectorAll('.seat')[i];
  const btn=seat && seat.querySelector('.signbtn');
  if(!btn) return;
  const minus=cur.signs[i]===-1;
  btn.classList.toggle('on', minus);
  btn.setAttribute('aria-pressed', minus?'true':'false');
  btn.textContent = minus ? '−' : '±';
}
// 未入力がちょうど1つならその席を自動計算
function autoSeat(){
  const empty = cur.scores.map((s,i)=>s===null?i:-1).filter(i=>i>=0);
  return empty.length===1 ? empty[0] : -1;
}
function autoScore(){
  const sum = cur.scores.reduce((a,b)=>a+(b||0),0);
  return totalScore() - sum;
}
function effScores(){
  const a=[...cur.scores]; const ai=autoSeat();
  if(ai>=0) a[ai]=autoScore();
  return a;
}
function renderSumMsg(){
  const el=document.getElementById('sumMsg');
  const btn=document.getElementById('saveGameBtn');
  if(cur.seats.filter(Boolean).length<4){
    el.innerHTML=`<div class="hint">4人を選択してください</div>`;
    if(btn) btn.disabled=true;
    return;
  }
  const filled = cur.scores.filter(s=>s!==null).length;
  if(filled<3){
    el.innerHTML=`<div class="hint">あと${3-filled}人</div>`;
    if(btn) btn.disabled=true;
    return;
  }
  const sc=effScores();
  const sum=sc.reduce((a,b)=>a+b,0);
  const need=totalScore();   // 配給原点×4人。オカ設定で変わる(§6-30)
  const valid = sum===need;
  el.innerHTML = valid ? `<div class="ok">✓ 合計 ${need.toLocaleString()}点</div>`
    : `<div class="warn">合計が ${sum.toLocaleString()}点 です(${need.toLocaleString()}点になるよう確認)</div>`;
  // 4人選択済み・合計がちょうど配給原点×4の場合のみ確定ボタンを有効化(誤操作・計算ミスの防止)
  if(btn) btn.disabled = !valid;
}
/* 同点があれば、どちらを上位にするかをユーザーに選ばせて着順(idx[rank]=seat)を返す。
   同点がなければ undefined(= calcPts の既定ルールに任せる)。キャンセルされたら null。
   ⚠️ 戻り値の null と undefined は意味が違う。null は「保存をやめる」合図。
   3人以上の同点では、上位から1人ずつ順に選ばせる。 */
async function resolveTieOrder(scores){
  const groups=tieGroups(scores);
  if(!groups.length) return undefined;
  const order=defaultRankOrder(scores);
  for(const group of groups){
    // この同点グループが占める順位帯(order 上の位置)
    const slots=order.map((seat,r)=>group.includes(seat)?r:-1).filter(r=>r>=0);
    let rest=[...group].sort((a,b)=>a-b); // 既定は席順(上家が先)
    const decided=[];
    const pts=scores[group[0]].toLocaleString();
    while(rest.length>1){
      // 聞き方はできるだけ短く。2人なら「どちらが上位?」だけで足りる。
      // 3人以上同点のときだけ、何位を決めているのかを添える。
      const nth=slots[decided.length]+1;
      const msg = rest.length===2 && group.length===2
        ? `${pname(cur.seats[rest[0]])} と ${pname(cur.seats[rest[1]])} が ${pts}点で同点です。\nどちらが上位ですか?`
        : `${pts}点で ${group.length}人が同点です。\n${nth}位はどなたですか?`;
      const pick=await chooseDialog(msg, rest.map(seat=>({label:pname(cur.seats[seat]), value:seat})));
      if(pick===null) return null; // キャンセル → 保存しない
      decided.push(pick);
      rest=rest.filter(s=>s!==pick);
    }
    decided.push(rest[0]);
    slots.forEach((r,k)=>{ order[r]=decided[k]; });
  }
  return order;
}
/* ⚠️ saveGame は同点ダイアログを待つため async。
   await をまたぐ間も確定ボタンは押せてしまうので、連打による二重保存をこのフラグで防ぐ。
   同期関数だった頃には不要だった対策なので、同期に戻さない限り外さないこと。 */
let saving = false;
async function saveGame(){
  if(saving) return;
  saving = true;
  try{ await saveGameInner(); } finally { saving = false; }
}
async function saveGameInner(){
  if(cur.seats.some(s=>s===null)){ toast('4人全員を選択してください','error'); return; }
  if(new Set(cur.seats).size<4){ toast('同じメンバーが重複しています','error'); return; }
  const filled = cur.scores.filter(s=>s!==null).length;
  if(filled<3){ toast('3人以上の点数を入力してください','error'); return; }
  const sc=effScores();
  const need=totalScore();
  if(sc.reduce((a,b)=>a+b,0)!==need){ toast(`合計が${need.toLocaleString()}点になっていません`,'error'); return; }
  const tobi=[]; sc.forEach((s,i)=>{ if(s<0) tobi.push({loser:i}); });

  // 同点があれば、どちらを上位にするかをここで決める(キャンセルされたら保存しない)
  const order = await resolveTieOrder(sc);
  if(order===null) return;

  if(editingGame!==null){
    // 確定済みの半荘を編集中: 配列インデックスではなくオブジェクト参照で現在位置を再検索することで、
    // 編集中に他の半荘が削除・追加されて配列がずれていても正しい半荘を上書きする。
    // 条件(レート・ウマ)は settingsFor() が決める:
    //   進行中の卓 → 現在の設定 / 集計済みの卓 → その対局に保存されている当時の値
    // ⚠️ `calcPts(sc, order)` のように引数を飛ばさないこと。
    //    第2引数を省くと常に現在の設定になり、集計済みの卓まで動いてしまいます。
    const idx=S.games.indexOf(editingGame);
    if(idx<0){ editingGame=null; toast('編集対象の半荘が見つかりませんでした(削除された可能性があります)','error'); renderGame(); return; }
    const cond=settingsFor(editingGame);
    const e=calcPts(sc, cond, order);
    S.games[idx] = {...editingGame, seats:[...cur.seats], scores:sc, pts:e.pts, ranks:e.ranks, tobi,
      rate:cond.rate, uma1:cond.uma1, uma2:cond.uma2, start:startOf(cond), ret:retOf(cond)};
    editingGame=null;
    save();
    cur = resetCur();
    justReset = true;
    renderGame(); renderHistory();
    toast('半荘の結果を更新しました', 'ok');
    return;
  }

  // 新規保存: レート・ウマは「保存した時点の設定」を対局ごとに固定する。
  // あとで設定を変えても過去の対局の金額・ポイントは動かない。
  // sid は進行中の卓。無ければここで新しい卓が始まる(日付では分けない)。
  const now=Date.now();
  const n=calcPts(sc, null, order);
  const sess=ensureSession();
  // 打った4人は必ず参加メンバーに含める(席の select から直接選ばれた場合の取りこぼし防止・§6-31)
  sess.pool=[...new Set([...(Array.isArray(sess.pool)?sess.pool:[]), ...cur.seats])].filter(Boolean);
  const saved={sid:sess.id, t:now, seats:[...cur.seats], scores:sc, pts:n.pts, ranks:n.ranks,
    tobi, rate:S.settings.rate, uma1:S.settings.uma1, uma2:S.settings.uma2,
    start:startOf(), ret:retOf()};
  S.games.push(saved);
  settleSid=sess.id;
  save();
  cur = resetCur([...cur.seats]);
  renderGame(); renderHistory();
  // 確定した半荘の結果をその場で見せる(その卓で何局目かを添える)
  await showGameResult(saved, sessionGames(sess.id).length);
}
// 履歴から確定済みの半荘を呼び出し、対局タブの入力欄に読み込んで編集できるようにする
function editGame(gi){
  const g=S.games[gi];
  if(!g) return;
  editingGame = g;
  cur = resetCur([...g.seats]);
  cur.scores = [...g.scores];
  // 読み込んだ点数がマイナスなら、±ボタンの状態もそれに合わせる
  cur.signs = g.scores.map(s=> s<0 ? -1 : 1);
  justReset = true;
  showTab('game');
  toast('半荘を編集中です。保存すると内容が上書きされます');
}
function cancelEditGame(){
  editingGame = null;
  cur = resetCur();
  justReset = true;
  renderGame();
}

/* 1半荘のリザルト表。履歴のアコーディオンと、確定直後のモーダルの両方で使う。
   ⚠️ 片方だけ書き換えると表示がずれるので、必ずこの関数を直すこと。 */
function gameResultTable(g){
  const order=[0,1,2,3].sort((a,b)=>g.ranks[a]-g.ranks[b]);
  const rows=order.map(i=>{
    const money=Math.round(g.pts[i]*g.rate*10);
    const tobi=(g.tobi||[]).some(t=>t.loser===i) ? '<span class="badge">トビ</span>' : '';
    const top=g.ranks[i]===0;
    return `<tr class="${top?'rank1':''}"><td>${top?CROWN:''}${g.ranks[i]+1}位${tobi}</td><td>${esc(pname(g.seats[i]))}</td>
      <td>${g.scores[i].toLocaleString()}</td><td class="${cls(g.pts[i])}">${fmt(g.pts[i])}</td>
      <td class="${cls(money)}">${yen(money)}</td></tr>`;
  }).join('');
  return `<table><tr><th scope="col">順位</th><th scope="col">名前</th><th scope="col">点数</th><th scope="col">pt</th><th scope="col">収支</th></tr>${rows}</table>`;
}
// 半荘を確定した直後に、その局の結果をモーダルで見せる
function showGameResult(g, nth){
  return alertDialog(`${nth}局目の結果`, gameResultTable(g)
    );
}

/* ---------- 履歴(卓ごと) ----------
   ⚠️ 日付ではなく g.sid でグルーピングすること。日付をまたいでも集計は分かれない。 */
function renderHistory(){
  const el=document.getElementById('historyList');
  if(!S.games.length){
    el.innerHTML='<div class="card center hint">まだ対局がありません</div>';
    return;
  }
  const bySid={};
  S.games.forEach((g,gi)=>{ (bySid[g.sid]=bySid[g.sid]||[]).push({g,gi}); });
  const sids=S.sessions.filter(s=>bySid[s.id]).sort((a,b)=>b.t-a.t);
  el.innerHTML = sids.map(sess=>{
    const d=sessionLabel(sess);
    const list=bySid[sess.id];
    const open=!sess.closedAt;
    // --- 卓の合計(対局点数のみ) ---
    const agg={};
    list.forEach(({g})=> g.seats.forEach((pid,i)=>{
      const a=agg[pid]=agg[pid]||{pt:0,money:0,n:0};
      a.pt+=g.pts[i]; a.money+=Math.round(g.pts[i]*g.rate*10); a.n++;
    }));
    const totRows=Object.entries(agg)
      .map(([pid,a])=>({pid:+pid, ...a}))
      .sort((a,b)=>b.money-a.money)
      .map((a,idx)=>`<tr class="${idx===0?'rank1':''}"><td>${idx===0?CROWN:''}${esc(pname(a.pid))}</td><td>${a.n}</td>
        <td class="${cls(a.pt)}">${fmt(a.pt)}</td>
        <td class="${cls(a.money)}">${yen(a.money)}</td></tr>`).join('');
    // --- 各半荘(アコーディオン・古い順にナンバリング) ---
    const gamesHtml=list.map(({g,gi},k)=>{
      // 見出しは局数だけ。中身は開けば分かるので、時刻やトップ名は出さない
      return `<details class="acc">
        <summary><span><span class="roundno">${k+1}</span>局</span></summary>
        <div class="accbody">
          ${gameResultTable(g)}
          <div class="row mt">
            <button class="btn small" onclick="editGame(${gi})">編集</button>
            <button class="btn small danger" onclick="delGame(${gi})">削除</button>
          </div>
        </div>
      </details>`;
    }).reverse().join('');
    // 進行中はバッジを出さない(「集計」ボタンがあること自体が進行中の印)
    const badge = open ? '' : '<span class="badge">集計済み</span>';
    const action = open
      ? `<button class="btn small main" onclick="closeSession()">集計</button>`
      : `<button class="btn small" onclick="reopenSession(${sess.id})">再開</button>`;
    // 卓(合計カード) が親、各半荘がその中の子。.session でひとまとまりにする
    return `<div class="session">
      <div class="card summary">
        <div class="gtitle">
          <span style="font-size:16px; font-weight:700;">${d} ${badge}</span>
          ${action}
        </div>
        <h2 class="mt">卓の合計(${list.length}局)</h2>
        <table><tr><th scope="col">名前</th><th scope="col">局数</th><th scope="col">pt</th><th scope="col">収支</th></tr>${totRows}</table>
      </div>
      <div class="games">${gamesHtml}</div>
    </div>`;
  }).join('');
}

async function delGame(gi){
  if(!(await confirmDialog('この半荘を削除しますか?', {danger:true, okText:'削除'}))) return;
  const removed=S.games[gi];
  S.games.splice(gi,1); save();
  renderHistory();
  toast('半荘を削除しました', null, {label:'元に戻す', onClick:()=>{
    S.games.splice(gi,0,removed); save(); renderHistory();
  }});
}

/* ---------- 場代・飲食(日付キーで管理し、その日の実参加者のみに割り振る) ---------- */
// 読み取り専用。S.expenses を書き換えないこと(画面を開いただけで空の日付エントリが
// 生まれて保存され、S.expenses が使っていない日で膨らむのを防ぐため)。
const EMPTY_EXPENSE = Object.freeze({venue:0, personal:Object.freeze({}), splitAll:false});
function peekExpenses(sid){ return S.expenses[sid] || EMPTY_EXPENSE; }
// 書き込み用。setVenue / setPersonal / setSplitAll からのみ呼ぶこと。
function expensesOf(sid){
  if(!S.expenses[sid]) S.expenses[sid]={venue:0, personal:{}, splitAll:false};
  return S.expenses[sid];
}
// 入力が全部ゼロに戻された卓のエントリは削除する(既存の空エントリの掃除も兼ねる)
function pruneExpenses(sid){
  const ex=S.expenses[sid];
  if(!ex) return;
  const hasPersonal=Object.values(ex.personal||{}).some(p=>(p&&(p.food||p.drink)));
  if(!(ex.venue||0) && !hasPersonal) delete S.expenses[sid];
}
/* 金額を人数で等分する。
   1人あたりを SPLIT_UNIT(100円)単位に切り上げた額(base)を他の人の負担とし、
   調整役(adjustPid)が残りを引き受ける。
     例) 7,300円を4人 → base=1,900円 / 調整役=7,300−1,900×3=1,600円
   → 調整役以外は必ず100円単位。合計は必ず total ちょうどになる。
   調整役は負担が軽くなるので、**その卓の対局成績が最下位の人**を充てる(呼び出し側で決める)。
   ⚠️ total が100円単位でない場合(飲食の実費など)、端数は調整役の額に寄る。
      全員を100円単位にしつつ合計を total に一致させることは原理的に不可能なため。
   ⚠️ 総額が少なすぎて調整役がマイナスになる場合は base を下げる(負担を負の値にしない)。 */
const SPLIT_UNIT = 100;
function splitEvenly(total, pids, adjustPid){
  const out={};
  const n=pids.length;
  if(!n) return out;
  if(total<=0){ pids.forEach(id=>out[id]=0); return out; }
  const adj = pids.includes(adjustPid) ? adjustPid : pids[0];
  let base=Math.ceil(total/n/SPLIT_UNIT)*SPLIT_UNIT;
  while(base>0 && total-base*(n-1) < 0) base-=SPLIT_UNIT;
  pids.forEach(id=>out[id]=base);
  out[adj] = total - base*(n-1);
  return out;
}
/* 端数の調整役 = その卓で対局収支が最下位の人。
   同額なら席順(pids の並び)が後の人。対局がまだ無い卓は先頭の人。
   ⚠️ 対局の pt だけで判断すること。チップや場代を混ぜると循環参照になります
      (場代の割り振りを決めるのに場代込みの収支が要る、という堂々巡り)。 */
function splitAdjuster(sid, pids){
  if(!pids.length) return null;
  const money={};
  pids.forEach(id=>money[id]=0);
  sessionGames(sid).forEach(g=>g.seats.forEach((pid,i)=>{
    if(money[pid]!==undefined) money[pid]+=Math.round(g.pts[i]*g.rate*10);
  }));
  return pids.reduce((lo,id)=> money[id] <= money[lo] ? id : lo, pids[0]);
}
// その卓の飲食の総額(個人入力の合計)
function personalTotal(sid){
  const per=peekExpenses(sid).personal||{};
  return Object.values(per).reduce((a,p)=>a+((p&&p.food)||0)+((p&&p.drink)||0), 0);
}
function venueShareMap(sid){ // {pid: 場代負担額}(完全割り勘モードでは飲食も含めた総額の等分)
  const pids=dayParticipants(sid);
  const ex=peekExpenses(sid);
  if(!pids.length) return {};
  if(ex.splitAll){
    // 完全割り勘: 場代+飲食の総額を全員で等分する(誰が何を頼んだかは問わない)
    return splitEvenly((ex.venue||0)+personalTotal(sid), pids, splitAdjuster(sid, pids));
  }
  const v=ex.venue||0;
  if(!v) return {};
  const base=Math.floor(v/pids.length), rem=v-base*pids.length;
  const out={};
  pids.forEach((id,i)=> out[id]=base+(i<rem?1:0));
  return out;
}
function personalOf(sid,pid){
  const p=(peekExpenses(sid).personal||{})[pid]||{};
  return {food:p.food||0, drink:p.drink||0};
}
// ⚠️ 完全割り勘モードでは、飲食は既に venueShareMap 側で総額に含めて等分済み。
//    ここで個人の実費を足すと二重計上になるので、shares だけを返すこと。
function costOf(sid,pid, shares){
  if(peekExpenses(sid).splitAll) return (shares[pid]||0);
  const per=personalOf(sid,pid);
  return (shares[pid]||0)+per.food+per.drink;
}
function setPersonal(d,pid,k,v){
  const ex=expensesOf(d);
  const p=ex.personal[pid]=ex.personal[pid]||{food:0,drink:0};
  p[k]=Math.round(+v)||0;
  pruneExpenses(d);
  save(); renderTotal();
}
function setVenue(d,v){
  expensesOf(d).venue = Math.round(+v)||0;
  pruneExpenses(d);
  save(); renderTotal();
}
// 完全割り勘モードの切り替え。true なら「場代+飲食の総額」を人数で等分する。
function setSplitAll(d,on){
  expensesOf(d).splitAll = !!on;
  pruneExpenses(d);
  save(); renderTotal();
}
async function clearExpenses(){
  const d=settleSid;
  if(!d){ toast('上で卓を選んでからクリアしてください','error'); return; }
  if(!(await confirmDialog(`${sessionLabel(sessionById(d))} の場代・飲食の入力をクリアします。よろしいですか?`, {danger:true, okText:'クリア'}))) return;
  const removed=S.expenses[d];
  if(!removed){ toast('この卓の入力はありません'); return; }
  delete S.expenses[d];
  save(); renderTotal();
  toast('場代・飲食をクリアしました', null, {label:'元に戻す', onClick:()=>{
    S.expenses[d]=removed; save(); renderTotal();
  }});
}

          <td><input type="number" step="10" inputmode="numeric" style="width:72px; padding:5px; text-align:right;" placeholder="0"
            value="${per.drink||''}" onchange="setPersonal('${d}',${pid},'drink',this.value)"></td>

      `<tr><th scope="row">総額</th><td colspan="2"></td><td><b>${grand.toLocaleString()}円</b></td></tr></table>
      <div class="hint">${SPLIT_UNIT}円単位。端数は最下位の ${esc(pname(splitAdjuster(d,pids)))} が調整</div>`);
  }
  el.innerHTML = head +
    `<table class="mt"><tr><th scope="col">名前</th><th scope="col">場代</th><th scope="col">食事</th><th scope="col">ドリンク</th><th scope="col">合計</th></tr>`+
    pids.map(pid=>{
      const per=personalOf(d,pid); const c=costOf(d,pid,shares);
      return `<tr><td>${esc(pname(pid))}</td><td>${(shares[pid]||0).toLocaleString()}</td>
        <td><input type="number" step="10" inputmode="numeric" style="width:72px; padding:5px; text-align:right;" placeholder="0"
          value="${per.food||''}" onchange="setPersonal('${d}',${pid},'food',this.value)"></td>
        <td><input type="number" step="10" inputmode="numeric" style="width:72px; padding:5px; text-align:right;" placeholder="0"
          value="${per.drink||''}" onchange="setPersonal('${d}',${pid},'drink',this.value)"></td>
        <td>${c.toLocaleString()}円</td></tr>`;
    }).join('')+`</table>
`;
