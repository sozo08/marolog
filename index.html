/* ---------- セッション(卓) ----------
   集計の単位。日付が変わっても勝手に分かれず、「集計」(closeSession)を押すまで
   同じ卓に半荘が積み上がる。確定後に次の半荘を入れると、自動で新しい卓が始まる。
   ⚠️ 集計・グルーピングは必ず g.sid を基準にすること。dstr(g.t) で分けてはいけない。
      dstr / tstr は「表示用のラベル」としてのみ使う。 */
function openSession(){ return S.sessions.find(s=>!s.closedAt) || null; }
/* ---------- 卓の参加メンバー(プール)§6-31 ----------
   5人以上で卓を囲むことを想定し、「その卓に居る人」を sessions[].pool に持つ。
   半荘ごとに、そのプールから4人を選ぶ。
   ⚠️ 卓(セッション)は最初の半荘を保存するまで作られない。それまでの指定は
      pendingPool に持ち、保存時に卓へ移す。pendingPool は保存しない一時値。 */
let pendingPool = null;
// その卓で実際に打った人(プールが空のときの復元元)
function seatsUsedIn(sid){
  const used=[];
  sessionGames(sid).forEach(g=>g.seats.forEach(id=>{ if(id && !used.includes(id)) used.push(id); }));
  return used;
}
function poolIds(){
  const alive=id=>S.players.some(p=>p.id===id);   // 削除されたメンバーは除く
  const s=openSession();
  if(s){
    const p=Array.isArray(s.pool)?s.pool.filter(alive):[];
    return p.length ? p : seatsUsedIn(s.id);
  }
  return (pendingPool||[]).filter(alive);
}
function setPool(ids){
  const uniq=[...new Set(ids)].filter(id=>S.players.some(p=>p.id===id));
  const s=openSession();
  if(s){ s.pool=uniq; save(); } else { pendingPool=uniq; }
}
function addToPool(ids){ setPool([...poolIds(), ...ids]); }
function sessionById(sid){ return S.sessions.find(s=>s.id===+sid) || null; }
function sessionGames(sid){ return S.games.filter(g=>g.sid===+sid); }
// 進行中の卓を返す。無ければ作る(半荘を保存する瞬間にだけ呼ぶこと)
function ensureSession(){
  let s=openSession();
  if(!s){
    // 卓を開くときに、それまでの暫定プールを引き継ぐ(§6-31)
    s={id:S.nextId++, t:Date.now(), closedAt:null, pool:(pendingPool||[]).slice()};
    S.sessions.push(s);
    pendingPool=null;
  }
  return s;
}
// 卓の表示名。同じ日に複数の卓があれば「第N卓」を付けて区別する
function sessionLabel(s){
  if(!s) return '';
  const day=dstr(s.t);
  const sameDay=S.sessions.filter(x=>dstr(x.t)===day).sort((a,b)=>a.t-b.t);
  const idx=sameDay.findIndex(x=>x.id===s.id);
  const nth = sameDay.length>1 ? ` 第${idx+1}卓` : '';
  return `${day.replaceAll('-','/')}${nth}`;
}
function sessionIsEmpty(s){
  return !sessionGames(s.id).length
    && !Object.keys(peekChips(s.id).counts).length
    && !S.expenses[s.id];
}
async function closeSession(){
  const s=openSession();
  if(!s){ toast('確定できる進行中の卓がありません','error'); return; }
  const n=sessionGames(s.id).length;
  if(!n){ toast('半荘が1局も記録されていません','error'); return; }
  if(!(await confirmDialog(`${sessionLabel(s)} を集計します(全${n}局)。\n集計すると、次の半荘から新しい卓として記録されます。`, {okText:'集計'}))) return;
  s.closedAt=Date.now();
  settleSid=s.id; // 精算タブは集計した卓を表示する
  /* 次の卓は「同じ面子の続き」であることが多いので、参加メンバーと席をそのまま引き継ぐ。
     ⚠️ ここを空にしないこと。プルダウンが全部ブランクになり、毎回4人を選び直すことになります(§6-31)。
        面子が変わるときは、変えたい席のプルダウンだけ選び直せば済みます。 */
  pendingPool=(Array.isArray(s.pool)&&s.pool.length ? s.pool : seatsUsedIn(s.id)).slice();
  cur=resetCur([...cur.seats]);   // 席は残して点数だけクリア
  save(); renderGame(); renderHistory(); renderTotal();
  toast('集計しました', 'ok', {label:'取り消す', onClick:()=>{
    s.closedAt=null; save(); renderGame(); renderHistory(); renderTotal();
  }});
}
// 確定済みの卓を開き直す。あとから半荘やチップを足したいとき用。
// 進行中の卓は同時に1つだけなので、他に開いているものがあれば閉じる。
async function reopenSession(sid){
  const s=sessionById(sid);
  if(!s || !s.closedAt) return;
  const cur=openSession();
  if(cur && cur.id!==s.id){
    if(!(await confirmDialog(`現在進行中の「${sessionLabel(cur)}」を確定して、「${sessionLabel(s)}」を再開します。よろしいですか?`, {okText:'再開'}))) return;
    cur.closedAt=Date.now();
  }
  s.closedAt=null;
  settleSid=s.id;
  save(); renderGame(); renderHistory(); renderTotal();
  toast(`${sessionLabel(s)} を再開しました`, 'ok');
}

/* ---------- チップ(全ゲーム終了時) ----------
   S.chips = {'YYYY-MM-DD': {price, start, counts:{pid: 最終枚数}}}
   ⚠️ counts に入れるのは**所持枚数**(例: 25 / 17)。増減ではありません。
      増減は `所持枚数 − CHIP_ORIGIN(20)` で求めます。
      形式印 `v:CHIP_FMT` が無いデータは「増減」だった頃のものなので、
      normalize が原点を足し戻します(§6-26)。
   単価(price)を卓ごとに固定しているので、あとで設定を変えても
   過去の卓のチップ精算額は変わらない(games[].rate と同じ考え方)。
   ⚠️ 集計時は必ずその卓の price を使うこと。S.settings を使ってはいけない。 */
function todayStr(){ return dstr(Date.now()); }
// 読み取り専用。記録がない卓は現在の設定を既定値として返すだけで、S.chips は書き換えない。
function peekChips(sid){
  return S.chips[sid] || {price:S.settings.chipPrice, counts:{}, v:CHIP_FMT};
}
// 書き込み用。setDayChip からのみ呼ぶこと。
function chipsOf(sid){
  if(!S.chips[sid]) S.chips[sid]={price:S.settings.chipPrice, counts:{}, v:CHIP_FMT};
  return S.chips[sid];
}
// その卓の実参加者。
// ⚠️ 「該当者がいなければ登録メンバー全員を返す」処理を絶対に足さないこと(§6-1)。
function dayParticipants(sid){
  const set=new Set();
  sessionGames(sid).forEach(g=>g.seats.forEach(pid=>set.add(pid)));
  Object.keys(peekChips(sid).counts).forEach(pid=>set.add(+pid));
  // 「進行中の卓にまだ何も記録がない」場合のみ、対局タブで選択中のメンバーを仮参加者とする
  // (1局も保存する前に場代を入力できるようにするための、意図的で限定的なフォールバック)
  const s=sessionById(sid);
  if(!set.size && s && !s.closedAt){
    const seated=cur.seats.filter(id=>id && S.players.some(p=>p.id===id));
    if(seated.length===4) seated.forEach(id=>set.add(id));
  }
  return [...set].filter(pid=>S.players.some(p=>p.id===pid));
}
function renderChipSettle(){
  const el=document.getElementById('chipSettle');
  if(!S.players.length){ el.innerHTML='<div class="hint">メンバー登録後に使えます</div>'; return; }
  const d=settleSid;
  if(!d){
    el.innerHTML='<div class="hint">卓を選ぶと入力できます</div>';
    return;
  }
  const meta=peekChips(d);
  const c=meta.counts;
  const pids=dayParticipants(d);
  if(!pids.length){
    el.innerHTML='<div class="hint">参加者が未確定です</div>';
    return;
  }
  // 入力するのは「所持枚数」。原点(20枚)との差が増減になる。
  let html=pids.map(pid=>{
      const has=c[pid]!==undefined;
      const delta=has ? c[pid]-CHIP_ORIGIN : 0;
      const minus=chipSigns[pid]===-1;
      return `<div class="listrow"><span>${esc(pname(pid))}</span>
        <span class="meta">${has?`<span class="${cls(delta)}">${fmt(delta)}枚 (${yen(delta*meta.price)})</span>`:''}
        <button type="button" class="btn small signbtn ${minus?'on':''}" style="margin-left:8px;"
          aria-label="${esc(pname(pid))} の符号を切り替え(マイナスの枚数を入力)" aria-pressed="${minus}"
          onclick="toggleChipSign('${d}',${pid})">${minus?'−':'±'}</button>
        <input type="number" step="1" inputmode="numeric" placeholder="${CHIP_ORIGIN}" style="width:76px; text-align:right; margin-left:6px;"
          aria-label="${esc(pname(pid))} の所持枚数"
          value="${c[pid]??''}" onchange="setDayChip('${d}',${pid},this.value)"></span></div>`;
    }).join('');
  /* チップはやり取りなので、全員の増減を足すと 0 になるはず。
     ⚠️ 入力の途中は当然 0 になりません。**全員が入力し終わってから**だけ知らせること
        (以前、1人目を入れた時点から赤い警告が出続けて邪魔になった)。 */
  const entered=Object.keys(c).length;
  const diff=Object.values(c).reduce((a,n)=>a+(n-CHIP_ORIGIN),0);
  if(entered>=pids.length){
    html += diff===0
      ? `<div class="ok">✓ 増減の合計 0枚</div>`
      : `<div class="warn">増減の合計が ${fmt(diff)}枚 です(0になるはず・入力を確認してください)</div>`;
  }else if(entered){
    html += `<div class="hint">あと${pids.length-entered}人</div>`;
  }
  html+=`<div class="hint mt">所持枚数を入力(原点 ${CHIP_ORIGIN}枚 / 単価 ${meta.price}円)</div>`;
  el.innerHTML=html;
}
/* チップ欄の符号モード {pid: -1}。点数入力の cur.signs と同じ考え方(§6-20)。
   大きく負けて原点を割り込んだとき、モバイルの数字キーパッドにはマイナスキーが無いため
   ± ボタンで切り替える。⚠️ 値を入れる前にも押せること。
   卓を切り替えたらリセットする(別の卓の符号を引きずらないため)。 */
let chipSigns={};
function applyChipSign(pid, v){
  if(v==='' || v==='-' || v==='−') return null;
  const n=+v;
  if(!isFinite(n)) return null;
  if(n<0) chipSigns[pid]=-1;            // 直接マイナスを打った → 符号モードを合わせる
  return Math.abs(Math.round(n)) * (chipSigns[pid]===-1 ? -1 : 1);
}
function toggleChipSign(d,pid){
  chipSigns[pid] = chipSigns[pid]===-1 ? 1 : -1;
  const cur=peekChips(d).counts[pid];
  if(cur!==undefined && cur!==0){
    chipsOf(d).counts[pid] = Math.abs(cur) * chipSigns[pid];
    save();
  }
  renderTotal();
}
function setDayChip(d,pid,v){
  const meta=chipsOf(d);
  const n=applyChipSign(pid, v);
  if(n===null){ delete meta.counts[pid]; }
  else { meta.counts[pid]=n; }
  if(!Object.keys(meta.counts).length) delete S.chips[d]; // 全部消したら卓ごと削除
  save(); renderTotal();
}

/* ---------- 精算 ----------
   day: 'YYYY-MM-DD' を渡すとその日だけを集計する。null / 省略時は全期間の通算。
   ⚠️ 金額は必ず対局ごとの g.rate / その日の chips[].price・start を使うこと。
      S.settings.rate / chipPrice を集計に使ってはいけない(過去分が動く)。 */
function totals(sid){
  const day = sid; // 以降のキーはすべてセッションID
  const map={};
  S.players.forEach(p=> map[p.id]={name:p.name, n:0, top:0, rankSum:0, pt:0, chips:0, ptMoney:0, chipYen:0, money:0, exp:0, tobi:0});
  const games = day ? sessionGames(day) : S.games;
  games.forEach(g=>{
    g.seats.forEach((pid,i)=>{
      const t=map[pid]; if(!t) return;
      t.n++; t.rankSum+=g.ranks[i]+1; if(g.ranks[i]===0)t.top++;
      t.pt+=g.pts[i];
      t.ptMoney+=Math.round(g.pts[i]*g.rate*10);
      if((g.tobi||[]).some(x=>x.loser===i))t.tobi++;
    });
  });
  const chipDays = day ? (S.chips[day] ? [day] : []) : Object.keys(S.chips);
  chipDays.forEach(d=>{
    const m=peekChips(d);
    Object.entries(m.counts).forEach(([pid,n])=>{
      const t=map[pid]; if(!t) return;
      t.chips += (n - CHIP_ORIGIN);              // counts は所持枚数。原点を引いて増減にする
      t.chipYen += (n - CHIP_ORIGIN) * m.price;
    });
  });
  // 場代・飲食は日ごとに、その日の実参加者だけに割り振る(日を跨いで混ざらないようにする)
  const expDays = day ? (S.expenses[day] ? [day] : []) : Object.keys(S.expenses);
  expDays.forEach(d=>{
    const shares=venueShareMap(d);
    const ex=peekExpenses(d);
    const pids=new Set([...Object.keys(shares).map(Number), ...Object.keys(ex.personal||{}).map(Number)]);
    pids.forEach(pid=>{
      const t=map[pid]; if(!t) return;
      t.exp -= costOf(d, pid, shares); // 費用はマイナス計上
    });
  });
  S.players.forEach(p=>{
    const t=map[p.id]; if(!t) return;
    t.money = t.ptMoney + t.chipYen;
  });
  return Object.values(map).filter(t=>t.n>0 || t.exp!==0 || t.chips!==0)
    .sort((a,b)=>(b.money+b.exp)-(a.money+a.exp));
}
/* ---------- 精算タブの対象卓 ----------
   セッションID = その卓だけ / null = 通算(全期間) / undefined = 未初期化(初回に既定値を入れる)
   ⚠️ undefined と null を区別している。null は「ユーザーが自分で通算を選んだ」状態なので、
      再描画のたびに既定へ戻してはいけない。
   チップ・場代の入力欄もこの卓を対象にするため、過去の卓を選べば後から修正できる。 */
let settleSid = undefined;
function settleSidOptions(){
  // 対局・チップ・場代のいずれかが記録されている卓 + 進行中の卓
  const used=new Set([
    ...S.games.map(g=>g.sid),
    ...Object.keys(S.chips).map(Number),
    ...Object.keys(S.expenses).map(Number)
  ]);
  return S.sessions.filter(s=>used.has(s.id) || !s.closedAt).sort((a,b)=>b.t-a.t);
}
// 既定は「進行中の卓」。無ければ直近に確定した卓。
function defaultSettleSid(){
  const open=openSession();
  if(open) return open.id;
  const opts=settleSidOptions();
  return opts.length ? opts[0].id : null;
}
function setSettleSid(v){
  settleSid = v==='__all__' ? null : +v;
  chipSigns={}; // 別の卓に符号モードを持ち越さない
  renderTotal();
}
function renderTotal(){
  const opts=settleSidOptions();
  // 初回表示、または選択中の卓が候補から消えた場合(その卓の対局を全部削除したなど)は
  // 既定に戻す。ユーザーが明示的に選んだ「通算」(null)はそのまま維持する。
  if(settleSid===undefined || (settleSid!==null && !opts.some(s=>s.id===settleSid))){
    settleSid=defaultSettleSid();
  }
  const sel=document.getElementById('settleDatePicker');
  if(sel){
    sel.innerHTML = opts.map(s=>
      `<option value="${s.id}" ${s.id===settleSid?'selected':''}>${sessionLabel(s)}${s.closedAt?'':'(進行中)'}</option>`
    ).join('') + `<option value="__all__" ${settleSid===null?'selected':''}>通算(全期間)</option>`;
  }
  const scopeEl=document.getElementById('totalScopeLabel');
  if(scopeEl) scopeEl.textContent = settleSid===null ? '通算(全期間)' : sessionLabel(sessionById(settleSid));

  renderChipSettle();
  renderExpenses();
  const ts=totals(settleSid);
  const el=document.getElementById('totalTable');
  if(!ts.length){
    el.innerHTML = settleSid===null
      ? '<div class="hint">対局データがありません</div>'
      : '<div class="hint">この卓の記録はまだありません</div>';
    renderGrandTotal([]); renderShareCanvas([]); return;
  }
  /* ⚠️ この表は「対局の結果」だけ。チップ・場代を混ぜないこと。
     金額を全部足した表は下の「合計」カード(renderGrandTotal)が担当する(§6-28)。 */
  el.innerHTML=`<table><tr><th scope="col">名前</th><th scope="col">半荘</th><th scope="col">pt</th><th scope="col">金額</th></tr>`+
    ts.map((t,idx)=>`<tr class="${idx===0?'rank1':''}"><td>${idx===0?CROWN:''}${esc(t.name)}</td><td>${t.n}</td>
      <td class="${cls(t.pt)}">${fmt(t.pt)}</td>
      <td class="${cls(t.ptMoney)} bigmoney" style="font-size:15px;">${yen(t.ptMoney)}</td></tr>`).join('')+`</table>`;
  renderGrandTotal(ts);
  renderShareCanvas(ts);
}
/* ---------- 合計(対局 + チップ + 場代ほか) ----------
   ⚠️ 内訳と合計は**常に全部出す**こと。以前は場代が0のとき列ごと消していたため、
   「この合計に何が入っているのか」が画面によって変わって分かりにくかった(§6-27)。 */
function renderGrandTotal(ts){
  const el=document.getElementById('grandTotal');
  if(!el) return;
  if(!ts.length){ el.innerHTML='<div class="hint">まだ集計するものがありません</div>'; return; }
  el.innerHTML=`<table><tr><th scope="col">名前</th><th scope="col">対局</th><th scope="col">チップ</th><th scope="col">場代ほか</th><th scope="col">合計</th></tr>`+
    ts.map((t,idx)=>{
      const total=t.money+t.exp;
      return `<tr class="${idx===0?'rank1':''}"><td>${idx===0?CROWN:''}${esc(t.name)}</td>
        <td class="${cls(t.ptMoney)}">${yen(t.ptMoney)}</td>
        <td class="${cls(t.chipYen)}">${t.chips?yen(t.chipYen):'-'}</td>
        <td class="${cls(t.exp)}">${t.exp?yen(t.exp):'-'}</td>
        <td class="${cls(total)} bigmoney" style="font-size:15px;">${yen(total)}</td></tr>`;
    }).join('')+`</table>`;
}
/* ---------- 共有用の戦績画像(対局+チップ。場代・飲食は含めない) ---------- */
function cssVar(name, fallback){
  try{
    const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }catch(e){ return fallback; }
}
function buildResultCanvas(ts, day){
  const st=S.settings;
  const dpr=Math.min(window.devicePixelRatio||1, 3);
  const W=680, rowH=48, headH=124, footH=36;
  const rows=ts.length||1;
  const H=headH+rowH*rows+footH;
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  const ctx=canvas.getContext && canvas.getContext('2d');
  if(!ctx) return null; // 2D Canvasに未対応の環境(通常のブラウザでは発生しない)
  ctx.scale(dpr,dpr);

  const bg=cssVar('--card','#FFFFFF'), card2=cssVar('--card2','#F8F8FB'), txt=cssVar('--txt','#1A1A1C'),
    sub=cssVar('--sub','#595959'), line=cssVar('--line','#D8D8DB'), acc=cssVar('--acc','#0017C1'),
    goldBg=cssVar('--gold-bg','#FFF3CD'), green=cssVar('--green','#197A4B'), red=cssVar('--red','#CE0000');
  const FONT='"Noto Sans JP","Hiragino Sans",sans-serif';

  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ctx.fillStyle=txt; ctx.font=`700 24px ${FONT}`; ctx.textBaseline='alphabetic';
  ctx.fillText('麻雀戦績', 24, 38);
  // 見出しは精算タブで選択中の対象日に合わせる(「通算」なら全期間と明示する)
  const nGames = day ? sessionGames(day).length : S.games.length;
  const chipMeta = day ? peekChips(day) : S.settings;
  const chipPrice = day ? chipMeta.price : st.chipPrice;
  ctx.fillStyle=sub; ctx.font=`400 13px ${FONT}`;
  ctx.fillText(day ? sessionLabel(sessionById(day)) : '通算(全期間)', 24, 60);
  ctx.fillText(`点${st.rate} / ウマ${st.uma2}-${st.uma1} / チップ${chipPrice}円 / ${nGames}半荘`, 24, 80);

  ctx.strokeStyle=line; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(24, headH-14); ctx.lineTo(W-24, headH-14); ctx.stroke();

  const xName=24, xN=W-420, xPt=W-320, xChip=W-208, xTotal=W-24;
  ctx.fillStyle=sub; ctx.font=`700 12px ${FONT}`; ctx.textAlign='left';
  ctx.fillText('名前', xName, headH+4);
  ctx.textAlign='right';
  ctx.fillText('半荘', xN, headH+4);
  ctx.fillText('対局', xPt, headH+4);
  ctx.fillText('チップ', xChip, headH+4);
  ctx.fillText('合計', xTotal, headH+4);

  if(!ts.length){
    ctx.textAlign='center'; ctx.fillStyle=sub; ctx.font=`400 15px ${FONT}`;
    ctx.fillText('対局データがありません', W/2, headH+rowH/2+18);
  }
  ts.forEach((t,idx)=>{
    const y=headH+14+rowH*idx;
    if(idx===0){ ctx.fillStyle=goldBg; ctx.fillRect(16, y, W-32, rowH-8); }
    else if(idx%2===1){ ctx.fillStyle=card2; ctx.fillRect(16, y, W-32, rowH-8); }
    const baseY=y+26;
    ctx.textAlign='left'; ctx.fillStyle=txt; ctx.font=`${idx===0?'700':'600'} 16px ${FONT}`;
    ctx.fillText((idx===0?'\u{1F451} ':'')+t.name, xName+4, baseY);

    ctx.textAlign='right'; ctx.font=`400 14px ${FONT}`; ctx.fillStyle=sub;
    ctx.fillText(t.n+'', xN, baseY);

    ctx.fillStyle=t.ptMoney>0?green:(t.ptMoney<0?red:txt); ctx.font=`600 14px ${FONT}`;
    ctx.fillText(yen(t.ptMoney), xPt, baseY);

    ctx.fillStyle=t.chips?(t.chipYen>0?green:(t.chipYen<0?red:txt)):sub;
    ctx.fillText(t.chips?yen(t.chipYen):'-', xChip, baseY);

    ctx.fillStyle=t.money>0?green:(t.money<0?red:txt); ctx.font=`700 16px ${FONT}`;
    ctx.fillText(yen(t.money), xTotal, baseY);
  });

  ctx.textAlign='right'; ctx.fillStyle=sub; ctx.font=`400 11px ${FONT}`;
  ctx.fillText('マーログ', W-24, H-14);

  return canvas;
}
function renderShareCanvas(ts){
  const wrap=document.getElementById('shareCanvasWrap');
  const src=document.getElementById('shareCanvas');
  if(!src) return;
  try{
    const built=buildResultCanvas(ts, settleSid);
    if(!built){ if(wrap) wrap.style.display='none'; return; }
    const ctx=src.getContext('2d');
    src.width=built.width; src.height=built.height;
    src.style.width=(built.width/(Math.min(window.devicePixelRatio||1,3)))+'px';
    ctx.drawImage(built,0,0);
    if(wrap) wrap.style.display = 'block';
  }catch(e){ if(wrap) wrap.style.display='none'; }
  const btn=document.getElementById('shareBtn');
  if(btn) btn.disabled = !ts.length;
}
// 画像ファイルとして自動ダウンロード(共有・クリップボードのいずれも失敗/未対応の場合の最終フォールバック)
async function downloadResultImage(blobPromise){
  try{
    const blob = await blobPromise;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='mahjong_result.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('共有に対応していないため、画像を端末に保存しました','ok');
  }catch(e){
    toast('画像の保存に失敗しました','error');
  }
}
async function shareResult(){
  const ts=totals(settleSid);
  if(!ts.length){ toast('対局データがありません','error'); return; }
  const canvas=buildResultCanvas(ts, settleSid);
  if(!canvas){ toast('この端末では画像の生成に対応していません','error'); return; }

  // canvas.toBlob 自体は非同期(コールバック)だが、Promiseはユーザー操作(クリック)の
  // 直後にここで同期的に生成しておき、navigator.share / clipboard.write へは
  // このPromiseをそのまま渡す(await で一度解決してから渡すと、SafariやLINE内ブラウザで
  // 「ユーザー操作起因ではない」と判定されクリップボード書き込みが失敗することがあるため)。
  const blobPromise = new Promise((resolve, reject)=>{
    try{ canvas.toBlob(b=> b?resolve(b):reject(new Error('toBlob failed')), 'image/png'); }
    catch(e){ reject(e); }
  });

  // 1. まずファイル共有(Web Share API Level 2)を試みる
  if(navigator.share){
    try{
      const blob = await blobPromise;
      const file = new File([blob], 'mahjong_result.png', {type:'image/png'});
      if(!navigator.canShare || navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'麻雀戦績'});
        return;
      }
    }catch(e){
      if(e && e.name==='AbortError') return; // ユーザーが共有シートを自分でキャンセルした場合は何もしない
      // 共有に失敗した場合はエラーを握り潰さず、次のクリップボードへフォールバックする
    }
  }

  // 2. クリップボードへの画像コピー(Safari推奨の記法: 未解決のPromiseをそのままClipboardItemに
  //    渡すことで、clipboard.write の呼び出し自体をユーザー操作の直後・同期的に実行できる)
  if(navigator.clipboard && window.ClipboardItem){
    try{
      await navigator.clipboard.write([
        new window.ClipboardItem({'image/png': blobPromise})
      ]);
      toast('この端末は画像共有に対応していないため、画像をクリップボードにコピーしました','ok');
      return;
    }catch(e){
      // クリップボードへの書き込みも失敗した場合はエラーを握り潰さず、ダウンロードへフォールバックする
    }
  }

  // 3. どちらも失敗・未対応の場合は画像ファイルとして自動ダウンロード
  await downloadResultImage(blobPromise);
}
// データを丸ごと差し替えたとき(インポート・リセット)に、古いデータを指している UI 状態を捨てる。

/* ---------- 組み込みセルフテスト(?test=1 で実行。通常利用では動作しない) ---------- */
function runSelfTests(){
  const results=[];
  function assert(name, cond){ results.push({name, pass: !!cond}); }
  const snapshot = JSON.stringify(S);
  try{
    assert('round56: 600以上は繰り上げ', round56(35600)===36 && round56(35599)===35);
    assert('round56: 負数も同様に処理', round56(-2600)===-3 && round56(-2400)===-2);
    assert('calcPts: 同点でも合計0', calcPts([25000,25000,25000,25000]).pts.reduce((a,b)=>a+b,0)===0);

    S.settings.uma1=30; S.settings.uma2=10;
    const r1=calcPts([35000,30000,20000,15000]);
    assert('calcPts: 合計0(オカ・ウマ込み)', r1.pts.reduce((a,b)=>a+b,0)===0);
    assert('calcPts: 着順が点数降順', r1.ranks[0]===0 && r1.ranks[3]===3);

    // 五捨六入の適用位置の回帰テスト:
    // 「返し点との差」に五捨六入する。持ち点を先に丸めてから −30 する実装だと、
    // 30,000点未満で下3桁が500のときに 1pt ずれる(合計0のテストでは検出できない)。
    // 24,500点 = 返し点より 5,500点下 → 500は五捨(切り捨て) → −5pt。−6pt になったら実装ミス。
    const r2=calcPts([40500,24500,20000,15000]); // 2着=席1(24,500点)
    assert('五捨六入: 24,500点の2着は −5pt +ウマ10 = +5', r2.pts[1]===5);
    assert('五捨六入: 20,500点は −9pt(−10ptではない)', round56(20500-30000)===-9);
    assert('五捨六入: それでも合計は0', r2.pts.reduce((a,b)=>a+b,0)===0);

    // オカ(配給原点・返し点)§6-30
    assert('オカ: 既定は25000-30000で+20pt', okaOf({start:25000,ret:30000})===20);
    assert('オカ: 原点=返しならオカなし', okaOf({start:30000,ret:30000})===0);
    assert('オカ: 25000-27000なら+8pt', okaOf({start:25000,ret:27000})===8);
    assert('オカ: 点棒の総量は原点×4', totalScore({start:30000})===120000);
    // 返し点を変えると、その分だけ1着の取り分が増える
    const okaA=calcPts([40000,30000,20000,10000], {uma1:30,uma2:10,start:25000,ret:30000});
    const okaB=calcPts([40000,30000,20000,10000], {uma1:30,uma2:10,start:25000,ret:25000});
    /* ⚠️ 返し点を下げるとオカは減るが、同時にトップ自身の素点(持ち点−返し点)は増える。
       差は「オカの差」ではなく 3人分の返し点の差。ここを 20 と書くのは誤り。 */
    assert('オカ: トップの pt = (持ち点−返し点)/1000 + オカ + ウマ',
      okaA.pts[0]===(40000-30000)/1000 + okaOf({start:25000,ret:30000}) + 30 &&
      okaB.pts[0]===(40000-25000)/1000 + okaOf({start:25000,ret:25000}) + 30);
    assert('オカ: 返し点を変えても合計は0', okaB.pts.reduce((a,b)=>a+b,0)===0);
    assert('オカ: 2〜4着は返し点との差で決まる',
      okaB.pts[3]===round56(10000-25000)-30);
    // 30000持ち30000返し(オカなし)は、全員の pt 合計が0かつトップにオカが乗らない
    const noOka=calcPts([40000,30000,30000,20000], {uma1:30,uma2:10,start:30000,ret:30000});
    assert('オカ: オカなしならトップは素点+ウマだけ', noOka.pts[0]===10+30);
    // 古いデータに start/ret が無くても既定値で動くこと
    assert('オカ: 未設定なら既定値にフォールバック',
      startOf({})===25000 && retOf({})===30000 && okaOf({})===20);

    // 日付境界(AM5:00)の回帰テスト: 深夜0〜5時は前日扱い
    const base=new Date(2026,0,2,23,50).getTime();     // 1/2 23:50
    const late=new Date(2026,0,3,1,30).getTime();      // 1/3 01:30(同じ卓)
    assert('日付境界: 深夜1:30は前日キーになる', dstr(base)===dstr(late) && dstr(base)==='2026-01-02');
    assert('日付境界: 朝5:00からは当日キー', dstr(new Date(2026,0,3,5,0).getTime())==='2026-01-03');
    assert('日付境界: 時刻表示は25:30形式', tstr(late)==='25:30');

    // 同点時の順位(既定): 席インデックスが小さい側(上家・起家寄り)が上位になること
    const tie=calcPts([30000,25000,25000,20000]); // 席1と席2が同点
    assert('同点: 既定では上家(席番号が小さい側)が上位', tie.ranks[1]===1 && tie.ranks[2]===2);
    assert('同点: 上位の方がptも大きい', tie.pts[1]>tie.pts[2]);

    assert('同点: tieGroups が同点のかたまりを返す',
      JSON.stringify(tieGroups([30000,25000,25000,20000]))==='[[1,2]]' &&
      tieGroups([40000,30000,20000,10000]).length===0 &&
      JSON.stringify(tieGroups([25000,25000,25000,25000]))==='[[0,1,2,3]]');
    // order を渡すと、その並びで着順・ptが決まること(ユーザーが同点の優劣を選んだ場合)
    const tieB=calcPts([30000,25000,25000,20000], null, [0,2,1,3]); // 席2を2位に指定
    assert('同点: order を渡すと指定どおりの着順になる', tieB.ranks[2]===1 && tieB.ranks[1]===2);
    assert('同点: order を渡しても合計は0', tieB.pts.reduce((a,b)=>a+b,0)===0);
    assert('同点: 既定と order 指定で pt が入れ替わる',
      tieB.pts[2]===tie.pts[1] && tieB.pts[1]===tie.pts[2]);

    // ±の符号モード: 値を入れる前に押しても効き、あとから入力した数字がマイナスになること
    const curBak=JSON.stringify(cur);
    try{
      cur = resetCur([1,2,3,4]);
      toggleScoreSign(0);                       // 空欄のまま ± を押す
      assert('±: 空欄でも符号モードを反転できる', cur.signs[0]===-1);
      setScore(0,'50');                          // そのあと 50 を入力 → −5,000点
      assert('±: 先に押しておくと入力値がマイナスになる', cur.scores[0]===-5000);
      toggleScoreSign(0);                        // もう一度押すと戻る
      assert('±: もう一度押すと符号が戻る', cur.signs[0]===1 && cur.scores[0]===5000);
      setScore(1,'-30');                         // 欄に直接マイナスを入力
      assert('±: 直接マイナスを打つと符号モードも同期する', cur.signs[1]===-1 && cur.scores[1]===-3000);
      setScore(1,'');                            // 空にしても符号モードは保持(打ち直し用)
      assert('±: 空にしても符号モードは残る', cur.signs[1]===-1 && cur.scores[1]===null);
    } finally { cur = JSON.parse(curBak); }

    // 場代スコープ回帰テスト: 対局していない登録メンバーに費用が割り振られてはいけない
    S.players=[{id:1,name:'t1'},{id:2,name:'t2'},{id:3,name:'t3'},{id:4,name:'t4'},{id:5,name:'t5(未参加)'}];

    S.games=[{sid:900, t:Date.now(), seats:[1,2,3,4], scores:[25000,25000,25000,25000], pts:[0,0,0,0], ranks:[0,1,2,3], rate:5, tobi:[]}];
    const d=900;
    S.chips={}; S.expenses={}; S.expenses[d]={venue:1000, personal:{}, splitAll:false};
    const shares=venueShareMap(d);
    assert('場代: 割り振り合計が入力額と一致', Object.values(shares).reduce((a,b)=>a+b,0)===1000);
    assert('場代: 対局参加者4人だけに割り振られる', Object.keys(shares).length===4);
    assert('場代: 未参加メンバーには割り振られない', !('5' in shares));

    // 完全割り勘モード: 場代+飲食の総額を等分し、各人100円単位・合計は総額ちょうど
    S.expenses[d]={venue:6100, personal:{1:{food:800,drink:0}, 2:{food:0,drink:300}}, splitAll:true};
    const sp=venueShareMap(d);
    const spVals=Object.values(sp);
    assert('完全割り勘: 合計が総額(7,200円)と一致', spVals.reduce((a,b)=>a+b,0)===7200);
    assert('完全割り勘: 全員の負担が100円単位', spVals.every(v=>v%100===0));
    assert('完全割り勘: 飲食を二重計上しない', costOf(d,1,sp)===sp[1]);
    // 割り切れない端数は調整役ひとりだけが安くなる(7,300円 → 1900×3 + 1600)
    S.expenses[d]={venue:7300, personal:{}, splitAll:true};
    const sp2=venueShareMap(d), v2=Object.values(sp2);
    assert('完全割り勘: 端数は1人だけが安くなる',
      v2.reduce((a,b)=>a+b,0)===7300 && Math.max(...v2)-Math.min(...v2)===SPLIT_UNIT*3);
    // 端数の調整役は「その卓の対局成績が最下位」の人であること
    S.games=[{sid:900, t:Date.now(), seats:[1,2,3,4], scores:[40000,30000,20000,10000],
      pts:[52,0,-12,-40], ranks:[0,1,2,3], rate:5, uma1:30, uma2:10, tobi:[]}];
    assert('完全割り勘: 調整役は対局成績が最下位の人', splitAdjuster(900,[1,2,3,4])===4);
    const sp4=venueShareMap(d);
    assert('完全割り勘: 最下位の負担だけが軽い',
      sp4[4]<sp4[1] && sp4[1]===sp4[2] && sp4[2]===sp4[3] &&
      Object.values(sp4).reduce((a,b)=>a+b,0)===7300);
    // 総額が人数より小さくても負担がマイナスにならない
    const sp3=splitEvenly(100, [1,2,3,4], 4);
    assert('完全割り勘: 少額でも負担がマイナスにならない',
      Object.values(sp3).every(v=>v>=0) && Object.values(sp3).reduce((a,b)=>a+b,0)===100);

    // 読み取り専用パスが S.expenses を書き換えないことの回帰テスト
    S.expenses={};
    venueShareMap(999); personalOf(999,1); costOf(999,1,{});
    assert('expenses: 参照しただけでは空エントリを作らない', Object.keys(S.expenses).length===0);

    // normalize の補完テスト: rate/uma 欠損のデータで金額が NaN にならないこと
    const oldT=new Date(2020,0,1,20,0).getTime();
    const migrated=normalize({settings:{rate:5,uma1:30,uma2:10,chipPrice:500,chipStart:20},
      players:[{id:7,name:'x'}], groups:[], chips:{'2020-01-01':{7:23}}, expenses:{}, nextId:1,
      games:[{t:oldT, seats:[7,7,7,7], scores:[25000,25000,25000,25000], pts:[0,0,0,0], ranks:[0,1,2,3]}]});

    assert('normalize: uma 欠損を補完する', migrated.games[0].uma1===30 && migrated.games[0].uma2===10);
    // チップの最初期形式 {pid:最終枚数} → {price, counts:{pid:増減}} への移行

    // 中間形式 {price, start, counts:{pid:最終枚数}} → 増減
    const m2=normalize({settings:{rate:5,uma1:30,uma2:10,chipPrice:500}, players:[], groups:[],
      games:[], sessions:[], expenses:[]&&{}, nextId:1,
      chips:{'7':{price:300, start:20, counts:{1:25, 2:14}}}});
    assert('normalize: 中間形式(所持枚数・原点20)はそのまま',
      m2.chips['7'].counts[1]===25 && m2.chips['7'].counts[2]===14 && m2.chips['7'].start===undefined);
    // 「増減」だった一時期のデータ(v 印なし)は、原点を足し戻して所持枚数にする
    const m3=normalize({settings:{rate:5,uma1:30,uma2:10,chipPrice:500}, players:[], groups:[],
      games:[], sessions:[], expenses:{}, nextId:1,
      chips:{'8':{price:300, counts:{1:5, 2:-6}}}});   // v 印なし = 増減
    assert('normalize: v印が無いデータは増減とみなして原点を足す',
      m3.chips['8'].counts[1]===25 && m3.chips['8'].counts[2]===14 && m3.chips['8'].v===CHIP_FMT);
    // v 印があるものは二重に足さない
    const m4=normalize({settings:{rate:5,uma1:30,uma2:10,chipPrice:500}, players:[], groups:[],
      games:[], sessions:[], expenses:{}, nextId:1,
      chips:{'8':{price:300, counts:{1:25}, v:CHIP_FMT}}});
    assert('normalize: v印があれば二重に原点を足さない', m4.chips['8'].counts[1]===25);
    assert('normalize: 単価は卓の値を残す', m2.chips['7'].price===300);
    assert('normalize: 原点設定は捨てる', m2.settings.chipStart===undefined);

    // 日付キー → セッション(卓)への移行。同じ日の対局とチップが1つの卓にまとまること
    assert('移行: 日付キーから卓が1つ作られる', migrated.sessions.length===1);
    assert('移行: 対局とチップが同じ卓に割り当たる', msid===migrated.sessions[0].id);
    assert('移行: 過去の卓は確定済みになる', !!migrated.sessions[0].closedAt);
    assert('移行: 旧日付キーは残らない', migrated.chips['2020-01-01']===undefined);

    // 移行: 深夜をまたいだ2局(AM5時境界で同じ日)が1つの卓にまとまること
    const mn=normalize({settings:{rate:5,uma1:30,uma2:10,chipPrice:500,chipStart:20},

      mn.sessions.length===1 && mn.games[0].sid===mn.games[1].sid);

    // 卓のラベル: 同じ日に複数の卓があれば「第N卓」で区別する
    S.sessions=[{id:801,t:new Date(2026,5,1,13,0).getTime(),closedAt:1},
                {id:802,t:new Date(2026,5,1,19,0).getTime(),closedAt:null}];

      sessionLabel(sessionById(802))==='2026/06/01 第2卓');
    S.sessions=[{id:801,t:new Date(2026,5,1,13,0).getTime(),closedAt:1}];

    // 日付をまたいでも同じ卓(sid)なら集計が分かれないこと ← 今回の主目的
    S.players=[{id:1,name:'p1'},{id:2,name:'p2'},{id:3,name:'p3'},{id:4,name:'p4'}];
    const night=new Date(2026,4,8,23,50).getTime();   // 5/8 23:50
    const dawn =new Date(2026,4,9,6,10).getTime();    // 5/9 06:10(日付も AM5時境界も越える)
    const other=new Date(2026,4,15,20,0).getTime();

    S.sessions=[{id:901,t:night,closedAt:dawn},{id:902,t:other,closedAt:null}];

    const one=totals(901), all=totals();

    assert('卓: 別の卓は混ざらない', totals(902)[0].n===1);
    assert('totals(): 省略時は全期間を集計する', all[0].n===3 && all[0].ptMoney===7800);
    assert('totals(sid): 記録がない卓は空になる', totals(999).length===0);

    /* 卓の参加メンバー(プール)§6-31
       ⚠️ 後ろのテストが S を引き継いで使うので、必ず退避して最後に戻すこと。
          消しっぱなしにすると「無関係なテストが落ちる」原因になります。 */
    const poolSnap={players:S.players, sessions:S.sessions, games:S.games};

    S.sessions=[]; S.games=[]; pendingPool=null;

    // プールが空なら、その卓で実際に打った人から復元する(古いデータ対策)
    S.games=[{sid:ps.id, t:Date.now(), seats:[2,3,4,5], scores:[25000,25000,25000,25000],

    /* 5人卓: メンバーが入れ替わっても同じ卓のまま(§6-31)。

    S.players=[{id:1,name:'q1'},{id:2,name:'q2'},{id:3,name:'q3'},{id:4,name:'q4'},{id:5,name:'q5'}];

    S.expenses={950:{venue:5000, personal:{}, splitAll:false}};

    assert('5人卓: 場代の割り振り合計は入力額と一致',

    S.expenses={}; S.chips={};

    S.players=poolSnap.players; S.sessions=poolSnap.sessions; S.games=poolSnap.games; pendingPool=null;

    S.chips={901:{price:500, counts:{1:25}, v:CHIP_FMT}};   // counts は所持枚数(25枚)

    S.chips={};

    // 個人成績の月間・年間集計

    // 同点で選んだ着順が、設定変更の再計算で崩れないこと
    S.games=[{sid:921, t:Date.now(), seats:[1,2,3,4], scores:[30000,25000,25000,20000],
      pts:[0,0,0,0], ranks:[0,2,1,3], rate:5, uma1:30, uma2:10, tobi:[]}]; // 席2が2位(ユーザー選択)
    reapplySettingsToOpenGames();
    assert('設定反映: 同点で選んだ着順を保持する',
      S.games[0].ranks[2]===1 && S.games[0].ranks[1]===2);
    assert('設定反映: 保持した着順どおりの pt になる', S.games[0].pts[2]>S.games[0].pts[1]);

    // チップの符号モード(±)
    const csBak=JSON.stringify(chipSigns);
    try{
      chipSigns={};
      assert('チップ±: 既定はプラス', applyChipSign(1,'25')===25);
      chipSigns[1]=-1;
      assert('チップ±: 先に押すと入力値がマイナスになる', applyChipSign(1,'5')===-5);
      chipSigns={};
      assert('チップ±: 直接マイナスを打つと符号モードが同期する',
        applyChipSign(2,'-3')===-3 && chipSigns[2]===-1);
      assert('チップ±: 空は null', applyChipSign(1,'')===null);
    } finally { chipSigns=JSON.parse(csBak); }

    // 【回帰防止】チップを入力したら、その人の行に枚数が出ること(§6-26)
    //  表示を落としてしまい「入力しても反映されない」ように見えた事故がある
    S.players=[{id:1,name:'q1'},{id:2,name:'q2'},{id:3,name:'q3'},{id:4,name:'q4'}];
    S.sessions=[{id:930,t:Date.now(),closedAt:null}];
    S.games=[{sid:930, t:Date.now(), seats:[1,2,3,4], scores:[25000,25000,25000,25000],
      pts:[0,0,0,0], ranks:[0,1,2,3], rate:5, uma1:30, uma2:10, tobi:[]}];
    S.chips={930:{price:500, counts:{1:25, 2:18}, v:CHIP_FMT}}; S.expenses={}; // 所持枚数
    settleSid=930;
    renderChipSettle();
    const chipHtml=document.getElementById('chipSettle').innerHTML;
    assert('チップ表示: 所持枚数から求めた増減が行に出る',
      /\+5枚/.test(chipHtml) && /-2枚/.test(chipHtml));
    // ゼロサムのチェック: 全員そろうまでは警告を出さない
    assert('チップ検算: 入力途中は警告を出さない', !/0になるはず/.test(chipHtml));
    S.chips={930:{price:500, counts:{1:25, 2:18, 3:20, 4:20}, v:CHIP_FMT}}; // 増減合計 +3枚
    renderChipSettle();
    const badHtml=document.getElementById('chipSettle').innerHTML;
    assert('チップ検算: 全員そろって合計が0でなければ警告', /0になるはず/.test(badHtml) && /\+3枚/.test(badHtml));
    S.chips={930:{price:500, counts:{1:25, 2:18, 3:20, 4:17}, v:CHIP_FMT}}; // 増減合計 0
    renderChipSettle();
    assert('チップ検算: 合計0なら OK 表示',
      /増減の合計 0枚/.test(document.getElementById('chipSettle').innerHTML));
    S.chips={};

    // 半荘を編集したとき、当時のウマで再計算されること(現在の設定で上書きされない)
    // scores=[40000,30000,20000,10000] の4着(席3)は round56(-20000) = -20pt。
    //   当時のウマ(uma1:30) → -20 + (-30) = -50 / 現在のウマ(uma1:50) → -20 + (-50) = -70
    S.settings.uma1=50; S.settings.uma2=20; // 保存後に設定を変更
    const g0={sid:920, t:Date.now(), seats:[1,2,3,4], scores:[40000,30000,20000,10000],
      pts:[52,0,-12,-40], ranks:[0,1,2,3], rate:5, uma1:30, uma2:10, tobi:[]}; // uma1:30 / uma2:10 で保存済み
    assert('編集: 当時のウマで再計算される', calcPts(g0.scores, g0).pts[3]===-50);
    assert('編集: ウマを渡さないと現在の設定が使われる', calcPts(g0.scores).pts[3]===-70);
  } finally {
    S = JSON.parse(snapshot);
  }
  return results;
}
(function maybeRunSelfTests(){
  if(!/(?:^|[?&])test=1(?:&|$)/.test(location.search)) return;
  const r=runSelfTests();
  const pass=r.filter(x=>x.pass).length;
  const div=document.createElement('div');
  div.style.cssText='position:fixed; top:0; left:0; right:0; z-index:999; font-family:monospace; font-size:12px; '
    +'padding:6px 10px; color:#fff; background:'+(pass===r.length?'#197A4B':'#CE0000')+';';
  div.textContent = `SELF-TEST ${pass}/${r.length} passed`
    + (pass<r.length ? ' — FAILED: ' + r.filter(x=>!x.pass).map(x=>x.name).join(', ') : '');
  document.body.prepend(div);
  console.log('[self-test]', r);
  window.__selfTestResults = r;
})();

/* ---------- PWA(HTTPSでホストした場合のみ有効。file://直接実行時は何もしない)§6-32 ----------
   「単一HTMLファイル」の原則を守るため、manifest もアイコンも外部ファイルを作らない。

   ⚠️ manifest は **data: URL** で渡すこと。blob: URL は Safari が manifest として
      受け付けず、Chrome でも start_url の解決に失敗します(以前これで無効でした)。
   ⚠️ iOS の「ホーム画面に追加」は manifest を見ず、head の apple-touch-icon と
      apple-mobile-web-app-* メタだけを見ます。iPhone 対応の本体はそちら。
   ⚠️ Service Worker は登録しない。登録にはオリジンと同じ .js ファイルが必要で、
      blob: URL からは登録できません(かつて書いてあった登録コードは常に例外になり、
      何もしていませんでした)。完全オフラインが要るときは sw.js を別ファイルで置くこと。
      なお本アプリは外部リソースを一切読まないので、一度開けばブラウザキャッシュだけで
      オフラインでも起動します(保証はありません)。 */
(function setupPWA(){
  try{
    const iconEl=document.getElementById('pwaIcon');
    const icon=iconEl ? iconEl.getAttribute('href') : null;
    const manifest={
      name:'マーログ', short_name:'マーログ',
      // start_url はホストした場所に追従させる(GitHub Pages のサブパス等でも壊れないように)
      start_url: location.pathname + location.search,
      scope: location.pathname.replace(/[^/]*$/, ''),
      display:'standalone', orientation:'portrait',
      background_color:'#F1F1F4', theme_color:'#0017C1',
      lang:'ja',
      /* ⚠️ purpose:'maskable' を付けないこと。Android はマスク可能アイコンを
         中央80%の円に切り抜くため、横長のロゴが左右で欠けます。 */
      icons: icon ? [{src:icon, sizes:'384x384', type:'image/png', purpose:'any'}] : []
    };
    document.getElementById('pwaManifest').href =
      'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  }catch(e){}
})();
