}
function renderGroupMemPick(){
  document.getElementById('groupMemPick').innerHTML = S.players.map(p=>
    `<label><input type="checkbox" ${gpSel.has(p.id)?'checked':''} onchange="tgGp(${p.id},this.checked)">${esc(p.name)}</label>`).join('') ||
    '<span class="hint">先にメンバーを登録してください</span>';
}
function showGroupForm(editId){
  editingGroupId = editId || null;
  const g = editingGroupId ? S.groups.find(g=>g.id===editingGroupId) : null;
  document.getElementById('groupName').value = g ? g.name : '';
  gpSel.clear();
  if(g) g.members.forEach(id=>gpSel.add(id));
  renderGroupMemPick();
  document.getElementById('groupForm').style.display='block';
}
function hideGroupForm(){
  document.getElementById('groupForm').style.display='none';
  editingGroupId=null; gpSel.clear();
}
function saveGroup(){
  const el=document.getElementById('groupName');
  const name=el.value.trim().slice(0,10);
  if(!name){ toast('グループ名を入力してください','error'); return; }
  // ⚠️ 人数は npOf() から取ること。4 を直書きすると3人打ちでグループが作れません(§6-47)
  if(gpSel.size!==npOf()){ toast(`メンバーをちょうど${npOf()}人チェックしてください`,'error'); return; }
  if(S.groups.some(g=>g.name===name && g.id!==editingGroupId)){ toast('同名のグループがあります','error'); return; }
  if(editingGroupId){
    const g=S.groups.find(g=>g.id===editingGroupId);
    g.name=name; g.members=[...gpSel];
  }else{
    S.groups.push({id:S.nextId++, name, members:[...gpSel]});
  }
  save(); hideGroupForm(); renderGroupList();
}
async function delGroup(id){
  if(!(await confirmDialog('このグループを削除しますか?', {danger:true, okText:'削除'}))) return;
  const idx=S.groups.findIndex(g=>g.id===id);
  if(idx<0) return;
  const removed=S.groups[idx];
  S.groups=S.groups.filter(g=>g.id!==id);
  save(); hideGroupForm(); renderGroupList();
  toast(`「${removed.name}」を削除しました`, null, {label:'元に戻す', onClick:()=>{
    S.groups.splice(idx,0,removed);
    save(); renderGroupList();
  }});
}

/* ---------- グループ成績ページ ---------- */
function showGroupProfile(gid){
  document.getElementById('membersMain').style.display='none';
  document.getElementById('profileView').style.display='none';
  document.getElementById('groupProfileView').style.display='block';
  const g=S.groups.find(g=>g.id===gid);
  document.getElementById('groupProfileName').textContent = g?g.name:'';
  renderGroupProfile(gid);
}
function hideGroupProfile(){
  showMembersMain();
}
function computeGroupProfile(gid){
  const g=S.groups.find(g=>g.id===gid);
  if(!g) return null;
  const memberSet=new Set(g.members);
  const games=S.games.map((gm,gi)=>({gm,gi}))
    .filter(({gm})=> gm.seats.length===memberSet.size && new Set(gm.seats).size===gm.seats.length && gm.seats.every(id=>memberSet.has(id)));
  const stats={};
  g.members.forEach(pid=> stats[pid]={pid, name:pname(pid), n:0, top:0, rankSum:0, pt:0, ptMoney:0, tobi:0});
  games.forEach(({gm})=>{
    gm.seats.forEach((pid,i)=>{
      const s=stats[pid]; if(!s) return;
      s.n++; s.rankSum+=gm.ranks[i]+1; if(gm.ranks[i]===0) s.top++;
      s.pt+=gm.pts[i]; s.ptMoney+=Math.round(gm.pts[i]*gm.rate*10);
      if((gm.tobi||[]).some(t=>t.loser===i)) s.tobi++;
    });
  });
  const members=Object.values(stats).sort((a,b)=>b.ptMoney-a.ptMoney);
  const dates=[...new Set(games.map(({gm})=>dstr(gm.t)))].sort();
  return {group:g, n:games.length, members, games, dates};
}
function renderGroupProfile(gid){
  const p=computeGroupProfile(gid);
  const el=document.getElementById('groupProfileBody');
  if(!p || !p.n){
    el.innerHTML='<div class="card hint">まだこの顔ぶれで対局したデータがありません。</div>';
    return;
  }
  let html = `<div class="card">
    <h2>累積成績</h2>
    <div class="setgrid">
      <div><span class="setlabel">対局数</span><span class="setval">${p.n}局</span></div>
      <div><span class="setlabel">日数</span><span class="setval">${p.dates.length}日</span></div>
    </div>
  </div>
  <div class="card">
    <h2>メンバー別収支</h2>
    ${moneyBars(p.members.map(m=>({label:m.name, value:m.ptMoney})))}
    <table class="mt"><tr><th scope="col">名前</th><th scope="col">局</th><th scope="col">平均着順</th><th scope="col">トップ率</th><th scope="col">収支</th></tr>`+
    p.members.map((m,idx)=>`<tr class="${idx===0?'rank1':''}"><td>${idx===0?CROWN:''}${esc(m.name)}</td><td>${m.n}</td>
      <td>${m.n?(m.rankSum/m.n).toFixed(2):'-'}</td>
      <td>${m.n?Math.round(m.top/m.n*100):0}%</td>
      <td class="${cls(m.ptMoney)} bigmoney" style="font-size:14px;">${yen(m.ptMoney)}</td></tr>`).join('')+
    `</table>
  </div>`;
  el.innerHTML = html;
}

/* ---------- 対局入力 ---------- */
/* cur.signs: 席ごとの符号モード(+1 / -1)。
   モバイルの数字キーパッドにはマイナスキーが無い端末が多いため、±ボタンで切り替える。
   ⚠️ 値を入力する「前」に押せること。空欄でも符号モードだけ先に反転し、
      そのあと入力した数字が自動でマイナスになる(以前は値がないと±が効かなかった)。 */
let cur = resetCur();   // ⚠️ 旧形式(seats/scores の配列)に戻さないこと(§6-36)
/* ---------- 入力中の半荘(§6-36) ----------
   記録帳と同じ「上から下へ積み上がる表」にしたため、4席固定ではなく
   **プールの誰が何点か**で持つ。値が入っている人 = その半荘の参加者(=必ず4人)。
   ⚠️ seats/scores の配列に戻さないこと。5人以上の卓で「空席」の概念が破綻します。 */
function resetCur(){ return {vals:{}, signs:{}}; }
let justReset = false;
// 編集中の確定済み半荘への参照(null=新規入力)。配列インデックスではなくオブジェクト参照で保持することで、
// 編集中に他の半荘が削除・追加されて配列の並びがずれても、保存時に誤った半荘を上書きしないようにする。
let editingGame = null;
/* 直近でフォーカスした入力セルの pid。±(符号)ボタンの対象。
   ⚠️ blur でクリアしないこと。±を押した瞬間に blur が走るため、消すと対象を見失います。 */
let activeCell = null;
/* 「残り」で自動計算して埋めたセルの pid(§6-40)。
   他の人の点数を直したら、この人の値も追従して計算し直す。
   ⚠️ 本人が手で打ち直したらここを null にすること(以降は追従させない)。 */
let autoPid = null;
/* 自動セルを、他の3人の合計から計算し直す。
   ⚠️ 自分以外がちょうど3人埋まっているときだけ動かすこと。
      条件を緩めると、入力の途中で勝手に値が書き換わります。 */
function syncAutoCell(changedPid){
  if(autoPid===null || autoPid===changedPid) return;
  if(cur.vals[autoPid]===undefined){ autoPid=null; return; }
  const others=curSeats().filter(id=>id!==autoPid);
  if(others.length!==npOf()-1) return;
  const sum=others.reduce((a,id)=>a+cur.vals[id],0);
  cur.vals[autoPid]=totalScore()-sum;
  cur.signs[autoPid]= cur.vals[autoPid]<0 ? -1 : 1;
}

// 表の列(=その卓のメンバー)。編集中の半荘にプール外の人がいる場合は末尾に足す。
function sheetCols(){
  let pool=poolIds();
  if(!pool.length && S.players.length===npOf()){ setPool(S.players.map(p=>p.id)); pool=poolIds(); }
  const extra=Object.keys(cur.vals).map(Number).filter(id=>!pool.includes(id));
  const ids=[...pool, ...extra].filter(id=>S.players.some(p=>p.id===id));
  return ids;
}
// 入力済みの人(=この半荘の参加者)。表示順(列順)で返す。
// ⚠️ 列順がそのまま席順になり、同点時の既定(上家優先)の基準になります。
function curSeats(){ return sheetCols().filter(id=>cur.vals[id]!==undefined && cur.vals[id]!==null); }
function curScores(){ return curSeats().map(id=>cur.vals[id]); }
// 残り(あと1人のときに自動で入る点数)
function remainScore(){
  const sum=curSeats().reduce((a,id)=>a+cur.vals[id],0);
  return totalScore()-sum;
}
function signOf(pid){ return cur.signs[pid]===-1 ? -1 : 1; }

/* 入力値(百点単位)と符号モードを合成する。
   欄に直接マイナスを打った場合(PCなど)は、符号モードの方を入力に合わせて同期する。 */
function applySign(pid, v){
  /* 「-」だけ打たれた時点で符号モードをマイナスにしておく。
     PC やマイナスキーのあるキーボードでは、ボタンを使わず直接入力できる(§6-51) */
  if(v==='-' || v==='−'){ cur.signs[pid]=-1; return null; }
  if(v==='') return null;
  const n=+v;
  if(!isFinite(n)) return null;
  if(n<0) cur.signs[pid]=-1;   // 直接マイナスを打った → 符号モードを合わせる
  return Math.abs(n)*signOf(pid);
}
function setCell(pid,v){
  if(pid===autoPid) autoPid=null;   // 本人が打ち直した → 以降は追従させない
  const n=applySign(pid,v);
  if(n===null) delete cur.vals[pid]; else cur.vals[pid]=n*100;
  syncAutoCell(pid);
  refreshSheet();
}
/* フォーカスアウト時: ここで初めて百点単位の整数に丸める。
   ⚠️ ここで renderGame() を呼んではいけない。表を丸ごと作り直すと、
      「入力欄にフォーカスがある状態で ± や別のセルをタップ」したときに
      ① タップ → ② blur → ③ 表が差し替わってタップ先が DOM から消える
      ④ pointerup が別要素に着地して click が発火しない
      となり、1回目のタップが黙って無視されます(§6-3 と同じ罠)。 */
function finalizeCell(pid,v){
  const n=applySign(pid,v);
  if(n===null) delete cur.vals[pid]; else cur.vals[pid]=Math.round(n)*100;
  syncAutoCell(pid);
  refreshSheet();
}
/* セルにフォーカスが入ったとき。
   ちょうど3人分だけ埋まっていれば、残りの点数をそのセルに入れてしまう(タップ1回で済む)。 */
function focusCell(pid){
  activeCell=pid;
  if(cur.vals[pid]===undefined && curSeats().length===npOf()-1){
    cur.vals[pid]=remainScore();
    cur.signs[pid]= cur.vals[pid]<0 ? -1 : 1;
    autoPid=pid;                    // 以降、他を直したらここも追従する(§6-40)
  }
  refreshSheet(true);
}
/* ±ボタン: モバイルの数字キーパッドにはマイナスキーが無い端末が多く、飛び(マイナス点)を
   入力できないため、タップで符号を切り替える。⚠️ ボタンは各入力セルの中に置くこと(§6-37)。
   ⚠️ 値が入っていなくても押せること。空欄のまま押すと「次に入力する数字をマイナスにする」
      モードになります。 */
function setCellSign(pid, v){
  pid=+pid; if(!pid) return;
  activeCell=pid;
  cur.signs[pid] = (+v===-1) ? -1 : 1;
  const val=cur.vals[pid];
  if(val!==undefined && val!==null && val!==0) cur.vals[pid]=Math.abs(val)*signOf(pid);
  if(pid===autoPid) autoPid=null;   // 符号を手で変えた → 追従をやめる
  syncAutoCell(pid);
  refreshSheet(true);
}
// 旧API(テスト・キーボード操作用)。押すたびに符号が入れ替わる
function toggleCellSign(pid){ setCellSign(pid, signOf(pid)===-1 ? 1 : -1); }

/* 表全体を組み立て直す。列(メンバー)が変わったときだけ呼ぶこと。
   点数の入力中は refreshSheet() で中身だけ更新する。 */
function renderGame(){
  const box=document.getElementById('scoreSheet');
  const gq=document.getElementById('groupQuick');
  const titleEl=document.getElementById('gameCardTitle');
  const cancelEditBtn=document.getElementById('editActions');
  const poolBar=document.querySelector('.poolbar');
  if(S.players.length<npOf()){
    titleEl.textContent='メンバー選択';
    if(poolBar) poolBar.style.display='none';
    if(cancelEditBtn) cancelEditBtn.style.display='none';
    gq.innerHTML = `<div class="warn">メンバータブで${npOf()}人以上登録してください。</div>`;
    box.innerHTML=''; document.getElementById('sumMsg').innerHTML='';
    const saveBtn=document.getElementById('saveGameBtn'); if(saveBtn) saveBtn.disabled=true;
    return;
  }
  if(poolBar) poolBar.style.display='';
  justReset=false;
  const cols=sheetCols();
  const sess=openSession();
  // この卓の確定済みの半荘(古い順)。gi は S.games 上の位置(編集で使う)
  const rows = sess ? S.games.map((g,gi)=>({g,gi})).filter(x=>x.g.sid===sess.id) : [];

  titleEl.textContent = editingGame!==null ? '半荘を編集中' : '記録';
  if(cancelEditBtn) cancelEditBtn.style.display = editingGame!==null ? '' : 'none';
  const saveBtnLabel=document.getElementById('saveGameBtn');
  if(saveBtnLabel) saveBtnLabel.textContent = editingGame!==null ? '変更を保存' : '確定';

  gq.innerHTML = (!rows.length && S.groups.length)
    ? `<label>グループから選択</label><div class="presets">`+
      S.groups.map(g=>`<button onclick="selectGroup(${g.id})">${esc(g.name)}</button>`).join('')+`</div>`
    : '';

  // 合計(確定済みのみ)。⚠️ 打っていない半荘は 0 として数える(§6-37)
  const tot={}; cols.forEach(id=>tot[id]=0);
  rows.forEach(({g})=> g.seats.forEach((pid,i)=>{ if(tot[pid]!==undefined) tot[pid]+=g.pts[i]; }));

  let h='<div class="tblwrap"><table class="sheet"><tr><th scope="col" class="nocol">局</th>'
    + cols.map(id=>`<th scope="col">${esc(pname(id))}</th>`).join('') + '</tr>';
  /* 確定済みの行。⚠️ セルそのものをボタンにして、どこを押しても編集に入れること(§6-37)。
     上段=pt(ウマ・オカ込み) / 下段=入力した素点(百点単位)をグレーで添える。 */
  rows.forEach(({g,gi},n)=>{
    const editing = editingGame===g;
    h += `<tr class="done${editing?' editing':''}"><th scope="row" class="nocol">${n+1}</th>`;
    cols.forEach(id=>{
      const i=g.seats.indexOf(id);
      const pt = i<0 ? 0 : g.pts[i];
      h += `<td class="${i<0?'out':cls(pt)}"><button type="button" class="cellbtn"
        aria-label="${n+1}局目を編集" onclick="editGame(${gi})">${i<0?'0':fmt(pt)}</button></td>`;
    });
    h += '</tr>';
  });
  /* 入力行。⚠️ type="text" + inputmode="numeric" にすること。
     type="number" だとブラウザのスピナー(上下ボタン)が出てしまいます(§6-37)。
     ± は各セルの中に置く(どの人の符号か迷わないため)。 */
  /* 入力行(§6-49)。1行の中に縦に積む:
       局の列 … 局数 + その下に確定ボタン
       各セル … [+][−] の2カラム + その下に点数(幅を広く取る)
     ⚠️ 確定ボタンを表の外や別の行に出さないこと。「どの局を確定するのか」が分からなくなります。
     ⚠️ 符号は**2つのボタン**。1つのトグルに戻さないこと(今どちらかが見て分かりません)。 */
  h += `<tr class="inrow"><th scope="row" class="nocol">
      <span class="inno">${editingGame!==null?'編':rows.length+1}</span>
      <button class="btn main okbtn" id="saveGameBtn" onclick="saveGame()" disabled>確定</button>
    </th>`
    + cols.map(id=>`<td>
        <button type="button" class="cellsign" data-sign="${id}"
          aria-label="${esc(pname(id))} の符号を切り替え" aria-pressed="false"
          onclick="toggleCellSign(${id})">+</button>
        <div class="inwrap">
          <input type="text" inputmode="numeric" data-pid="${id}"
            aria-label="${esc(pname(id))} の持ち点(下2桁を省略)"
            onfocus="focusCell(${id})" oninput="setCell(${id}, this.value)"
            onkeydown="if(event.key==='Enter'){event.preventDefault(); this.blur();}"
            onblur="finalizeCell(${id}, this.value)">
          <span class="unit00" aria-hidden="true">00</span>
        </div>
      </td>`).join('')
    + '</tr>';
  h += '<tr class="sumrow"><th scope="row" class="nocol">計</th>'
    + cols.map(id=>`<td class="${cls(tot[id])}">${tot[id]?fmt(tot[id]):'0'}</td>`).join('')
    + '</tr></table></div>';
  box.innerHTML=h;
  refreshSheet(true);
}

/* 入力行の値・±の状態・メッセージだけを更新する(DOMノードは作り直さない)。
   force=true のときはフォーカス中の欄にも値を書き戻す(±による符号反転など)。 */
function refreshSheet(force){
  const box=document.getElementById('scoreSheet');
  if(!box) return;
  const seats=curSeats();
  const rem = seats.length===npOf()-1 ? remainScore() : null;
  box.querySelectorAll('.inrow input').forEach(inp=>{
    const pid=+inp.dataset.pid;
    const v = (cur.vals[pid]===undefined || cur.vals[pid]===null) ? '' : String(cur.vals[pid]/100);
    if((force || document.activeElement!==inp) && inp.value!==v) inp.value=v;
    inp.classList.toggle('minus', signOf(pid)===-1);
    // 枠は親(.inwrap)側に付けたので、入力済みの強調も親に当てる(§6-50)
    if(inp.parentElement) inp.parentElement.classList.toggle('on', v!=='');
    inp.placeholder = (v==='' && rem!==null) ? String(rem/100) : '';
  });
  /* ⚠️ 符号ボタンは「いま入る符号」を表示する(§6-51)。
     プラス = 「+」/枠内は白、マイナス = 「−」/枠内は赤。タップで入れ替わる。
     「+/−」のような両方表記には戻さないこと(いまどちらか分からなくなります)。 */
  box.querySelectorAll('.cellsign').forEach(b=>{
    const pid=+b.dataset.sign, minus=signOf(pid)===-1;
    b.textContent = minus ? '−' : '+';
    b.classList.toggle('on', minus);
    b.setAttribute('aria-pressed', minus?'true':'false');
  });
  renderSumMsg();
}

/* ⚠️ かつて「メンバー変更」ボタンで席を全部空にしていたが廃止した(§6-31)。
   メンバーは表の列(プール)で管理する。 */
function selectGroup(gid){
  const g=S.groups.find(g=>g.id===gid);
  if(!g) return;
  const valid=g.members.filter(id=>S.players.some(p=>p.id===id));
  if(valid.length<npOf()) toast('このグループのメンバーが不足しています(削除されたメンバーがいる可能性があります)','error');
  addToPool(valid);
  cur = resetCur();
  renderGame();
}

/* この卓のメンバーを決めるダイアログ(§6-31)。
   参加メンバーは画面に常時出さず、ここでだけ確認・変更する。
   ⚠️ すべてのダイアログは共通の DOM を使うので、必ず resetModal() から始めること。
   ⚠️ その卓で既に打っている人は外せない(ボタンを disabled にする)。
      外すと履歴と参加者一覧が食い違い、場代の割り振りも合わなくなります。 */
function openPoolPicker(){
  const pool=poolIds();
  resetModal();
  document.getElementById('modalMsg').textContent='この卓のメンバー';
  if(!S.players.length){
    document.getElementById('modalBody').innerHTML='<div class="hint">メンバータブで登録してください。</div>';
    document.getElementById('modalCancel').style.display='none';
    const ok=document.getElementById('modalOk');
    ok.textContent='閉じる';
    ok.onclick=()=>closeModal();
    openModal();
    return;
  }
  const s=openSession();
  const locked=s ? seatsUsedIn(s.id) : [];
  const picked=new Set(pool);
  document.getElementById('modalBody').innerHTML =
    `<div class="presets" id="poolPick">`+
    S.players.map(p=>{
      const on=picked.has(p.id), lock=locked.includes(p.id);
      return `<button type="button" data-id="${p.id}" class="${on?'sel':''}" aria-pressed="${on}"
        ${lock?'disabled title="この卓で既に対局しているため外せません"':''}>${esc(p.name)}</button>`;
    }).join('')+
    `</div><div class="hint mt">多めに入れても同じ卓のまま。半荘ごとに、表の入力行で${npOf()}人分だけ点数を入れます。</div>`;
  const okBtn=document.getElementById('modalOk');
  const cancelBtn=document.getElementById('modalCancel');
  okBtn.textContent='決定';
  document.getElementById('poolPick').addEventListener('click', e=>{
    const b=e.target.closest('button[data-id]'); if(!b || b.disabled) return;
    const id=+b.dataset.id;
    if(picked.has(id)) picked.delete(id); else picked.add(id);
    b.classList.toggle('sel', picked.has(id));
    b.setAttribute('aria-pressed', picked.has(id));
  });
  okBtn.onclick=()=>{
    setPool([...picked]);
    // 外れた人の入力値は捨てる(列が消えるため)
    const now=poolIds();
    Object.keys(cur.vals).map(Number).forEach(id=>{
      if(!now.includes(id)){ delete cur.vals[id]; delete cur.signs[id]; }
    });
    closeModal(); renderGame();
  };
  cancelBtn.onclick=()=>closeModal();
  openModal();
}
function renderSumMsg(){
  const el=document.getElementById('sumMsg');
  const btn=document.getElementById('saveGameBtn');
  const seats=curSeats(), np=npOf();
  // ⚠️ 入力の途中は何も出さないこと(「あと◯人」は邪魔なので廃止・§6-39)
  if(seats.length<np){
    el.innerHTML='';
    if(btn) btn.disabled=true;
    return;
  }
  if(seats.length>np){
    el.innerHTML=`<div class="warn">${seats.length}人分入っています(${np}人になるよう消してください)</div>`;
    if(btn) btn.disabled=true;
    return;
  }
  const need=totalScore();   // 配給原点×4人。オカ設定で変わる(§6-30)
  const sum=curScores().reduce((a,b)=>a+b,0);
  const valid = sum===need;
  el.innerHTML = valid ? `<div class="ok">✓ 合計 ${need.toLocaleString()}点</div>`
    : `<div class="warn">合計が ${sum.toLocaleString()}点 です(${need.toLocaleString()}点になるよう確認)</div>`;
  // 4人ちょうど・合計が配給原点×4の場合のみ確定ボタンを有効化(誤操作・計算ミスの防止)
  if(btn) btn.disabled = !valid;
}

/* 同点があれば、どちらを上位にするかをユーザーに選ばせて着順(idx[rank]=seat)を返す。
   同点がなければ undefined(= calcPts の既定ルールに任せる)。キャンセルされたら null。
   ⚠️ 戻り値の null と undefined は意味が違う。null は「保存をやめる」合図。
   3人以上の同点では、上位から1人ずつ順に選ばせる。 */
async function resolveTieOrder(scores, seatIds){
  const groups=tieGroups(scores);
  if(!groups.length) return undefined;
  const order=defaultRankOrder(scores);
  for(const group of groups){
    // この同点グループが占める順位帯(order 上の位置)
    const slots=order.map((seat,r)=>group.includes(seat)?r:-1).filter(r=>r>=0);
    let rest=[...group].sort((a,b)=>a-b); // 既定は席順(上家が先)
    const decided=[];
    const pts=scores[group[0]].toLocaleString();
    while(rest.length>1){
      // 聞き方はできるだけ短く。2人なら「どちらが上位?」だけで足りる。
      // 3人以上同点のときだけ、何位を決めているのかを添える。
      const nth=slots[decided.length]+1;
      const msg = rest.length===2 && group.length===2
        ? `${pname(seatIds[rest[0]])} と ${pname(seatIds[rest[1]])} が ${pts}点で同点です。\nどちらが上位ですか?`
        : `${pts}点で ${group.length}人が同点です。\n${nth}位はどなたですか?`;
      const pick=await chooseDialog(msg, rest.map(seat=>({label:pname(seatIds[seat]), value:seat})));
      if(pick===null) return null; // キャンセル → 保存しない
      decided.push(pick);
      rest=rest.filter(s=>s!==pick);
    }
    decided.push(rest[0]);
    slots.forEach((r,k)=>{ order[r]=decided[k]; });
  }
  return order;
}
/* ⚠️ saveGame は同点ダイアログを待つため async。
   await をまたぐ間も確定ボタンは押せてしまうので、連打による二重保存をこのフラグで防ぐ。
   同期関数だった頃には不要だった対策なので、同期に戻さない限り外さないこと。 */
let saving = false;
async function saveGame(){
  if(saving) return;
  saving = true;
  try{ await saveGameInner(); } finally { saving = false; }
}
async function saveGameInner(){
  /* 参加者は「表に点数が入っている人」。列順がそのまま席順になる(§6-36)。 */
  const seatIds=curSeats(), np=npOf();
  if(seatIds.length!==np){ toast(`${np}人分の点数を入力してください`,'error'); return; }
  const sc=curScores();
  const need=totalScore();
  if(sc.reduce((a,b)=>a+b,0)!==need){ toast(`合計が${need.toLocaleString()}点になっていません`,'error'); return; }
  const tobi=[]; sc.forEach((s,i)=>{ if(s<0) tobi.push({loser:i}); });

  // 同点があれば、どちらを上位にするかをここで決める(キャンセルされたら保存しない)
  const order = await resolveTieOrder(sc, seatIds);
  if(order===null) return;

  if(editingGame!==null){
    // 確定済みの半荘を編集中: 配列インデックスではなくオブジェクト参照で現在位置を再検索することで、
    // 編集中に他の半荘が削除・追加されて配列がずれていても正しい半荘を上書きする。
    // 条件(レート・ウマ)は settingsFor() が決める:
    //   進行中の卓 → 現在の設定 / 集計済みの卓 → その対局に保存されている当時の値
    // ⚠️ `calcPts(sc, order)` のように引数を飛ばさないこと。
    //    第2引数を省くと常に現在の設定になり、集計済みの卓まで動いてしまいます。
    const idx=S.games.indexOf(editingGame);
    if(idx<0){ editingGame=null; toast('編集対象の半荘が見つかりませんでした(削除された可能性があります)','error'); renderGame(); return; }
    const cond=settingsFor(editingGame);
    const e=calcPts(sc, cond, order);
    S.games[idx] = {...editingGame, seats:[...seatIds], scores:sc, pts:e.pts, ranks:e.ranks, tobi,
      rate:cond.rate, uma1:cond.uma1, uma2:cond.uma2, start:startOf(cond), ret:retOf(cond), np:seatIds.length};
    editingGame=null;
    save();
    /* ⚠️ 入力行は空に戻すが、メンバーは表の列(プール)として残るので消えない。
       旧UIではここで席まで空にしていたため「編集して保存したらメンバー名が消えた」
       という不具合になっていた(§6-36)。 */
    cur = resetCur(); activeCell=null; autoPid=null;
    renderGame();
    toast('半荘の結果を更新しました', 'ok');
    return;
  }

  // 新規保存: レート・ウマは「保存した時点の設定」を対局ごとに固定する。
  // あとで設定を変えても過去の対局の金額・ポイントは動かない。
  // sid は進行中の卓。無ければここで新しい卓が始まる(日付では分けない)。
  const now=Date.now();
  const n=calcPts(sc, null, order);
  const sess=ensureSession();
  // 打った4人は必ず参加メンバーに含める(席の select から直接選ばれた場合の取りこぼし防止・§6-31)
  sess.pool=[...new Set([...(Array.isArray(sess.pool)?sess.pool:[]), ...seatIds])].filter(Boolean);
  const saved={sid:sess.id, t:now, seats:[...seatIds], scores:sc, pts:n.pts, ranks:n.ranks,
    tobi, rate:S.settings.rate, uma1:S.settings.uma1, uma2:S.settings.uma2,
    start:startOf(), ret:retOf(), np};
  S.games.push(saved);
  settleSid=sess.id;
  save();
  cur = resetCur(); activeCell=null; autoPid=null;
  renderGame();
  // 確定した半荘の結果をその場で見せる(その卓で何局目かを添える)
  await showGameResult(saved, sessionGames(sess.id).length);
}
// 履歴から確定済みの半荘を呼び出し、対局タブの入力欄に読み込んで編集できるようにする
function editGame(gi){
  const g=S.games[gi];
  if(!g) return;
  editingGame = g;
  cur = resetCur();
  // 表の入力行へ読み込む。マイナスの点数は符号モードも合わせる
  g.seats.forEach((pid,i)=>{ cur.vals[pid]=g.scores[i]; cur.signs[pid]= g.scores[i]<0 ? -1 : 1; });
  activeCell=null; autoPid=null;
  showTab('game');
  toast('半荘を編集中です。保存すると内容が上書きされます');
}
function cancelEditGame(){
  editingGame = null;
  cur = resetCur(); activeCell=null; autoPid=null;
  renderGame();
}

/* 1半荘のリザルト表。履歴のアコーディオンと、確定直後のモーダルの両方で使う。
   ⚠️ 片方だけ書き換えると表示がずれるので、必ずこの関数を直すこと。 */
/* 1半荘のリザルト表。⚠️ 収支(円)は出さないこと(§6-38)。
   その場で知りたいのは順位と pt で、金額は精算タブの仕事です。 */
function gameResultTable(g){
  const order=g.seats.map((_,i)=>i).sort((a,b)=>g.ranks[a]-g.ranks[b]);
  const rows=order.map(i=>{
    const tobi=(g.tobi||[]).some(t=>t.loser===i) ? '<span class="badge">トビ</span>' : '';
    const top=g.ranks[i]===0;
    /* ⚠️ ここで CROWN を使わないこと。CROWN には読み上げ用の「1位」が入っており、
       隣の「1位」と二重に読まれます。 */
    return `<tr class="${top?'rank1':''}"><td>${g.ranks[i]+1}位${tobi}</td><td>${esc(pname(g.seats[i]))}</td>
      <td>${g.scores[i].toLocaleString()}</td><td class="${cls(g.pts[i])}">${fmt(g.pts[i])}</td></tr>`;
  }).join('');
  return `<table><tr><th scope="col">順位</th><th scope="col">名前</th><th scope="col">点数</th><th scope="col">pt</th></tr>${rows}</table>`;
}
/* 半荘を確定した直後のリザルト。
   「確定」で閉じ、「修正」を押すとその半荘をそのまま編集に戻す(§6-38)。
   ⚠️ すべてのダイアログは共通の DOM を使うので、必ず resetModal() から始めること。 */
function showGameResult(g, nth){
  return new Promise(resolve=>{
    resetModal();
    document.getElementById('modalMsg').textContent = `${nth}局目の結果`;
    document.getElementById('modalBody').innerHTML = gameResultTable(g)
      + `<div class="center mt"><button type="button" class="btn small" id="resultFixBtn">修正する</button></div>`;
    const okBtn=document.getElementById('modalOk');
    const cancelBtn=document.getElementById('modalCancel');
    cancelBtn.style.display='none';
    okBtn.textContent='確定';
    openModal();
    function cleanup(fix){
      okBtn.onclick=null;
      document.removeEventListener('keydown', onKey);
      closeModal();
      if(fix){
        const gi=S.games.indexOf(g);
        if(gi>=0) editGame(gi);
      }
      resolve();
    }
    function onKey(e){ if(e.key==='Escape') cleanup(false); }
    okBtn.onclick=()=>cleanup(false);
    const fixBtn=document.getElementById('resultFixBtn');
    if(fixBtn) fixBtn.onclick=()=>cleanup(true);
    document.addEventListener('keydown', onKey);
    setTimeout(()=>okBtn.focus(), 0);
  });
}

/* ---------- 半荘の削除 ----------
   ⚠️ 履歴カードは廃止した(§6-37)。半荘を消す導線は「編集中の削除ボタン」だけ。 */
async function delEditingGame(){
  const g=editingGame;
  if(!g){ toast('編集中の半荘がありません','error'); return; }
  const gi=S.games.indexOf(g);
  if(gi<0){ editingGame=null; renderGame(); return; }
  editingGame=null;
  await delGame(gi);
  cur=resetCur(); activeCell=null; autoPid=null;
  renderGame(); renderTotal();
}
async function delGame(gi){
  if(!(await confirmDialog('この半荘を削除しますか?', {danger:true, okText:'削除'}))) return;
  const removed=S.games[gi];
  S.games.splice(gi,1); save(); renderGame();
  toast('半荘を削除しました', null, {label:'元に戻す', onClick:()=>{
    S.games.splice(gi,0,removed); save(); renderGame();
  }});
}

/* ---------- 場代・飲食(日付キーで管理し、その日の実参加者のみに割り振る) ---------- */
// 読み取り専用。S.expenses を書き換えないこと(画面を開いただけで空の日付エントリが
// 生まれて保存され、S.expenses が使っていない日で膨らむのを防ぐため)。
const EMPTY_EXPENSE = Object.freeze({venue:0});
function peekExpenses(sid){ return S.expenses[sid] || EMPTY_EXPENSE; }
// 書き込み用。setVenue からのみ呼ぶこと。
function expensesOf(sid){
  if(!S.expenses[sid]) S.expenses[sid]={venue:0};
  return S.expenses[sid];
}
// 入力が全部ゼロに戻された卓のエントリは削除する(既存の空エントリの掃除も兼ねる)
function pruneExpenses(sid){
  const ex=S.expenses[sid];
  if(ex && !(ex.venue||0)) delete S.expenses[sid];
}

/* 金額を人数で等分する。
   1人あたりを SPLIT_UNIT(100円)単位に切り上げた額(base)を他の人の負担とし、
   調整役(adjustPid)が残りを引き受ける。
     例) 7,300円を4人 → base=1,900円 / 調整役=7,300−1,900×3=1,600円
   → 調整役以外は必ず100円単位。合計は必ず total ちょうどになる。
   調整役は負担が軽くなるので、**その卓の対局成績が最下位の人**を充てる(呼び出し側で決める)。
   ⚠️ total が100円単位でない場合(飲食の実費など)、端数は調整役の額に寄る。
      全員を100円単位にしつつ合計を total に一致させることは原理的に不可能なため。
   ⚠️ 総額が少なすぎて調整役がマイナスになる場合は base を下げる(負担を負の値にしない)。 */
const SPLIT_UNIT = 100;
function splitEvenly(total, pids, adjustPid){
  const out={};
  const n=pids.length;
  if(!n) return out;
  if(total<=0){ pids.forEach(id=>out[id]=0); return out; }
  const adj = pids.includes(adjustPid) ? adjustPid : pids[0];
  let base=Math.ceil(total/n/SPLIT_UNIT)*SPLIT_UNIT;
  while(base>0 && total-base*(n-1) < 0) base-=SPLIT_UNIT;
  pids.forEach(id=>out[id]=base);
  out[adj] = total - base*(n-1);
  return out;
}
/* 端数の調整役 = その卓で対局収支が最下位の人。
   同額なら席順(pids の並び)が後の人。対局がまだ無い卓は先頭の人。
   ⚠️ 対局の pt だけで判断すること。チップや場代を混ぜると循環参照になります
      (場代の割り振りを決めるのに場代込みの収支が要る、という堂々巡り)。 */
function splitAdjuster(sid, pids){
  if(!pids.length) return null;
  const money={};
  pids.forEach(id=>money[id]=0);
  sessionGames(sid).forEach(g=>g.seats.forEach((pid,i)=>{
    if(money[pid]!==undefined) money[pid]+=Math.round(g.pts[i]*g.rate*10);
  }));
  return pids.reduce((lo,id)=> money[id] <= money[lo] ? id : lo, pids[0]);
}
/* その卓の場代の総額。⚠️ 飲食・その他の個別入力は廃止した(§6-36)。
   古いデータは normalize で venue に合算済みなので、ここは venue だけを見ること。 */
function venueTotal(sid){ return peekExpenses(sid).venue||0; }
/* {pid: 負担額}。**完全割り勘のみ**。
   誰が何を頼んだかは問わず、総額を参加者で等分する。 */
function venueShareMap(sid){
  const pids=dayParticipants(sid);
  if(!pids.length) return {};
  const v=venueTotal(sid);
  if(!v) return {};
  return splitEvenly(v, pids, splitAdjuster(sid, pids));
}
// 1人あたりの負担。割り勘しかないので shares をそのまま返す
function costOf(sid,pid, shares){ return (shares[pid]||0); }
function setVenue(d,v){
  expensesOf(d).venue = Math.round(+v)||0;
  pruneExpenses(d);
  save(); renderTotal();
}
/* 場代カード。対局の精算とは**完全に別建て**にする(§6-36)。
   ⚠️ ここに飲食の個別入力を戻さないこと。割り勘だけにすると決めた画面です。 */
/* 場代の入力を確定する(§6-43)。
   ⚠️ onchange とは別にこの経路が要る。入力欄を触ったまま確定を押しても
      値が拾えるよう、ここでも欄の現在値を読むこと。 */
function commitVenue(d){
  const inp=document.getElementById('venueInput');
  setVenue(d, inp ? inp.value : '');
  toast('場代を確定しました','ok');
}
function renderExpenses(){
  const el=document.getElementById('venueArea');
  if(!el) return;
  const d=settleSid;
  if(!d){ el.innerHTML='<div class="hint">卓を選ぶと入力できます</div>'; return; }
  const pids=dayParticipants(d);
  const v=venueTotal(d);
  /* ⚠️ ラベルは置かない(カード見出しの「場代」で足りる・§6-43)。
     ⚠️ ただし見える<label>が無いぶん aria-label は必須。消すと無名の入力欄になります。
     ⚠️ 入力欄の横に確定ボタンを置くこと。onchange だけだと
        「打ったのに反映されたか分からない」という迷いが残ります。 */
  const head=`<div class="venuerow">
      <input type="text" id="venueInput" inputmode="numeric" placeholder="例:6000"
        aria-label="場代の総額(円)"
        value="${v||''}" onchange="setVenue('${d}', this.value)">
      <button type="button" class="btn small main" onclick="commitVenue('${d}')">確定</button>
    </div>`;
  if(!pids.length){ el.innerHTML=head+'<div class="hint mt">参加者が未確定です</div>'; return; }
  if(!v){ el.innerHTML=head; return; }
  const shares=venueShareMap(d);
  el.innerHTML = head +
    `<table class="mt"><tr><th scope="col">名前</th><th scope="col">1人あたり</th></tr>`+
    pids.map(pid=>`<tr><td>${esc(pname(pid))}</td>
      <td class="bigmoney">${(shares[pid]||0).toLocaleString()}円</td></tr>`).join('')+
    `<tr><th scope="row">総額</th><td><b>${v.toLocaleString()}円</b></td></tr></table>
     <div class="hint">端数は最下位の ${esc(pname(splitAdjuster(d,pids)))} が調整</div>`;
}

/* ---------- セッション(卓) ----------
   集計の単位。日付が変わっても勝手に分かれず、「集計」(closeSession)を押すまで
   同じ卓に半荘が積み上がる。確定後に次の半荘を入れると、自動で新しい卓が始まる。
   ⚠️ 集計・グルーピングは必ず g.sid を基準にすること。dstr(g.t) で分けてはいけない。
      dstr / tstr は「表示用のラベル」としてのみ使う。 */
function openSession(){ return S.sessions.find(s=>!s.closedAt) || null; }
/* ---------- 卓の参加メンバー(プール)§6-31 ----------
   5人以上で卓を囲むことを想定し、「その卓に居る人」を sessions[].pool に持つ。
   半荘ごとに、そのプールから4人を選ぶ。
   ⚠️ 卓(セッション)は最初の半荘を保存するまで作られない。それまでの指定は
      pendingPool に持ち、保存時に卓へ移す。pendingPool は保存しない一時値。 */
let pendingPool = null;
// その卓で実際に打った人(プールが空のときの復元元)
function seatsUsedIn(sid){
  const used=[];
  sessionGames(sid).forEach(g=>g.seats.forEach(id=>{ if(id && !used.includes(id)) used.push(id); }));
  return used;
}
function poolIds(){
  const alive=id=>S.players.some(p=>p.id===id);   // 削除されたメンバーは除く
  const s=openSession();
  if(s){
    const p=Array.isArray(s.pool)?s.pool.filter(alive):[];
    return p.length ? p : seatsUsedIn(s.id);
  }
  return (pendingPool||[]).filter(alive);
}
function setPool(ids){
  const uniq=[...new Set(ids)].filter(id=>S.players.some(p=>p.id===id));
  const s=openSession();
  if(s){ s.pool=uniq; save(); } else { pendingPool=uniq; }
}
function addToPool(ids){ setPool([...poolIds(), ...ids]); }
function sessionById(sid){ return S.sessions.find(s=>s.id===+sid) || null; }
function sessionGames(sid){ return S.games.filter(g=>g.sid===+sid); }
// 進行中の卓を返す。無ければ作る(半荘を保存する瞬間にだけ呼ぶこと)
function ensureSession(){
  let s=openSession();
  if(!s){
    // 卓を開くときに、それまでの暫定プールを引き継ぐ(§6-31)
    s={id:S.nextId++, t:Date.now(), closedAt:null, pool:(pendingPool||[]).slice()};
    S.sessions.push(s);
    pendingPool=null;
  }
  return s;
}
// 卓の表示名。同じ日に複数の卓があれば「第N卓」を付けて区別する
function sessionLabel(s){
  if(!s) return '';
  const day=dstr(s.t);
  const sameDay=S.sessions.filter(x=>dstr(x.t)===day).sort((a,b)=>a.t-b.t);
  const idx=sameDay.findIndex(x=>x.id===s.id);
  const nth = sameDay.length>1 ? ` 第${idx+1}卓` : '';
  return `${day.replaceAll('-','/')}${nth}`;
}
function sessionIsEmpty(s){
  return !sessionGames(s.id).length
    && !Object.keys(peekChips(s.id).counts).length
    && !S.expenses[s.id];
}
async function closeSession(){
  const s=openSession();
  if(!s){ toast('確定できる進行中の卓がありません','error'); return; }
  const n=sessionGames(s.id).length;
  if(!n){ toast('半荘が1局も記録されていません','error'); return; }
  if(!(await confirmDialog(`${sessionLabel(s)} の精算を確定します(全${n}局)。\n確定すると記録に残り、次の半荘から新しい卓として始まります。`, {okText:'確定'}))) return;
  s.closedAt=Date.now();
  settleSid=s.id; // 精算タブは集計した卓を表示する
  /* 次の卓は「同じ面子の続き」であることが多いので、参加メンバーと席をそのまま引き継ぐ。
     ⚠️ ここを空にしないこと。プルダウンが全部ブランクになり、毎回4人を選び直すことになります(§6-31)。
        面子が変わるときは、変えたい席のプルダウンだけ選び直せば済みます。 */
  pendingPool=(Array.isArray(s.pool)&&s.pool.length ? s.pool : seatsUsedIn(s.id)).slice();
  cur=resetCur(); activeCell=null; autoPid=null;
  save(); renderGame(); renderTotal();
  toast('精算を確定しました', 'ok', {label:'取り消す', onClick:()=>{
    s.closedAt=null; save(); renderGame(); renderTotal();
  }});
}
// 確定済みの卓を開き直す。あとから半荘やチップを足したいとき用。
// 進行中の卓は同時に1つだけなので、他に開いているものがあれば閉じる。
async function reopenSession(sid){
  const s=sessionById(sid);
  if(!s || !s.closedAt) return;
  const cur=openSession();
  if(cur && cur.id!==s.id){
    if(!(await confirmDialog(`現在進行中の「${sessionLabel(cur)}」を確定して、「${sessionLabel(s)}」を再開します。よろしいですか?`, {okText:'再開'}))) return;
    cur.closedAt=Date.now();
  }
  s.closedAt=null;
  settleSid=s.id;
  save(); renderGame(); renderTotal();
  toast(`${sessionLabel(s)} を再開しました`, 'ok');
}

/* ---------- チップ(全ゲーム終了時) ----------
   S.chips = {'YYYY-MM-DD': {price, start, counts:{pid: 最終枚数}}}
   ⚠️ counts に入れるのは**所持枚数**(例: 25 / 17)。増減ではありません。
      増減は `所持枚数 − CHIP_ORIGIN(20)` で求めます。
      形式印 `v:CHIP_FMT` が無いデータは「増減」だった頃のものなので、
      normalize が原点を足し戻します(§6-26)。
   単価(price)を卓ごとに固定しているので、あとで設定を変えても
   過去の卓のチップ精算額は変わらない(games[].rate と同じ考え方)。
   ⚠️ 集計時は必ずその卓の price を使うこと。S.settings を使ってはいけない。 */
function todayStr(){ return dstr(Date.now()); }
// 読み取り専用。記録がない卓は現在の設定を既定値として返すだけで、S.chips は書き換えない。
function peekChips(sid){
  return S.chips[sid] || {price:S.settings.chipPrice, counts:{}, v:CHIP_FMT};
}
// 書き込み用。setDayChip からのみ呼ぶこと。
function chipsOf(sid){
  if(!S.chips[sid]) S.chips[sid]={price:S.settings.chipPrice, counts:{}, v:CHIP_FMT};
  return S.chips[sid];
}
// その卓の実参加者。
// ⚠️ 「該当者がいなければ登録メンバー全員を返す」処理を絶対に足さないこと(§6-1)。
function dayParticipants(sid){
  const set=new Set();
  sessionGames(sid).forEach(g=>g.seats.forEach(pid=>set.add(pid)));
  Object.keys(peekChips(sid).counts).forEach(pid=>set.add(+pid));
  // 「進行中の卓にまだ何も記録がない」場合のみ、対局タブで選択中のメンバーを仮参加者とする
  // (1局も保存する前に場代を入力できるようにするための、意図的で限定的なフォールバック)
  const s=sessionById(sid);
  if(!set.size && s && !s.closedAt){
    const seated=curSeats();
    if(seated.length===npOf()) seated.forEach(id=>set.add(id));
  }
  return [...set].filter(pid=>S.players.some(p=>p.id===pid));
}
/* チップの編集中 pid(§6-42)。表のセルを入力に切り替えるのに使う。
   ⚠️ 再描画のたびにクリアしないこと。 */
let chipEditPid = null;
/* ⚠️ focus だけにすること。select() すると既存の値が全選択され、
   「直すつもりが1文字打っただけで消えた」という事故になります(§6-46)。 */
function editChip(pid){ chipEditPid=+pid; renderTotal();
  setTimeout(()=>{ const i=document.querySelector(`#settleTable input[data-chip="${pid}"]`);
    if(i){ i.focus(); try{ const n=i.value.length; i.setSelectionRange(n,n); }catch(e){} } },0); }
/* チップの検算。⚠️ 入力の途中では出さないこと(全員そろってから・§6-26)。 */
function chipNote(){
  const d=settleSid;
  if(!d) return '';
  const c=peekChips(d).counts;
  const pids=dayParticipants(d);
  const entered=Object.keys(c).length;
  const diff=Object.values(c).reduce((a,n)=>a+(n-CHIP_ORIGIN),0);
  if(!pids.length) return '';
  /* ⚠️ メッセージは短く。長い説明文を戻さないこと(§6-46) */
  if(entered>=pids.length){
    return diff===0 ? `<div class="ok">✓ 合計 0枚</div>`
      : `<div class="warn">チップ枚数エラー：${fmt(diff)}枚</div>`;
  }
  /* ⚠️ 入力途中にヒント文を出さないこと(§6-44)。
     入力欄のプレースホルダ(0)と、全員そろったときの検算で足ります。 */
  return '';
}
/* チップ欄の符号モード {pid: -1}。点数入力の cur.signs と同じ考え方(§6-20)。
   大きく負けて原点を割り込んだとき、モバイルの数字キーパッドにはマイナスキーが無いため
   ± ボタンで切り替える。⚠️ 値を入れる前にも押せること。
   卓を切り替えたらリセットする(別の卓の符号を引きずらないため)。 */
let chipSigns={};
function applyChipSign(pid, v){
  if(v==='' || v==='-' || v==='−') return null;
  const n=+v;
  if(!isFinite(n)) return null;
  if(n<0) chipSigns[pid]=-1;            // 直接マイナスを打った → 符号モードを合わせる
  return Math.abs(Math.round(n)) * (chipSigns[pid]===-1 ? -1 : 1);
}
function toggleChipSign(d,pid){
  chipSigns[pid] = chipSigns[pid]===-1 ? 1 : -1;
  const cur=peekChips(d).counts[pid];
  if(cur!==undefined){
    // counts は所持枚数。符号を反転するのは「増減」の側(§6-38)
    const delta=cur-CHIP_ORIGIN;
    if(delta!==0){ chipsOf(d).counts[pid] = CHIP_ORIGIN + Math.abs(delta)*chipSigns[pid]; save(); }
  }
  renderTotal();
}
function setDayChip(d,pid,v){
  chipEditPid=null;   // 入力が済んだらリザルト表示へ戻す(§6-37)
  const meta=chipsOf(d);
  const n=applyChipSign(pid, v);   // n は入力された「増減」
  /* ⚠️ 入力は増減だが、**保存は所持枚数のまま**(counts + v:2)。
     保存形式を増減に戻すと、過去データと見分けが付かなくなります(§6-26 の形式印)。
     ここで原点を足してから入れること。 */
  if(n===null){ delete meta.counts[pid]; }
  else { meta.counts[pid]=CHIP_ORIGIN + n; }
  if(!Object.keys(meta.counts).length) delete S.chips[d]; // 全部消したら卓ごと削除
  save(); renderTotal();
}

/* ---------- 精算 ----------
   day: 'YYYY-MM-DD' を渡すとその日だけを集計する。null / 省略時は全期間の通算。
   ⚠️ 金額は必ず対局ごとの g.rate / その日の chips[].price・start を使うこと。
      S.settings.rate / chipPrice を集計に使ってはいけない(過去分が動く)。 */
function totals(sid){
  const day = sid; // 以降のキーはすべてセッションID
  const map={};
  S.players.forEach(p=> map[p.id]={pid:p.id, name:p.name, n:0, top:0, rankSum:0, pt:0, chips:0, ptMoney:0, chipYen:0, money:0, exp:0, tobi:0});
  const games = day ? sessionGames(day) : S.games;
  games.forEach(g=>{
    g.seats.forEach((pid,i)=>{
      const t=map[pid]; if(!t) return;
      t.n++; t.rankSum+=g.ranks[i]+1; if(g.ranks[i]===0)t.top++;
      t.pt+=g.pts[i];
      t.ptMoney+=Math.round(g.pts[i]*g.rate*10);
      if((g.tobi||[]).some(x=>x.loser===i))t.tobi++;
    });
  });
  const chipDays = day ? (S.chips[day] ? [day] : []) : Object.keys(S.chips);
  chipDays.forEach(d=>{
    const m=peekChips(d);
    Object.entries(m.counts).forEach(([pid,n])=>{
      const t=map[pid]; if(!t) return;
      t.chips += (n - CHIP_ORIGIN);              // counts は所持枚数。原点を引いて増減にする
      t.chipYen += (n - CHIP_ORIGIN) * m.price;
    });
  });
  // 場代・飲食は日ごとに、その日の実参加者だけに割り振る(日を跨いで混ざらないようにする)
  const expDays = day ? (S.expenses[day] ? [day] : []) : Object.keys(S.expenses);
  expDays.forEach(d=>{
    const shares=venueShareMap(d);
    const ex=peekExpenses(d);
    const pids=new Set([...Object.keys(shares).map(Number), ...Object.keys(ex.personal||{}).map(Number)]);
    pids.forEach(pid=>{
      const t=map[pid]; if(!t) return;
      t.exp -= costOf(d, pid, shares); // 費用はマイナス計上
    });
  });
  S.players.forEach(p=>{
    const t=map[p.id]; if(!t) return;
    t.money = t.ptMoney + t.chipYen;
  });
  return Object.values(map).filter(t=>t.n>0 || t.exp!==0 || t.chips!==0)
    .sort((a,b)=>(b.money+b.exp)-(a.money+a.exp));
}
/* ---------- 精算タブの対象卓 ----------
   セッションID = その卓だけ / null = 通算(全期間) / undefined = 未初期化(初回に既定値を入れる)
   ⚠️ undefined と null を区別している。null は「ユーザーが自分で通算を選んだ」状態なので、
      再描画のたびに既定へ戻してはいけない。
   チップ・場代の入力欄もこの卓を対象にするため、過去の卓を選べば後から修正できる。 */
let settleSid = undefined;
function settleSidOptions(){
  // 対局・チップ・場代のいずれかが記録されている卓 + 進行中の卓
  const used=new Set([
    ...S.games.map(g=>g.sid),
    ...Object.keys(S.chips).map(Number),
    ...Object.keys(S.expenses).map(Number)
  ]);
  return S.sessions.filter(s=>used.has(s.id) || !s.closedAt).sort((a,b)=>b.t-a.t);
}
// 既定は「進行中の卓」。無ければ直近に確定した卓。
function defaultSettleSid(){
  const open=openSession();
  if(open) return open.id;
  const opts=settleSidOptions();
  return opts.length ? opts[0].id : null;
}
function setSettleSid(v){
  settleSid = v==='__all__' ? null : +v;
  chipSigns={}; // 別の卓に符号モードを持ち越さない
  renderTotal();
}
/* 対局精算カード: 点数 + チップ = 合計(§6-36)。
   ⚠️ 場代はここに混ぜないこと。別カード(renderExpenses)で完全に分けています。 */
/* チップのセル。入力前・編集中は[+][入力欄]、入力済みはタップで戻せる結果表示(§6-42)。
   ⚠️ チップの入力欄をこの表の外に出さないこと。別の場所に置くと、
      誰の分を入れているのか表と見比べる手間が戻ります。 */
function chipCell(pid, closed){
  const d=settleSid;
  const meta=peekChips(d), c=meta.counts;
  const has=c[pid]!==undefined;
  const delta=has ? c[pid]-CHIP_ORIGIN : 0;
  if(closed){   // 精算確定済みの卓は読み取り専用(§6-42)
    return has ? `${yen(delta*meta.price)}<span class="sub2">${fmt(delta)}枚</span>` : '-';
  }
  if(has && chipEditPid!==pid){
    return `<button type="button" class="chipcell ${cls(delta)}"
      aria-label="${esc(pname(pid))} のチップを編集" onclick="editChip(${pid})">
      ${yen(delta*meta.price)}<span class="sub2">${fmt(delta)}枚</span></button>`;
  }
  const minus=chipSigns[pid]===-1;
  return `<span class="chipedit">
    <button type="button" class="chipsign ${minus?'on':''}" aria-pressed="${minus}"
      aria-label="${esc(pname(pid))} の符号を切り替え" onclick="toggleChipSign('${d}',${pid})">${minus?'−':'+'}</button>
    <input type="text" inputmode="numeric" data-chip="${pid}" placeholder="0"
      aria-label="${esc(pname(pid))} の増減枚数(原点からの差)"
      value="${has?delta:''}" onchange="setDayChip('${d}',${pid},this.value)"
      onkeydown="if(event.key==='Enter'){event.preventDefault(); this.blur();}"></span>`;
}
function renderSettleTable(ts){
  const el=document.getElementById('settleTable');
  if(!el) return;
  if(!ts.length){ el.innerHTML='<div class="hint">この卓の記録はまだありません</div>'; return; }
  const sess=sessionById(settleSid);
  const closed=!!(sess && sess.closedAt);
  el.innerHTML=`<table class="settletbl"><tr><th scope="col">名前</th><th scope="col">点数</th><th scope="col">チップ</th><th scope="col">合計</th></tr>`+
    ts.map((t,idx)=>`<tr class="${idx===0?'rank1':''}"><td>${idx===0?CROWN:''}${esc(t.name)}</td>
      <td class="${cls(t.ptMoney)}">${yen(t.ptMoney)}<span class="sub2">${fmt(t.pt)}pt</span></td>
      <td class="chipcol">${chipCell(t.pid, closed)}</td>
      <td class="${cls(t.money)} bigmoney">${yen(t.money)}</td></tr>`).join('')
    +`</table>`+ chipNote();
}
/* 精算の確定(卓を締めてアーカイブ)。
   ⚠️ 卓を締める導線は**この画面だけ**。対局タブの「集計」は廃止しました(§6-42)。 */
function renderSettleConfirm(){
  const el=document.getElementById('settleConfirmBody');
  if(!el) return;
  const s=settleSid ? sessionById(settleSid) : null;
  if(!s){ el.innerHTML='<div class="hint">卓がまだありません</div>'; return; }
  const n=sessionGames(s.id).length;
  if(s.closedAt){
    el.innerHTML = `<div class="ok">✓ ${sessionLabel(s)} は精算済み</div>`
      + `<div class="hint mt">次の半荘を記録すると、新しい卓として始まります</div>`;
    return;
  }
  /* ⚠️ 確定できるときに説明文を出さないこと(§6-44)。ボタンの文言で足ります。
     押せないとき(0局)だけ、理由を一行だけ添える。 */
  el.innerHTML = `<button class="btn main" onclick="closeSession()" ${n?'':'disabled'}>精算を確定する</button>`
    + (n ? '' : `<div class="hint mt">半荘を1局でも記録すると確定できます</div>`);
}
function renderTotal(){
  const opts=settleSidOptions();
  // 初回表示、または選択中の卓が候補から消えた場合(その卓の対局を全部削除したなど)は
  // 既定に戻す。ユーザーが明示的に選んだ「通算」(null)はそのまま維持する。
  if(settleSid===undefined || (settleSid!==null && !opts.some(s=>s.id===settleSid))){
    settleSid=defaultSettleSid();
  }
  /* ⚠️ 卓の選択UIは廃止した(§6-37)。常に defaultSettleSid()=最新の卓を見せる。
     過去の卓を振り返りたいときはメンバータブの個人ページを使う。 */
  renderExpenses();
  renderSettleConfirm();
  const ts=totals(settleSid);
  renderSettleTable(ts);
  renderShareCanvas(ts);
}

/* ---------- 共有用の戦績画像(対局+チップ。場代・飲食は含めない) ---------- */
function cssVar(name, fallback){
  try{
    const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }catch(e){ return fallback; }
}
function buildResultCanvas(ts, day){
  const st=S.settings;
  const dpr=Math.min(window.devicePixelRatio||1, 3);
  const W=680, rowH=48, headH=124, footH=36;
  const rows=ts.length||1;
  const H=headH+rowH*rows+footH;
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  const ctx=canvas.getContext && canvas.getContext('2d');
  if(!ctx) return null; // 2D Canvasに未対応の環境(通常のブラウザでは発生しない)
  ctx.scale(dpr,dpr);

  const bg=cssVar('--card','#FFFFFF'), card2=cssVar('--card2','#F8F8FB'), txt=cssVar('--txt','#1A1A1C'),
    sub=cssVar('--sub','#595959'), line=cssVar('--line','#D8D8DB'), acc=cssVar('--acc','#0017C1'),
    goldBg=cssVar('--gold-bg','#FFF3CD'), green=cssVar('--green','#197A4B'), red=cssVar('--red','#CE0000');
  const FONT='"Noto Sans JP","Hiragino Sans",sans-serif';

  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ctx.fillStyle=txt; ctx.font=`700 24px ${FONT}`; ctx.textBaseline='alphabetic';
  ctx.fillText('麻雀戦績', 24, 38);
  // 見出しは精算タブで選択中の対象日に合わせる(「通算」なら全期間と明示する)
  const nGames = day ? sessionGames(day).length : S.games.length;
  const chipMeta = day ? peekChips(day) : S.settings;
  const chipPrice = day ? chipMeta.price : st.chipPrice;
  ctx.fillStyle=sub; ctx.font=`400 13px ${FONT}`;
  ctx.fillText(day ? sessionLabel(sessionById(day)) : '通算(全期間)', 24, 60);
  ctx.fillText(`点${st.rate} / ウマ${st.uma2}-${st.uma1} / チップ${chipPrice}円 / ${nGames}半荘`, 24, 80);

  ctx.strokeStyle=line; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(24, headH-14); ctx.lineTo(W-24, headH-14); ctx.stroke();

  const xName=24, xN=W-420, xPt=W-320, xChip=W-208, xTotal=W-24;
  ctx.fillStyle=sub; ctx.font=`700 12px ${FONT}`; ctx.textAlign='left';
  ctx.fillText('名前', xName, headH+4);
  ctx.textAlign='right';
  ctx.fillText('半荘', xN, headH+4);
  ctx.fillText('対局', xPt, headH+4);
  ctx.fillText('チップ', xChip, headH+4);
  ctx.fillText('合計', xTotal, headH+4);

  if(!ts.length){
    ctx.textAlign='center'; ctx.fillStyle=sub; ctx.font=`400 15px ${FONT}`;
    ctx.fillText('対局データがありません', W/2, headH+rowH/2+18);
  }
  ts.forEach((t,idx)=>{
    const y=headH+14+rowH*idx;
    if(idx===0){ ctx.fillStyle=goldBg; ctx.fillRect(16, y, W-32, rowH-8); }
    else if(idx%2===1){ ctx.fillStyle=card2; ctx.fillRect(16, y, W-32, rowH-8); }
    const baseY=y+26;
    ctx.textAlign='left'; ctx.fillStyle=txt; ctx.font=`${idx===0?'700':'600'} 16px ${FONT}`;
    ctx.fillText((idx===0?'\u{1F451} ':'')+t.name, xName+4, baseY);

    ctx.textAlign='right'; ctx.font=`400 14px ${FONT}`; ctx.fillStyle=sub;
    ctx.fillText(t.n+'', xN, baseY);

    ctx.fillStyle=t.ptMoney>0?green:(t.ptMoney<0?red:txt); ctx.font=`600 14px ${FONT}`;
    ctx.fillText(yen(t.ptMoney), xPt, baseY);

    ctx.fillStyle=t.chips?(t.chipYen>0?green:(t.chipYen<0?red:txt)):sub;
    ctx.fillText(t.chips?yen(t.chipYen):'-', xChip, baseY);

    ctx.fillStyle=t.money>0?green:(t.money<0?red:txt); ctx.font=`700 16px ${FONT}`;
    ctx.fillText(yen(t.money), xTotal, baseY);
  });

  ctx.textAlign='right'; ctx.fillStyle=sub; ctx.font=`400 11px ${FONT}`;
  ctx.fillText('マーログ', W-24, H-14);

  return canvas;
}
function renderShareCanvas(ts){
  const wrap=document.getElementById('shareCanvasWrap');
  const src=document.getElementById('shareCanvas');
  if(!src) return;
  try{
    const built=buildResultCanvas(ts, settleSid);
    if(!built){ if(wrap) wrap.style.display='none'; return; }
    const ctx=src.getContext('2d');
    src.width=built.width; src.height=built.height;
    src.style.width=(built.width/(Math.min(window.devicePixelRatio||1,3)))+'px';
    ctx.drawImage(built,0,0);
    if(wrap) wrap.style.display = 'block';
  }catch(e){ if(wrap) wrap.style.display='none'; }
  const btn=document.getElementById('shareBtn');
  if(btn) btn.disabled = !ts.length;
}
// 画像ファイルとして自動ダウンロード(共有・クリップボードのいずれも失敗/未対応の場合の最終フォールバック)
async function downloadResultImage(blobPromise){
  try{
    const blob = await blobPromise;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='mahjong_result.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('共有に対応していないため、画像を端末に保存しました','ok');
  }catch(e){
    toast('画像の保存に失敗しました','error');
  }
}
async function shareResult(){
  const ts=totals(settleSid);
  if(!ts.length){ toast('対局データがありません','error'); return; }
  const canvas=buildResultCanvas(ts, settleSid);
  if(!canvas){ toast('この端末では画像の生成に対応していません','error'); return; }

  // canvas.toBlob 自体は非同期(コールバック)だが、Promiseはユーザー操作(クリック)の
  // 直後にここで同期的に生成しておき、navigator.share / clipboard.write へは
  // このPromiseをそのまま渡す(await で一度解決してから渡すと、SafariやLINE内ブラウザで
  // 「ユーザー操作起因ではない」と判定されクリップボード書き込みが失敗することがあるため)。
  const blobPromise = new Promise((resolve, reject)=>{
    try{ canvas.toBlob(b=> b?resolve(b):reject(new Error('toBlob failed')), 'image/png'); }
    catch(e){ reject(e); }
  });

  // 1. まずファイル共有(Web Share API Level 2)を試みる
  if(navigator.share){
    try{
      const blob = await blobPromise;
      const file = new File([blob], 'mahjong_result.png', {type:'image/png'});
      if(!navigator.canShare || navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'麻雀戦績'});
        return;
      }
    }catch(e){
      if(e && e.name==='AbortError') return; // ユーザーが共有シートを自分でキャンセルした場合は何もしない
      // 共有に失敗した場合はエラーを握り潰さず、次のクリップボードへフォールバックする
    }
  }

  // 2. クリップボードへの画像コピー(Safari推奨の記法: 未解決のPromiseをそのままClipboardItemに
  //    渡すことで、clipboard.write の呼び出し自体をユーザー操作の直後・同期的に実行できる)
  if(navigator.clipboard && window.ClipboardItem){
    try{
      await navigator.clipboard.write([
        new window.ClipboardItem({'image/png': blobPromise})
      ]);
      toast('この端末は画像共有に対応していないため、画像をクリップボードにコピーしました','ok');
      return;
    }catch(e){
      // クリップボードへの書き込みも失敗した場合はエラーを握り潰さず、ダウンロードへフォールバックする
    }
  }

  // 3. どちらも失敗・未対応の場合は画像ファイルとして自動ダウンロード
  await downloadResultImage(blobPromise);
}

      assert('チップ±: 直接マイナスを打つと符号モードが同期する',
        applyChipSign(2,'-3')===-3 && chipSigns[2]===-1);
      assert('チップ±: 空は null', applyChipSign(1,'')===null);
    } finally { chipSigns=JSON.parse(csBak); }

    /* 入力は「増減」、保存は「所持枚数」(§6-38)。
       ⚠️ 保存形式を増減に戻さないこと。過去データと見分けが付かなくなります(§6-26)。 */
    const chBak=JSON.stringify(S.chips);
    try{
      S.chips={};
      setDayChip(970, 1, '5');     // +5枚
      setDayChip(970, 2, '-3');    // -3枚
      setDayChip(970, 3, '0');     // 増減なし
      assert('チップ入力: 増減で入れると所持枚数で保存される',
        S.chips[970].counts[1]===CHIP_ORIGIN+5 && S.chips[970].counts[2]===CHIP_ORIGIN-3);
      assert('チップ入力: 0 も記録される(未入力と区別する)', S.chips[970].counts[3]===CHIP_ORIGIN);
      assert('チップ入力: 形式印(v)が付く', S.chips[970].v===CHIP_FMT);
      const t=totals(970);
      assert('チップ入力: 集計に出る増減が入力どおり',
        (t.find(x=>x.name==='q1')||{chips:null}).chips===5);
      setDayChip(970, 1, '');      // 空にすると消える
      assert('チップ入力: 空にすると消える', S.chips[970].counts[1]===undefined);
    } finally { S.chips=JSON.parse(chBak); }

    // 【回帰防止】チップを入力したら、その人の行に枚数が出ること(§6-26)
    //  表示を落としてしまい「入力しても反映されない」ように見えた事故がある
    S.players=[{id:1,name:'q1'},{id:2,name:'q2'},{id:3,name:'q3'},{id:4,name:'q4'}];
    S.sessions=[{id:930,t:Date.now(),closedAt:null}];
    S.games=[{sid:930, t:Date.now(), seats:[1,2,3,4], scores:[25000,25000,25000,25000],
      pts:[0,0,0,0], ranks:[0,1,2,3], rate:5, uma1:30, uma2:10, tobi:[]}];
    S.chips={930:{price:500, counts:{1:25, 2:18}, v:CHIP_FMT}}; S.expenses={}; // 所持枚数
    settleSid=930;
    renderSettleTable(totals(930));
    const chipHtml=document.getElementById('settleTable').innerHTML;
    assert('チップ表示: 所持枚数から求めた増減が表のセルに出る',
      /\+5枚/.test(chipHtml) && /-2枚/.test(chipHtml));
    // ゼロサムのチェック: 全員そろうまでは警告を出さない
    assert('チップ検算: 入力途中は警告を出さない', !/エラー/.test(chipHtml));
    S.chips={930:{price:500, counts:{1:25, 2:18, 3:20, 4:20}, v:CHIP_FMT}}; // 増減合計 +3枚
    renderSettleTable(totals(930));
    const badHtml=document.getElementById('settleTable').innerHTML;
    assert('チップ検算: 全員そろって合計が0でなければ警告', /チップ枚数エラー/.test(badHtml) && /\+3枚/.test(badHtml));
    S.chips={930:{price:500, counts:{1:25, 2:18, 3:20, 4:17}, v:CHIP_FMT}}; // 増減合計 0
    renderSettleTable(totals(930));
    assert('チップ検算: 合計0なら OK 表示',
      /✓ 合計 0枚/.test(document.getElementById('settleTable').innerHTML));
    /* 精算を確定した卓は、チップのセルが入力欄にならないこと(§6-42) */
    S.sessions=[{id:930,t:Date.now(),closedAt:Date.now()}];
    renderSettleTable(totals(930));
    assert('精算確定後: チップは読み取り専用',
      !/data-chip=/.test(document.getElementById('settleTable').innerHTML));
    /* 未入力の人のセルは入力欄になる。
       ⚠️ 全員入力済みのときは「結果表示(タップで編集)」なので data-chip は出ない。
          ここを全員入力済みで試すと誤って落ちます。 */
    S.sessions=[{id:930,t:Date.now(),closedAt:null}];
    S.chips={930:{counts:{1:25}, v:CHIP_FMT}};
    renderSettleTable(totals(930));
    const openHtml=document.getElementById('settleTable').innerHTML;
    assert('未入力の人は入力欄になる', /data-chip=/.test(openHtml));
    assert('入力済みの人は結果表示(タップで編集)', /class="chipcell/.test(openHtml));
    S.chips={};

    // 半荘を編集したとき、当時のウマで再計算されること(現在の設定で上書きされない)
    // scores=[40000,30000,20000,10000] の4着(席3)は round56(-20000) = -20pt。
    //   当時のウマ(uma1:30) → -20 + (-30) = -50 / 現在のウマ(uma1:50) → -20 + (-50) = -70
    S.settings.uma1=50; S.settings.uma2=20; // 保存後に設定を変更
    const g0={sid:920, t:Date.now(), seats:[1,2,3,4], scores:[40000,30000,20000,10000],
      pts:[52,0,-12,-40], ranks:[0,1,2,3], rate:5, uma1:30, uma2:10, tobi:[]}; // uma1:30 / uma2:10 で保存済み
    assert('編集: 当時のウマで再計算される', calcPts(g0.scores, g0).pts[3]===-50);
    assert('編集: ウマを渡さないと現在の設定が使われる', calcPts(g0.scores).pts[3]===-70);
  } finally {
    S = JSON.parse(snapshot);
  }
  return results;
}
(function maybeRunSelfTests(){
  if(!/(?:^|[?&])test=1(?:&|$)/.test(location.search)) return;
  const r=runSelfTests();
  const pass=r.filter(x=>x.pass).length;
  const div=document.createElement('div');
  div.style.cssText='position:fixed; top:0; left:0; right:0; z-index:999; font-family:monospace; font-size:12px; '
    +'padding:6px 10px; color:#fff; background:'+(pass===r.length?'#197A4B':'#CE0000')+';';
  div.textContent = `SELF-TEST ${pass}/${r.length} passed`
    + (pass<r.length ? ' — FAILED: ' + r.filter(x=>!x.pass).map(x=>x.name).join(', ') : '');
  document.body.prepend(div);
  console.log('[self-test]', r);
  window.__selfTestResults = r;
})();

/* ---------- PWA(HTTPSでホストした場合のみ有効。file://直接実行時は何もしない)§6-32 ----------
   「単一HTMLファイル」の原則を守るため、manifest もアイコンも外部ファイルを作らない。

   ⚠️ manifest は **data: URL** で渡すこと。blob: URL は Safari が manifest として
      受け付けず、Chrome でも start_url の解決に失敗します(以前これで無効でした)。
   ⚠️ iOS の「ホーム画面に追加」は manifest を見ず、head の apple-touch-icon と
      apple-mobile-web-app-* メタだけを見ます。iPhone 対応の本体はそちら。
   ⚠️ Service Worker は登録しない。登録にはオリジンと同じ .js ファイルが必要で、
      blob: URL からは登録できません(かつて書いてあった登録コードは常に例外になり、
      何もしていませんでした)。完全オフラインが要るときは sw.js を別ファイルで置くこと。
      なお本アプリは外部リソースを一切読まないので、一度開けばブラウザキャッシュだけで
      オフラインでも起動します(保証はありません)。 */
(function setupPWA(){
  try{
    const iconEl=document.getElementById('pwaIcon');
    const icon=iconEl ? iconEl.getAttribute('href') : null;
    const manifest={
      name:'マーログ', short_name:'マーログ',
      // start_url はホストした場所に追従させる(GitHub Pages のサブパス等でも壊れないように)
      start_url: location.pathname + location.search,
      scope: location.pathname.replace(/[^/]*$/, ''),
      display:'standalone', orientation:'portrait',
      background_color:'#F1F1F4', theme_color:'#0017C1',
      lang:'ja',
      /* ⚠️ purpose:'maskable' を付けないこと。Android はマスク可能アイコンを
         中央80%の円に切り抜くため、横長のロゴが左右で欠けます。 */
      icons: icon ? [{src:icon, sizes:'384x384', type:'image/png', purpose:'any'}] : []
    };
    document.getElementById('pwaManifest').href =
      'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  }catch(e){}
})();
